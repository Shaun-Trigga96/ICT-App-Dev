<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #23b499;
        font-family: 'Open Sans', sans-serif;
        color: #fff;
    }
    
    select {
        -webkit-appearance: none;
        -moz-appearance: none;
        -ms-appearance: none;
        appearance: none;
        outline: 0;
        box-shadow: none;
        border: 0!important;
        background: #5c6664;
        background-image: none;
        flex: 1;
        padding: 0 .5em;
        color: #fff;
        cursor: pointer;
        font-size: 1em;
        font-family: 'Open Sans', sans-serif;
    }
    
    select::-ms-expand {
        display: none;
    }
    
    .select {
        position: relative;
        display: flex;
        width: 20em;
        height: 3em;
        line-height: 3;
        background: #5c6664;
        overflow: hidden;
        border-radius: .25em;
    }
    
    .select::after {
        content: '\25BC';
        position: absolute;
        top: 0;
        right: 0;
        padding: 0 1em;
        background: #2b2e2e;
        cursor: pointer;
        pointer-events: none;
        transition: .25s all ease;
    }
    
    .select:hover::after {
        color: #23b499;
    }
</style>

<h1>C</h1>

<!--Start Contact-form -->
<id="contact-form">
    <div class="col-lg-8 ">
        <form class="contact-form row" method="post" action="#" role="form">

            <div class="col-lg-6 mb-4">
                <div class="form-floating">
                    <label for="floatingname light-300">Name</label>
                    <input type="text" class="form-control form-control-lg light-300" id="floatingname" name="inputname" placeholder="Name">
                </div>
            </div>
            <br>
            <!-- End Input Name -->

            <div class="col-lg-6 mb-4">
                <div class="form-floating">
                    <label for="floatingemail light-300">Email</label>
                    <input type="text" class="form-control form-control-lg light-300" id="floatingemail" name="inputemail" placeholder="Email">
                </div>
            </div>
            <br>
            <!-- End Input Email -->

            <div class="col-lg-6 mb-4">
                <div class="form-floating">
                    <label for="floatingphone light-300">Phone</label>
                    <input type="text" class="form-control form-control-lg light-300" id="floatingphone" name="inputphone" placeholder="Phone">
                </div>
            </div>
            <br>
            <!-- End Input Phone -->

            <div class="col-lg-6 mb-4">
                <div class="form-floating">
                    <label for="floatingcompany light-300">Company Name</label>
                    <input type="text" class="form-control form-control-lg light-300" id="floatingcompany" name="inputcompany" placeholder="Company Name">

                </div>
            </div>
            <br>
            <!-- End Input Company Name -->

            <div class="col-12">
                <div class="form-floating mb-4">
                    <label for="floatingsubject light-300">Subject</label>
                    <input type="text" class="form-control form-control-lg light-300" id="floatingsubject" name="inputsubject" placeholder="Subject">

                </div>
            </div>
            <br>
            <!-- End Input Subject -->

            <div class="col-12">
                <div class="form-floating mb-3">
                    <label for="floatingtextarea light-300">Message</label>
                    <textarea class="form-control light-300" rows="8" placeholder="Message" id="floatingtextarea"></textarea>

                </div>
            </div>
            <br>
            <!-- End Textarea Message -->

            <div class="col-md-12 col-12 m-auto text-end">
                <button type="submit" class="btn btn-secondary rounded-pill px-md-5 px-4 py-2 radius-0 text-light light-300">Send
                      Message</button>
            </div>

        </form>
    </div>
    <br>
    </body>
</id="contact-form">
<!-- End Contact Form -->
