igraph, the sum of all in-degrees equals:",options:["V","E","2E","V \u2212 1"],answer:1,explain:"Each directed edge contributes exactly one in-degree."},{type:"tf",q:"BFS and DFS from the same start vertex always visit the vertices in the same order.",options:["True","False"],answer:1,explain:"On the lecture graph they give A,B,C,D,E and A,B,D,C,E."},{type:"mcq",q:"The queue in BFS on the lecture graph from A, right after A is dequeued and processed, contains:",options:["[B]","[B, C, D]","[B, C, D, E]","[C, D]"],answer:1,explain:"All of A's neighbours are enqueued."},{type:"mcq",q:"An edge list for a graph with 5 vertices and 6 edges stores how many entries?",options:["5","6","11","25"],answer:1,explain:"One entry per edge."},{type:"mcq",q:"Which statement is true for an undirected adjacency matrix?",options:["The diagonal must be all 1s","m[i][j] == m[j][i]","Each row sums to V","It uses O(E) space"],answer:1,explain:"It is symmetric."}]},Ax={id:"SO5",ready:!0,title:"Shortest paths and spanning trees: Prim, Kruskal, Dijkstra, Floyd-Warshall",summary:"Minimum spanning trees with Prim's and Kruskal's greedy algorithms, single-source shortest paths with Dijkstra, and all-pairs shortest paths with Floyd-Warshall.",why:"Laying fibre between towns at the lowest cost is a minimum spanning tree. Google Maps, internet routing (OSPF) and delivery planning are shortest-path problems. These four algorithms are the classic answers and appear on almost every DSA exam.",visualizers:["mst","dijkstra","floyd"],notes:[{t:"h",text:"1. Two different problems"},{t:"table",head:["Problem","Question it answers","Algorithms"],rows:[["Minimum spanning tree (MST)","Which edges connect all vertices with the smallest total weight?","Prim's, Kruskal's"],["Single-source shortest path","What is the cheapest route from one vertex to every other?","Dijkstra's (Bellman-Ford if weights can be negative)"],["All-pairs shortest path","What is the cheapest route between every pair of vertices?","Floyd-Warshall"]]},{t:"callout",kind:"warn",title:'The guide lists Prim and Kruskal under "shortest path"',text:"They do not find shortest paths. An MST minimises the **total** weight of a network that connects everyone; it does not minimise the distance between any particular pair. In the lecture graph the MST path from A to B is A\u2013C\u2013D\u2013B = 6, but the shortest path is the direct edge A\u2013B = 4."},{t:"h",text:"2. Prim's algorithm (MST)"},{t:"p",text:"A **spanning tree** connects all V vertices with exactly **V \u2212 1** edges and no cycles. Prim grows one tree from a start vertex. At each step it adds the **cheapest edge leaving the tree** (one end inside, one outside). It is **greedy**: it never reconsiders a choice."},{t:"table",head:["Step","Tree so far","Cheapest edge leaving the tree","Weight"],rows:[["1","{A}","A\u2013C (A\u2013B is 4, A\u2013D is 7)","2"],["2","{A, C}","C\u2013D","1"],["3","{A, C, D}","D\u2013B (A\u2013B is 4)","3"],["4","{A, B, C, D}","D\u2013E","5"]]},{t:"graph",g:"lecture",edges:["A-C","C-D","D-B","D-E"],caption:"The minimum spanning tree of the lecture graph: A\u2013C, C\u2013D, D\u2013B, D\u2013E, total weight 11."},{t:"h",text:"3. Kruskal's algorithm (MST)"},{t:"p",text:'Kruskal looks at the whole graph at once. **Sort all edges by weight**, then take each edge in order **unless it would create a cycle**. The cycle test is "are both ends already in the same component?", which a **disjoint set (union-find)** answers almost instantly (see SO6).'},{t:"table",head:["Edge (sorted)","Weight","Same component already?","Action"],rows:[["C\u2013D","1","No","Add"],["A\u2013C","2","No","Add"],["D\u2013B","3","No","Add"],["A\u2013B","4","Yes: A, B, C, D connected","Skip (cycle)"],["D\u2013E","5","No","Add (4 = V \u2212 1 edges, stop)"],["A\u2013D","7","\u2013","Not needed"]]},{t:"p",text:"Both give total weight **11**. When edge weights are all different, the MST is unique, so Prim and Kruskal must give the same tree."},{t:"table",head:["","Prim's","Kruskal's"],rows:[["Grows","One connected tree","A forest that merges into one tree"],["Needs","Priority queue (min-heap)","Sorted edge list + union-find"],["Time","O(E log V) with a binary heap; O(V\xB2) with a matrix","O(E log E), dominated by the sort"],["Better for","Dense graphs","Sparse graphs"]]},{t:"h",text:"4. Dijkstra's algorithm (single source)"},{t:"p",text:"Dijkstra keeps a tentative distance for every vertex: 0 for the source and \u221E for the rest. Repeatedly **pick the unvisited vertex with the smallest distance**, mark it final, and **relax** its edges: if `dist[u] + w(u,v) < dist[v]`, update `dist[v]` and record `prev[v] = u`."},{t:"p",text:"Trace from **A** on the lecture graph:"},{t:"table",head:["Visit (smallest)","A","B","C","D","E","What changed"],rows:[["start","0","\u221E","\u221E","\u221E","\u221E",""],["A (0)","**0**","4","2","7","\u221E","Relax A\u2013B, A\u2013C, A\u2013D"],["C (2)","0","4","**2**","3","\u221E","D: 2 + 1 = 3 < 7, update via C"],["D (3)","0","4","2","**3**","8","B: 3 + 3 = 6, not < 4, no change. E: 3 + 5 = 8"],["B (4)","0","**4**","2","3","8","Nothing to improve"],["E (8)","0","4","2","3","**8**","Done"]]},{t:"p",text:"**Final distances from A: B = 4, C = 2, D = 3, E = 8.** Paths from the prev pointers: A\u2192B directly, A\u2192C, A\u2192C\u2192D, A\u2192C\u2192D\u2192E."},{t:"callout",kind:"warn",title:"Check this against your Term 3 study notes",text:"The Dijkstra table in `ADP470S_Term3_Study_Notes.docx` gives **B = 3 (via D)**. That is wrong: going A\u2192C\u2192D\u2192B costs 2 + 1 + 3 = **6**, which is more than the direct edge A\u2192B = **4**. The correct answer is B = 4. The other distances in that table (C = 2, D = 3, E = 8) are right."},{t:"code",title:"Dijkstra with a priority queue",java:`static int[] dijkstra(List<List<int[]>> adj, int src) {
    int n = adj.size();
    int[] dist = new int[n];
    Arrays.fill(dist, Integer.MAX_VALUE);
    dist[src] = 0;
    // entries are {vertex, distance}; smallest distance first
    PriorityQueue<int[]> pq = new PriorityQueue<>(Comparator.comparingInt(a -> a[1]));
    pq.add(new int[]{src, 0});

    while (!pq.isEmpty()) {
        int[] top = pq.poll();
        int u = top[0];
        if (top[1] > dist[u]) continue;            // stale entry: u was already finalised

    return d`},{t:"table",head:["","Dijkstra","Floyd-Warshall"],rows:[["Answers","One source to all vertices","Every pair of vertices"],["Negative edges","Not allowed","Allowed (no negative cycles)"],["Technique","Greedy + priority queue","Dynamic programming"],["Time","O((V + E) log V)","O(V\xB3)"],["Space","O(V)","O(V\xB2)"]]}],concepts:[{term:"Spanning tree",def:"A subgraph that connects all V vertices with exactly V \u2212 1 edges and no cycles."},{term:"Minimum spanning tree (MST)",def:"A spanning tree with the smallest possible total edge weight."},{term:"Greedy algorithm",def:"Builds a solution by always taking the locally best choice and never undoing it."},{term:"Prim's algorithm",def:"Grows an MST from one vertex by repeatedly adding the cheapest edge leaving the tree."},{term:"Kruskal's algorithm",def:"Builds an MST by taking edges in increasing weight order, skipping any that would form a cycle."},{term:"Relaxation",def:"Checking whether going through u gives a shorter path to v, and updating dist[v] if it does."},{term:"Dijkstra's algorithm",def:"Single-source shortest paths for non-negative weights; repeatedly finalises the closest unvisited vertex."},{term:"Bellman-Ford",def:"Single-source shortest paths that allows negative weights; O(V\xB7E)."},{term:"Floyd-Warshall",def:"All-pairs shortest paths by dynamic programming over intermediate vertices; O(V\xB3)."},{term:"Negative cycle",def:"A cycle whose total weight is negative; shortest paths through it are undefined."}],mnemonics:[{title:"Prim Plants, Kruskal Collects",text:"Prim Plants one tree and grows it. Kruskal Collects the cheapest edges from anywhere and joins them up."},{title:"Dijkstra picks the Closest",text:"Each round, the closest unvisited vertex becomes final, like the nearest ripple when you drop a stone in water."},{title:"K on the outside",text:'Floyd-Warshall loop order is k, i, j. "K is the Key, so it goes on the outside."'},{title:"MST \u2260 shortest path",text:"A Minimum Spanning Tree is about the cheapest Network, not the cheapest Trip."}],pitfalls:["Putting k as an inner loop in Floyd-Warshall. The result is wrong; k must be the outermost loop.","Using Integer.MAX_VALUE as infinity and adding to it, which overflows to a negative number.","Running Dijkstra on a graph with negative weights.","Treating an MST as a shortest-path tree. They are generally different trees.","Forgetting to stop Kruskal at V \u2212 1 edges, or adding an edge that joins two vertices already in the same component.","In Prim, choosing the cheapest edge out of the last vertex added, instead of out of the whole tree."],examples:[{title:"Kruskal on a 7-vertex graph",problem:"Edges: A\u2013B 7, A\u2013D 5, B\u2013C 8, B\u2013D 9, B\u2013E 7, C\u2013E 5, D\u2013E 15, D\u2013F 6, E\u2013F 8, E\u2013G 9, F\u2013G 11. Find the MST and its weight.",steps:["Sorted: A\u2013D 5, C\u2013E 5, D\u2013F 6, A\u2013B 7, B\u2013E 7, B\u2013C 8, E\u2013F 8, B\u2013D 9, E\u2013G 9, F\u2013G 11, D\u2013E 15.","Add A\u2013D 5, C\u2013E 5, D\u2013F 6, A\u2013B 7 (all join different components).","Add B\u2013E 7: joins {A,B,D,F} with {C,E}.","B\u2013C 8: B and C now in the same component, skip. E\u2013F 8: skip. B\u2013D 9: skip.","Add E\u2013G 9. That is 6 = V \u2212 1 edges, stop."],answer:"MST: A\u2013D, C\u2013E, D\u2013F, A\u2013B, B\u2013E, E\u2013G. Total weight 39."},{title:"Dijkstra on the same graph",problem:"Find the shortest distance from A to every vertex in the 7-vertex graph above.",steps:["Visit A (0): B = 7, D = 5.","Visit D (5): B stays 7 (5 + 9 = 14), E = 5 + 15 = 20, F = 5 + 6 = 11.","Visit B (7): C = 15, E = min(20, 7 + 7) = 14.","Visit F (11): E stays 14 (11 + 8 = 19), G = 11 + 11 = 22.","Visit E (14): C stays 15 (14 + 5 = 19), G stays 22 (14 + 9 = 23).","Visit C (15), then G (22)."],answer:"A 0, B 7, C 15, D 5, E 14, F 11, G 22."},{title:"One Floyd-Warshall round",problem:"Starting from the direct-edge matrix of the lecture graph, apply k = C. Which cells change?",steps:["For every pair (i, j), test D[i][C] + D[C][j] < D[i][j].","Only A and D are direct neighbours of C, so only pairs between them can improve.","A\u2192D: D[A][C] + D[C][D] = 2 + 1 = 3 < 7. Update to 3, and D\u2192A by symmetry.","B and E have no direct edge to C (\u221E), so nothing through C helps them yet."],answer:"A\u2013D and D\u2013A change from 7 to 3."}],exercises:[{q:"Run Prim's from E on the lecture graph. Do you get the same MST as starting from A?",solution:"E\u2013D 5, then D\u2013C 1, then C\u2013A 2, then D\u2013B 3. Same four edges, total 11. With distinct weights the MST is unique, so any start gives the same tree."},{q:"Run Dijkstra from E on the lecture graph and give all distances and paths.",solution:"E 0. Visit E: D 5. Visit D (5): A 12, B 8, C 6. Visit C (6): A = min(12, 6 + 2) = 8. Visit A (8) and B (8): nothing improves. Final: A 8 (E\u2013D\u2013C\u2013A), B 8 (E\u2013D\u2013B), C 6 (E\u2013D\u2013C), D 5."},{q:"Why does Dijkstra fail on this graph: S\u2192A 2, S\u2192B 5, B\u2192A \u22124? What is the correct shortest distance to A?",solution:"Dijkstra finalises A first with distance 2 (the smallest). Later it reaches B (5) and the edge B\u2192A gives 5 \u2212 4 = 1, but A is already final and is not updated. The correct distance is 1."},{q:"How many times does the innermost statement of Floyd-Warshall run for V = 50?",solution:"50\xB3 = 125 000 times."},{q:"Write the pseudocode for Kruskal using a union-find structure.",solution:[{t:"code",java:`List<Edge> kruskal(int V, List<Edge> edges) {
    Collections.sort(edges, Comparator.comparingInt(e -> e.w));   // O(E log E)
    UnionFind uf = new UnionFind(V);
    List<Edge> mst = new ArrayList<>();
    for (Edge e : edges) {
        if (uf.find(e.u) != uf.find(e.v)) {    // different components: no cycle

            mst.add(e);
            if (mst.size() == V - 1) break;
        }
    }
    return mst;
}`}]},{q:"Give one real situation for each: MST, Dijkstra, Floyd-Warshall.",solution:"MST: cheapest way to lay fibre or water pipes connecting every town. Dijkstra: GPS route from your location to a destination. Floyd-Warshall: a precomputed distance table between every pair of 30 campuses."}],quiz:[{type:"mcq",q:"How many edges does a spanning tree of a graph with 10 vertices have?",options:["10","9","45","It depends on the weights"],answer:1,explain:"Always V \u2212 1."},{type:"mcq",q:"What is the weight of the MST of the lecture graph?",options:["10","11","12","22"],answer:1,explain:"C\u2013D 1 + A\u2013C 2 + D\u2013B 3 + D\u2013E 5 = 11."},{type:"mcq",q:"Kruskal's algorithm uses which structure to detect cycles quickly?",options:["Stack","Disjoint set (union-find)","Adjacency matrix","Hash table"],answer:1,explain:"If find(u) == find(v), the edge would close a cycle."},{type:"mcq",q:"Shortest distance from A to B in the lecture graph:",options:["3","4","6","7"],answer:1,explain:"The direct edge (4) beats A\u2013C\u2013D\u2013B (6)."},{type:"mcq",q:"Shortest distance from A to E in the lecture graph:",options:["8","9","12","5"],answer:0,explain:"A\u2013C\u2013D\u2013E = 2 + 1 + 5."},{type:"complexity",q:"Floyd-Warshall runs in:",options:["O(V\xB2)","O(V\xB3)","O(E log V)","O(V + E)"],answer:1,explain:"Three nested loops over the vertices."},{type:"tf",q:"Dijkstra works correctly when some edge weights are negative.",options:["True","False"],answer:1,explain:"Finalised vertices are never revisited."},{type:"mcq",q:"In Floyd-Warshall, which loop must be outermost?",options:["i","j","k","Any order works"],answer:2,explain:"Each round of k must finish before the next intermediate vertex is allowed."},{type:"complexity",q:"Kruskal's running time is dominated by:",options:["Union-find operations","Sorting the edges, O(E log E)","BFS","Building a matrix"],answer:1,explain:"Union-find is nearly constant per operation."},{type:"tf",q:"Prim's and Kruskal's algorithms are both greedy.",options:["True","False"],answer:0,explain:"Each takes the cheapest safe edge without backtracking."},{type:"mcq",q:'What does "relaxing" edge (u, v) mean?',options:["Removing it","Checking if dist[u] + w < dist[v] and updating","Setting its weight to 0","Adding it to the MST"],answer:1,explain:"It is the update step of Dijkstra and Bellman-Ford."},{type:"mcq",q:"A negative number appears on the diagonal after Floyd-Warshall. This means:",options:["The graph is disconnected","There is a negative cycle","A bug, since diagonals are always 0","The graph is a DAG"],answer:1,explain:"A vertex can reach itself with negative total weight."}]},Rx={id:"SO6",ready:!0,title:"Disjoint sets (union-find)",summary:"The union-find structure behind Kruskal: make-set, find and union, with union by rank and path compression, plus a second look at Kruskal and Floyd-Warshall.",why:'Union-find answers "are these two things connected?" in practically constant time. Besides Kruskal, it is used for network connectivity, grouping pixels into objects in image processing, detecting cycles while building a graph, and merging duplicate accounts.',visualizers:["unionfind"],notes:[{t:"h",text:"1. The three operations"},{t:"list",items:["**makeSet(x):** create a set containing only x. x is its own parent (it is the representative).","**find(x):** follow parent pointers up to the root, which represents x's set.","**union(x, y):** find both roots; if they differ, make one root the parent of the other."]},{t:"p",text:"Each set is stored as a tree drawn with **parent pointers** in a single array: `parent[i]` is i's parent, and a root points to itself. Two elements are in the same set exactly when `find` returns the same root."},{t:"h",text:"2. Why the naive version is slow"},{t:"p",text:"If union always hangs the first root under the second, unioning 1\u20132, 2\u20133, 3\u20134, \u2026 builds a chain. `find` on the bottom element then walks the whole chain: **O(n)**. Two simple tricks fix this."},{t:"h",text:"3. Union by rank"},{t:"p",text:"Keep a **rank** (an upper bound on tree height) for each root. When joining two trees, attach the **shorter** one under the **taller** one. Only when ranks are equal does the height grow, and then the new root's rank goes up by 1. Tree height stays **O(log n)**."},{t:"h",text:"4. Path compression"},{t:"p",text:"During `find(x)`, after you find the root, make **every node on the path point straight at the root**. The next find on any of them is one step. With both tricks, a sequence of m operations costs **O(m \xB7 \u03B1(n))**, where \u03B1 is the inverse Ackermann function: at most 4 for any input that fits in the universe. In practice, constant time."},{t:"code",title:"Union-find with rank and path compression",java:`public class UnionFind {
    private final int[] parent, rank;
    private int sets;

    public UnionFind(int n) {
        parent = new int[n];
        rank = new int[n];
        sets = n;
        for (int i = 0; i < n; i++) parent[i] = i;      // makeSet for every element
    }

    public int find(int x) {
        if (parent[x] != x) parent[x] = find(parent[x]);  // path compression
        return parent[x];
    }

    public boolean union(int a, int b) {
        int ra = find(a), rb = find(b);
        if (ra == rb) return false;                      // already together: would be a cycle
        if (rank[ra] < rank[rb]) { int t = ra; ra = rb; rb = t; }
        parent[rb] = ra;                                 // shorter tree under taller
        if (rank[ra] == rank[rb]) rank[ra]++;
        sets--;
        return true;
    }

    public boolean connected(int a, int b) { return find(a) == find(b); }
    public int count() { return sets; }
}`,python:`class UnionFind:
    def __init__(self, n):
        self.parent = list(range(n))
        self.rank = [0] * n

    def find(self, x):
        if self.parent[x] != x:
            self.parent[x] = self.find(self.parent[x])   # path compression
        return self.parent[x]

    def union(self, a, b):
        ra, rb = self.find(a), self.find(b)
        if ra == rb:
            return False
        if self.rank[ra] < self.rank[rb]:
            ra, rb = rb, ra
        self.parent[rb] = ra
        if self.rank[ra] == self.rank[rb]:
            self.rank[ra] += 1
        return True`},{t:"h",text:"5. Union-find inside Kruskal"},{t:"p",text:"Kruskal on the lecture graph, with A\u2013E as elements, all ranks 0 at the start:"},{t:"table",head:["Edge","find(u), find(v)","Action","parent after","Sets"],rows:[["C\u2013D 1","C, D","union: ranks equal, D under C, rank[C] = 1","D\u2192C","{A} {B} {C,D} {E}"],["A\u2013C 2","A, C","rank[A] 0 < rank[C] 1, so A under C","A\u2192C, D\u2192C","{A,C,D} {B} {E}"],["D\u2013B 3","C, B","B under C","A, B, D \u2192 C","{A,B,C,D} {E}"],["A\u2013B 4","C, C","same root: skip (cycle)","",""],["D\u2013E 5","C, E","E under C","all \u2192 C","{A,B,C,D,E}"]]},{t:"callout",kind:"tip",title:"Floyd-Warshall, revisited",text:"The guide repeats Floyd-Warshall in SO6. The key exam skill is updating a matrix for one value of k. Practise with the Floyd-Warshall stepper in SO5: predict which cells change before you press Next."}],concepts:[{term:"Disjoint sets",def:"A collection of sets in which no element belongs to more than one set."},{term:"Representative (root)",def:"The element that identifies a set; find(x) returns it."},{term:"makeSet",def:"Creates a set containing a single element, which is its own parent."},{term:"find",def:"Returns the root of the tree containing x by following parent pointers."},{term:"union",def:"Merges the sets containing two elements by making one root the parent of the other."},{term:"Union by rank",def:"Attach the root with smaller rank under the root with larger rank so trees stay shallow."},{term:"Path compression",def:"During find, point every node on the path directly at the root."},{term:"Inverse Ackermann \u03B1(n)",def:"An extremely slow-growing function (\u2264 4 in practice) that bounds amortised union-find cost."}],mnemonics:[{title:"Short under tall",text:"Union by rank: the shorter tree always hides under the taller one, like children standing in front for a class photo."},{title:"Shortcut to the boss",text:"Path compression: once you have walked up to the boss (root), everyone you passed gets the boss's direct number."},{title:"Same root, skip the route",text:"In Kruskal, if find(u) == find(v), adding the edge would make a cycle."}],pitfalls:["Setting parent[a] = b instead of parent[find(a)] = find(b). You must link the roots, not the elements.","Forgetting to initialise parent[i] = i for every element.","Increasing rank on every union. Rank only grows when the two ranks are equal.","Recursive find with path compression on a huge degenerate chain can overflow the stack; an iterative two-pass version avoids it."],examples:[{title:"Path compression in action",problem:"Without union by rank, parent = [0, 0, 1, 2, 3] (a chain 4\u21923\u21922\u21921\u21920). Show parent after find(4) with path compression.",steps:["find(4) follows 4 \u2192 3 \u2192 2 \u2192 1 \u2192 0. Root = 0.","On the way back, set parent of 4, 3, 2 and 1 to 0.","A second find(4) now takes one step."],answer:"parent = [0, 0, 0, 0, 0]."},{title:"Union by rank sequence",problem:"Elements 0\u20135, all rank 0. Do union(0,1), union(2,3), union(0,2), union(4,5), union(5,3). Give parent and rank after each, with the first root winning ties.",steps:["union(0,1): equal ranks, parent[1] = 0, rank[0] = 1.","union(2,3): parent[3] = 2, rank[2] = 1.","union(0,2): roots 0 and 2, equal rank 1, parent[2] = 0, rank[0] = 2.","union(4,5): parent[5] = 4, rank[4] = 1.","union(5,3): find(5) = 4 (rank 1), find(3) = 0 (rank 2). Smaller rank goes under: parent[4] = 0. With path compression, find(3) also set parent[3] = 0."],answer:"All six elements are in one set with root 0. rank[0] = 2. parent = [0, 0, 0, 0, 0, 4] (5 still points at 4 until it is next found)."}],exercises:[{q:"Elements 1\u20138, each its own set. After union(1,2), union(3,4), union(5,6), union(7,8), union(1,3), union(5,7), how many sets are there? Are 2 and 4 connected? Are 4 and 6?",solution:"Two sets: {1,2,3,4} and {5,6,7,8}. 2 and 4: yes. 4 and 6: no."},{q:"Explain why union by rank keeps tree height at most log\u2082 n.",solution:"A root's rank only increases when two trees of equal rank r join, giving rank r + 1. By induction a tree of rank r has at least 2^r nodes, so with n nodes the rank (and height) is at most log\u2082 n."},{q:"Use union-find to decide whether adding edges in this order creates a cycle: 0\u20131, 1\u20132, 3\u20134, 2\u20130.",solution:"0\u20131: different roots, union. 1\u20132: union. 3\u20134: union. 2\u20130: find(2) = find(0), same set, so this edge closes the cycle 0\u20131\u20132\u20130."},{q:"What does `count()` return after all unions in Kruskal on a connected graph with V vertices?",solution:"1. Each successful union reduces the number of sets by one, and a spanning tree needs V \u2212 1 successful unions."}],quiz:[{type:"mcq",q:"After makeSet on elements 0\u20134, parent is:",options:["[0,0,0,0,0]","[0,1,2,3,4]","[-1,-1,-1,-1,-1]","[1,2,3,4,0]"],answer:1,explain:"Each element is its own root."},{type:"mcq",q:"Union by rank attaches:",options:["The larger tree under the smaller","The smaller-rank root under the larger-rank root","Always the second root under the first","Both roots under a new node"],answer:1,explain:"This keeps trees shallow."},{type:"mcq",q:"Path compression changes:",options:["The rank of every node","Parent pointers on the find path, to point at the root","The number of sets","The order of elements"],answer:1,explain:"Future finds on those nodes take one step."},{type:"complexity",q:"With rank and path compression, the amortised cost per operation is:",options:["O(1) exactly","O(\u03B1(n)), effectively constant","O(log n)","O(n)"],answer:1,explain:"\u03B1(n) \u2264 4 for any realistic n."},{type:"tf",q:"In Kruskal, if find(u) == find(v), the edge (u, v) is added to the MST.",options:["True","False"],answer:1,explain:"It would create a cycle, so it is skipped."},{type:"mcq",q:"Starting with 6 singleton sets, how many successful unions leave exactly 2 sets?",options:["2","3","4","6"],answer:2,explain:"Each successful union removes one set: 6 \u2212 4 = 2."},{type:"complexity",q:"Without either optimisation, the worst case for find is:",options:["O(1)","O(log n)","O(n)","O(n\xB2)"],answer:2,explain:"Trees can degenerate into chains."}]},qx={id:"SO7",ready:!0,title:"Hashing",summary:"Hash functions, collisions and how to resolve them (separate chaining, linear and quadratic probing, double hashing), load factor and rehashing.",why:"Hash tables give average O(1) lookup and power Java's HashMap and HashSet, Python dictionaries, database indexes, caches, compilers' symbol tables and password storage. Knowing how collisions are handled explains why a HashMap slows down when it is too full, and why a bad hashCode() can ruin performance.",visualizers:["hashtable"],notes:[{t:"h",text:"1. The idea"},{t:"p",text:"A **hash table** is an array of m slots (buckets). A **hash function** turns a key into a slot index, so we can jump straight to where the key should be instead of searching. Insert, search and delete are **O(1) on average**."},{t:"formula",text:"Division method:  h(k) = k mod m"},{t:"p",text:"A good hash function is **fast**, **deterministic** (same key, same slot every time) and **spreads keys evenly**. With the division method, choose m to be a **prime** not close to a power of 2. If m = 10 and all keys end in 0, every key lands in slot 0."},{t:"p",text:'For strings, Java\'s `String.hashCode()` computes `s[0]\xB731^(n\u22121) + s[1]\xB731^(n\u22122) + \u2026 + s[n\u22121]`, using every character so that "abc" and "cba" hash differently. A HashMap then reduces that int to a slot index.'},{t:"h",text:"2. Collisions"},{t:"p",text:"A **collision** happens when two different keys hash to the same slot. There are far more possible keys than slots, so collisions are unavoidable (the pigeonhole principle). What matters is how you resolve them."},{t:"h",text:"3. Separate chaining"},{t:"p",text:"Each slot holds a **linked list** of every key that hashed there. Insert appends to the list; search walks it. Example: m = 7, insert 15, 11, 27, 8, 12, 22."},{t:"table",head:["Slot","Keys (k mod 7)"],rows:[["0",""],["1","15 \u2192 8 \u2192 22"],["2",""],["3",""],["4","11"],["5","12"],["6","27"]]},{t:"p",text:"Chaining keeps working even when there are more keys than slots (load factor above 1). Expected chain length is \u03B1 = n / m."},{t:"h",text:"4. Open addressing"},{t:"p",text:"All keys live in the array itself. On a collision, **probe** other slots in a fixed sequence until an empty one is found. Search follows the same sequence until it finds the key or an empty slot."},{t:"table",head:["Method","Probe sequence for attempt i = 0, 1, 2\u2026","Weakness"],rows:[["Linear probing","(h(k) + i) mod m","Primary clustering: long runs of full slots grow"],["Quadratic probing","(h(k) + i\xB2) mod m","Secondary clustering; may not reach every slot unless m is prime and \u03B1 < 0.5"],["Double hashing","(h\u2081(k) + i \xB7 h\u2082(k)) mod m","Needs a second function with h\u2082(k) \u2260 0; best spread"]]},{t:"p",text:"**Linear probing** example from your notes: m = 5, insert 50, 70, 76, 85, 93 with h(k) = k mod 5."},{t:"table",head:["Key","h(k)","Probes","Final slot"],rows:[["50","0","0","0"],["70","0","0 \u2717, 1","1"],["76","1","1 \u2717, 2","2"],["85","0","0 \u2717, 1 \u2717, 2 \u2717, 3","3"],["93","3","3 \u2717, 4","4"]]},{t:"p",text:"**Quadratic vs linear**, m = 10, keys 23, 43, 13, 27, 38. Linear puts 13 in slot 5 (3, 4, 5). Quadratic tries 3, 3 + 1 = 4, 3 + 4 = **7**, jumping away from the cluster."},{t:"p",text:"**Double hashing**, m = 11, h\u2081(k) = k mod 11, h\u2082(k) = 7 \u2212 (k mod 7). Insert 14, 25, 36: 14 \u2192 3. 25 \u2192 3 taken; h\u2082(25) = 7 \u2212 4 = 3, so try 3 + 3 = **6**. 36 \u2192 3 taken; h\u2082(36) = 7 \u2212 1 = 6, so try 3 + 6 = **9**."},{t:"callout",kind:"warn",title:"Deleting in open addressing",text:'You cannot simply empty a slot: a later search would stop at the gap and miss keys that probed past it. Mark the slot with a **tombstone** ("deleted") so searches continue past it, while inserts can reuse it.'},{t:"h",text:"5. Load factor and rehashing"},{t:"formula",text:"load factor \u03B1 = n / m   (keys stored / slots)"},{t:"p",text:"As \u03B1 rises, chains get longer and probe sequences get longer. Open addressing needs \u03B1 < 1 and slows sharply past about 0.7. Java's `HashMap` starts with 16 buckets and **doubles** its size when \u03B1 exceeds **0.75**, re-inserting every key (**rehashing**). One rehash is O(n), but because the size doubles, the cost averages out to O(1) per insert (amortised)."},{t:"table",head:["","Average","Worst case"],rows:[["Search / insert / delete","O(1)","O(n): every key in one chain or one cluster"],["Space","O(n + m)",""]]},{t:"code",title:"A hash table with separate chaining",java:`public class ChainedHashTable<K, V> {
    private static class Node<K, V> {
        final K key; V value; Node<K, V> next;
        Node(K k, V v, Node<K, V> n) { key = k; value = v; next = n; }
    }

    private Node<K, V>[] table;
    private int size;

    @SuppressWarnings("unchecked")
    public ChainedHashTable(int capacity) { table = (Node<K, V>[]) new Node[capacity]; }

    private int index(K key) { return (key.hashCode() & 0x7fffffff) % table.length; } // non-negative

    public void put(K key, V value) {
        int i = index(key);
        for (Node<K, V> n = table[i]; n != null; n = n.next)
            if (n.key.equals(key)) { n.value = value; return; }     // update existing key
        table[i] = new Node<>(key, value, table[i]);                 // insert at head: O(1)
        if (++size > 0.75 * table.length) resize();
    }

    public V get(K key) {
        for (Node<K, V> n = table[index(key)]; n != null; n = n.next)
            if (n.key.equals(key)) return n.value;
        return null;
    }

    @SuppressWarnings("unchecked")
    private void resize() {
        Node<K, V>[] old = table;
        table = (Node<K, V>[]) new Node[old.length * 2];
        size = 0;
        for (Node<K, V> head : old)
            for (Node<K, V> n = head; n != null; n = n.next) put(n.key, n.value);
    }
}`,python:`class ChainedHashTable:
    def __init__(self, capacity=8):
        self.buckets = [[] for _ in range(capacity)]
        self.size = 0

    def _index(self, key):
        return hash(key) % len(self.buckets)

    def put(self, key, value):
        bucket = self.buckets[self._index(key)]
        for pair in bucket:
            if pair[0] == key:
                pair[1] = value
                return
        bucket.append([key, value])
        self.size += 1
        if self.size > 0.75 * len(self.buckets):
            self._resize()

    def get(self, key):
        for k, v in self.buckets[self._index(key)]:
            if k == key:
                return v
        return None

    def _resize(self):
        old = self.buckets
        self.buckets = [[] for _ in range(2 * len(old))]
        self.size = 0
        for bucket in old:
            for k, v in bucket:
                self.put(k, v)`},{t:"callout",kind:"tip",title:"equals() and hashCode() go together",text:'If you override `equals()` in a Java class you must override `hashCode()` too, so that equal objects produce equal hash codes. Otherwise two "equal" keys land in different buckets and `HashMap.get` returns null.'}],concepts:[{term:"Hash table",def:"An array of slots where a hash function maps each key to the slot that should hold it."},{term:"Hash function",def:"A function from keys to slot indices; it should be fast, deterministic and spread keys evenly."},{term:"Division method",def:"h(k) = k mod m, ideally with m a prime."},{term:"Collision",def:"Two different keys hash to the same slot."},{term:"Separate chaining",def:"Each slot holds a linked list of all keys that hash to it."},{term:"Open addressing",def:"All keys are stored in the array; collisions are resolved by probing other slots."},{term:"Linear probing",def:"Probe (h(k) + i) mod m; simple but suffers from primary clustering."},{term:"Quadratic probing",def:"Probe (h(k) + i\xB2) mod m; reduces primary clustering."},{term:"Double hashing",def:"Probe (h\u2081(k) + i\xB7h\u2082(k)) mod m with a second hash for the step size."},{term:"Primary clustering",def:"Long runs of occupied slots that grow because linear probing fills the next slot along."},{term:"Load factor (\u03B1)",def:"n / m: the number of stored keys divided by the number of slots."},{term:"Rehashing",def:"Creating a larger table and re-inserting every key when the load factor gets too high."},{term:"Tombstone",def:"A marker left in a deleted open-addressing slot so later searches keep probing past it."}],mnemonics:[{title:"Chain or Probe",text:"Collision? Either hang it on a Chain or go Probing for a free slot."},{title:"Linear Lines up, Quadratic Quickly jumps",text:"Linear probing forms Lines (clusters); Quadratic jumps 1, 4, 9 slots away."},{title:"Three quarters full, time to move house",text:"Java's HashMap resizes at a load factor of 0.75."},{title:"Prime time",text:"Pick a prime table size for the division method."}],pitfalls:["Using a non-prime table size like 10 or 100 with keys that share a pattern, causing lots of collisions.","Emptying a slot on delete in open addressing, which breaks searches for keys stored further along the probe sequence.","Overriding equals() without hashCode() in Java.","Using a negative hashCode() directly as an index. Mask with & 0x7fffffff or use Math.floorMod.","Letting an open-addressing table fill up completely; insert then loops forever.","Claiming hash table operations are O(1) in the worst case. They are O(1) on average."],examples:[{title:"Linear probing step by step",problem:"m = 10, h(k) = k mod 10. Insert 23, 43, 13, 27, 38 with linear probing. Then search for 33.",steps:["23 \u2192 slot 3.","43 \u2192 3 taken \u2192 4.","13 \u2192 3, 4 taken \u2192 5.","27 \u2192 7. 38 \u2192 8.","Search 33: start at 3 (23), 4 (43), 5 (13), 6 (empty). Stop: 33 is not in the table, after 4 probes."],answer:"Slots: 3: 23, 4: 43, 5: 13, 7: 27, 8: 38. The cluster 3\u20135 makes unsuccessful searches near it slow."},{title:"Chaining and load factor",problem:"m = 5, h(k) = k mod 5. Insert 12, 7, 22, 9, 17, 4 with chaining. Give the table, \u03B1, and the longest chain.",steps:["12 \u2192 2. 7 \u2192 2. 22 \u2192 2. 9 \u2192 4. 17 \u2192 2. 4 \u2192 4.","Slot 2: 12 \u2192 7 \u2192 22 \u2192 17. Slot 4: 9 \u2192 4.","\u03B1 = 6 / 5 = 1.2."],answer:"Longest chain is 4 (slot 2). \u03B1 = 1.2, which chaining tolerates but which shows the hash spreads these keys badly."},{title:"Double hashing",problem:"m = 11, h\u2081(k) = k mod 11, h\u2082(k) = 7 \u2212 (k mod 7). Insert 14, 25, 36, 47.",steps:["14 \u2192 3.","25 \u2192 3 taken. h\u2082 = 7 \u2212 4 = 3. Try 6. Free.","36 \u2192 3 taken. h\u2082 = 7 \u2212 1 = 6. Try 9. Free.","47 \u2192 47 mod 11 = 3, taken. h\u2082 = 7 \u2212 (47 mod 7 = 5) = 2. Try 5. Free."],answer:"3: 14, 5: 47, 6: 25, 9: 36. Each key that collided at 3 took a different step size."}],exercises:[{q:"Insert 10, 22, 31, 4, 15, 28, 17, 88, 59 into a table of size 11 using h(k) = k mod 11 and linear probing.",solution:"10 \u2192 10. 22 \u2192 0. 31 \u2192 9. 4 \u2192 4. 15 \u2192 4 taken \u2192 5. 28 \u2192 6. 17 \u2192 6 taken \u2192 7. 88 \u2192 0 taken \u2192 1. 59 \u2192 4, 5, 6, 7 taken \u2192 8. Table: 0: 22, 1: 88, 4: 4, 5: 15, 6: 28, 7: 17, 8: 59, 9: 31, 10: 10."},{q:"Repeat the first five keys of the previous question with quadratic probing.",solution:"10 \u2192 10. 22 \u2192 0. 31 \u2192 9. 4 \u2192 4. 15 \u2192 4 taken, 4 + 1 = 5 free \u2192 5. (The difference from linear shows up with longer clusters.)"},{q:"A table of 1000 slots holds 820 keys. What is \u03B1? Should a Java HashMap of that capacity have resized already?",solution:"\u03B1 = 0.82. Yes: HashMap resizes once the count exceeds 0.75 \xD7 capacity = 750."},{q:"Write a method that counts the collisions when inserting an int[] of keys into a table of size m with h(k) = k mod m and chaining.",solution:[{t:"code",java:`static int countCollisions(int[] keys, int m) {
    boolean[] used = new boolean[m];
    int collisions = 0;
    for (int k : keys) {
        int i = Math.floorMod(k, m);   // safe for negative keys
        if (used[i]) collisions++;
        used[i] = true;
    }
    return collisions;
}`}]},{q:"Why is a prime table size recommended for the division method? Give an example where m = 10 is a bad choice.",solution:"A prime has no common factors with patterns in the keys, so keys spread evenly. With m = 10, student numbers that all end in 0 (or prices like 100, 250, 1990) all land in slot 0."},{q:"Explain the problem with deleting key 43 from the linear-probing table in the first worked example, and the fix.",solution:"If slot 4 is simply emptied, searching for 13 starts at 3, then finds slot 4 empty and stops, wrongly reporting 13 missing. Put a tombstone in slot 4 instead."}],quiz:[{type:"mcq",q:"With h(k) = k mod 7, key 50 goes to slot:",options:["0","1","5","7"],answer:1,explain:"50 = 7 \xD7 7 + 1."},{type:"mcq",q:"Which method stores colliding keys in a linked list at the slot?",options:["Linear probing","Separate chaining","Double hashing","Quadratic probing"],answer:1,explain:"Each slot holds a chain."},{type:"mcq",q:"Linear probing suffers mainly from:",options:["Primary clustering","Stack overflow","Negative load factor","Needing a second hash"],answer:0,explain:"Runs of full slots grow longer."},{type:"mcq",q:"Load factor for 30 keys in 40 slots:",options:["0.25","0.75","1.33","1.0"],answer:1,explain:"30 / 40."},{type:"complexity",q:"Average-case search in a well-sized hash table:",options:["O(1)","O(log n)","O(n)","O(n log n)"],answer:0,explain:"Constant expected chain or probe length."},{type:"complexity",q:"Worst-case search in a hash table with chaining:",options:["O(1)","O(log n)","O(n)","O(m)"],answer:2,explain:"All keys could land in one chain."},{type:"tf",q:"In open addressing, deleting a key by simply emptying its slot is always safe.",options:["True","False"],answer:1,explain:"It can break later searches; use a tombstone."},{type:"mcq",q:"Java's HashMap resizes when the load factor exceeds:",options:["0.5","0.75","1.0","2.0"],answer:1,explain:"Default load factor 0.75, then capacity doubles."},{type:"mcq",q:"m = 5, linear probing, keys 50, 70, 76, 85, 93. Where does 85 end up?",options:["0","1","3","4"],answer:2,explain:"Slots 0, 1, 2 are taken, so 3."},{type:"mcq",q:"In double hashing, h\u2082(k) must never be:",options:["Prime","0","Larger than 1","Odd"],answer:1,explain:"A step of 0 would probe the same slot forever."},{type:"tf",q:"If you override equals() in Java you should also override hashCode().",options:["True","False"],answer:0,explain:"Equal objects must have equal hash codes."}]},Nx={id:"BST",ready:!0,title:"Binary search trees and AVL rotations (Term 3 lectures)",summary:"The BST and tree-rotation lectures from Term 3: inserting, searching, deleting and traversing a BST, why unbalanced trees degrade to O(n), and how AVL rotations fix it.",why:"Part D of the Term 3 project was a BST and was worth the most marks (25%). BSTs underpin TreeMap and TreeSet in Java and database indexes. Balanced trees guarantee O(log n): a million keys in about 20 steps instead of up to a million.",visualizers:["bst"],notes:[{t:"h",text:"1. The BST rule"},{t:"p",text:"A binary search tree is a binary tree (0, 1 or 2 children per node) where, for **every** node, all keys in its **left** subtree are **smaller** and all keys in its **right** subtree are **larger**. That rule lets search throw away half the remaining tree at each step, like binary search."},{t:"p",text:"Lecture example: insert **6, 7, 4, 9, 10, 3, 1, 8**. Each new key starts at the root and goes left if smaller, right if larger, until it finds an empty spot."},{t:"tree",keys:[6,7,4,9,10,3,1,8],caption:"The BST from the lecture after inserting 6, 7, 4, 9, 10, 3, 1, 8."},{t:"table",head:["Traversal","Rule","Result on the lecture tree"],rows:[["Inorder","Left, Node, Right","1, 3, 4, 6, 7, 8, 9, 10 (always sorted)"],["Preorder","Node, Left, Right","6, 4, 3, 1, 7, 9, 8, 10"],["Postorder","Left, Right, Node","1, 3, 4, 8, 10, 9, 7, 6"],["Level order (BFS)","Row by row with a queue","6, 4, 7, 3, 9, 1, 8, 10"]]},{t:"h",text:"2. Delete: three cases"},{t:"ol",items:["**Leaf:** just remove it.","**One child:** replace the node with its child.","**Two children:** replace its key with its **inorder successor** (the smallest key in its right subtree), then delete that successor, which has at most one child."]},{t:"code",title:"BST insert, search, delete and traversals",java:`public class BST {
    private static class Node { int key; Node left, right; Node(int k) { key = k; } }
    private Node root;

    public void insert(int key) { root = insert(root, key); }
    private Node insert(Node n, int key) {
        if (n == null) return new Node(key);
        if (key < n.key) n.left = insert(n.left, key);
        else if (key > n.key) n.right = insert(n.right, key);
        return n;                                    // duplicates ignored
    }

    public boolean contains(int key) {
        Node n = root;
        while (n != null) {
            if (key == n.key) return true;
            n = key < n.key ? n.left : n.right;      // discard half the tree
        }
        return false;
    }

    public void delete(int key) { root = delete(root, key); }
    private Node delete(Node n, int key) {
        if (n == null) return null;
        if (key < n.key) n.left = delete(n.left, key);
        else if (key > n.key) n.right = delete(n.right, key);
        else {
            if (n.left == null) return n.right;      // leaf or one child
            if (n.right == null) return n.left;
            Node s = n.right;                        // two children: inorder successor
            while (s.left != null) s = s.left;
            n.key = s.key;
            n.right = delete(n.right, s.key);
        }
        return n;
    }

    public void inorder(Node n, List<Integer> out) {
        if (n == null) return;
        inorder(n.left, out); out.add(n.key); inorder(n.right, out);
    }
}`,python:`class Node:
    def __init__(self, key):
        self.key, self.left, self.right = key, None, None

def insert(n, key):
    if n is None:
        return Node(key)
    if key < n.key:
        n.left = insert(n.left, key)
    elif key > n.key:
        n.right = insert(n.right, key)
    return n

def delete(n, key):
    if n is None:
        return None
    if key < n.key:
        n.left = delete(n.left, key)
    elif key > n.key:
        n.right = delete(n.right, key)
    else:
        if n.left is None:
            return n.right
        if n.right is None:
            return n.left
        s = n.right
        while s.left:
            s = s.left
        n.key = s.key
        n.right = delete(n.right, s.key)
    return n

def inorder(n):
    return inorder(n.left) + [n.key] + inorder(n.right) if n else []`},{t:"h",text:"3. Why balance matters"},{t:"p",text:"Search, insert and delete cost **O(h)**, where h is the tree height. A balanced tree has h \u2248 log\u2082 n. But inserting keys **already sorted** (1, 2, 3, 4, 5\u2026) puts every key to the right of the last one: a **degenerate** tree that looks and performs like a linked list, **O(n)**."},{t:"h",text:"4. AVL trees and the four rotations"},{t:"p",text:"An **AVL tree** is a BST where every node's **balance factor** = height(left) \u2212 height(right) is \u22121, 0 or +1. After an insert, walk back up; at the first node where the balance factor becomes \xB12, apply a rotation. The case is named by the path from that node to the new key:"},{t:"table",head:["Case","New key went\u2026","Fix"],rows:[["LL","Left, then Left","Single right rotation at the unbalanced node"],["RR","Right, then Right","Single left rotation at the unbalanced node"],["LR","Left, then Right","Left rotation on the left child, then right rotation at the node"],["RL","Right, then Left","Right rotation on the right child, then left rotation at the node"]]},{t:"p",text:"Lecture sequence from TreesAndRotations: **30, 10, 20, 40, 50, 25, 5, 3, 4, 35, 45, 2**."},{t:"table",head:["Insert","Imbalance","Rotation","Root after"],rows:[["30, 10","\u2013","\u2013","30"],["20","30 has bf +2; path L then R","LR at 30","20"],["40","\u2013","\u2013","20"],["50","30 has bf \u22122; path R then R","RR (single left rotation) at 30","20"],["25","20 has bf \u22122; path R then L","RL at 20","30"],["5","\u2013","\u2013","30"],["3","10 has bf +2; path L then L","LL (single right rotation) at 10","30"],["4","20 has bf +2; path L then L (4 < 5)","LL at 20","30"],["35, 45, 2","\u2013","\u2013","30"]]},{t:"tree",keys:[30,10,20,40,50,25,5,3,4,35,45,2],avl:!0,caption:"The final AVL tree for the lecture sequence. Height 4 for 12 keys; a plain BST of the same keys has height 5."},{t:"code",title:"AVL insert with rotations",java:`class AVL {
    static class Node { int key, height = 1; Node left, right; Node(int k) { key = k; } }

    static int h(Node n) { return n == null ? 0 : n.height; }
    static void update(Node n) { n.height = 1 + Math.max(h(n.left), h(n.right)); }
    static int balance(Node n) { return h(n.left) - h(n.right); }

    static Node rotateRight(Node y) {          // fixes LL
        Node x = y.left;
        y.left = x.right;
        x.right = y;
        update(y); update(x);
        return x;
    }
    static Node rotateLeft(Node x) {           // fixes RR
        Node y = x.right;
        x.right = y.left;
        y.left = x;
        update(x); update(y);
        return y;
    }

    static Node insert(Node n, int key) {
        if (n == null) return new Node(key);
        if (key < n.key) n.left = insert(n.left, key);
        else if (key > n.key) n.right = insert(n.right, key);
        else return n;
        update(n);
        int b = balance(n);
        if (b > 1 && key < n.left.key) return rotateRight(n);                          // LL
        if (b < -1 && key > n.right.key) return rotateLeft(n);                         // RR
        if (b > 1 && key > n.left.key) { n.left = rotateLeft(n.left); return rotateRight(n); }   // LR
        if (b < -1 && key < n.right.key) { n.right = rotateRight(n.right); return rotateLeft(n); } // RL
        return n;
    }
}`}],concepts:[{term:"Binary search tree",def:"A binary tree in which every node's left subtree holds smaller keys and its right subtree holds larger keys."},{term:"Inorder traversal",def:"Left, node, right. On a BST it lists the keys in sorted order."},{term:"Preorder traversal",def:"Node, left, right. Useful for copying a tree."},{term:"Postorder traversal",def:"Left, right, node. Useful for deleting a tree or evaluating expression trees."},{term:"Inorder successor",def:"The smallest key in a node's right subtree; used to delete a node with two children."},{term:"Degenerate tree",def:"A tree where each node has one child, so it behaves like a linked list with O(n) operations."},{term:"Balance factor",def:"height(left subtree) \u2212 height(right subtree) of a node."},{term:"AVL tree",def:"A self-balancing BST in which every balance factor is \u22121, 0 or +1, guaranteeing O(log n) height."},{term:"Rotation",def:"A local restructuring of a BST that changes heights but preserves the inorder (sorted) order."}],mnemonics:[{title:"In = In order",text:"INorder traversal of a BST gives the keys IN order."},{title:"Pre, In, Post = where the Node goes",text:"PRE: Node first. IN: Node in the middle. POST: Node last. Left always comes before right."},{title:"Name the path, rotate the other way",text:"LL needs a Right rotation; RR needs a Left rotation. Doubles (LR, RL) rotate the child first, then the node."},{title:"Sorted input, sorry output",text:"Inserting sorted keys into a plain BST builds a linked list."}],pitfalls:["Comparing only with the parent instead of applying the rule to whole subtrees when checking whether a tree is a valid BST.","Using the inorder predecessor and successor inconsistently when deleting a node with two children.","Rotating at the wrong node. Rotate at the lowest node whose balance factor became \xB12.","Forgetting to update heights after a rotation (update the lower node first, then the new root).","Claiming BST operations are always O(log n). That is only true when the tree is balanced."],examples:[{title:"Delete from the lecture BST",problem:"From the BST built from 6, 7, 4, 9, 10, 3, 1, 8, delete 7, then delete 6.",steps:["7 has one child (9). Replace 7 with 9. Now 6's right child is 9 (with children 8 and 10).","6 has two children. Inorder successor = smallest in right subtree = 8.","Copy 8 into the root and delete the original 8 (a leaf)."],answer:"Root 8; left subtree 4 \u2192 3 \u2192 1; right subtree 9 with right child 10. Inorder: 1, 3, 4, 8, 9, 10."},{title:"Spot the rotation",problem:"Insert 10, 20, 30 into an empty AVL tree. Which rotation happens and what is the result?",steps:["10 is the root. 20 goes right. 30 goes right of 20.","Node 10: left height 0, right height 2, balance factor \u22122.","Path from 10 to 30 is Right, Right: RR case.","Single left rotation at 10."],answer:"20 becomes the root with children 10 and 30."}],exercises:[{q:"Insert 50, 30, 70, 20, 40, 60, 80 into a BST and give all four traversals.",solution:"Perfectly balanced tree. Inorder 20 30 40 50 60 70 80. Preorder 50 30 20 40 70 60 80. Postorder 20 40 30 60 80 70 50. Level order 50 30 70 20 40 60 80."},{q:"What is the height of a BST built by inserting 1 to 1000 in order? How many comparisons does searching for 1000 take?",solution:"Height 1000 (a chain). Searching for 1000 compares with all 1000 nodes: O(n)."},{q:"Insert 3, 2, 1 into an AVL tree. Name the rotation.",solution:"Node 3 gets balance +2 with path Left, Left: LL. A single right rotation at 3 makes 2 the root with children 1 and 3."},{q:"Insert 10, 30, 20 into an AVL tree. Name the rotation.",solution:"Node 10: balance \u22122, path Right then Left: RL. Rotate right at 30 (20 moves up), then left at 10. Root 20, children 10 and 30."},{q:"Write `int height(Node n)` for a BST, counting a single node as height 1.",solution:[{t:"code",java:`static int height(Node n) {
    if (n == null) return 0;
    return 1 + Math.max(height(n.left), height(n.right));   // O(n)
}`}]}],quiz:[{type:"mcq",q:"Which traversal of a BST outputs the keys in sorted order?",options:["Preorder","Inorder","Postorder","Level order"],answer:1,explain:"Left subtree (smaller), node, right subtree (larger)."},{type:"mcq",q:"Preorder of the lecture BST (6, 7, 4, 9, 10, 3, 1, 8) is:",options:["6, 4, 3, 1, 7, 9, 8, 10","1, 3, 4, 6, 7, 8, 9, 10","6, 4, 7, 3, 9, 1, 8, 10","1, 3, 4, 8, 10, 9, 7, 6"],answer:0,explain:"Node, left subtree, right subtree."},{type:"complexity",q:"Worst-case search in an unbalanced BST with n keys:",options:["O(1)","O(log n)","O(n)","O(n log n)"],answer:2,explain:"A degenerate tree is a list."},{type:"complexity",q:"Search in an AVL tree with n keys:",options:["O(1)","O(log n)","O(n)","O(\u221An)"],answer:1,explain:"Height is guaranteed to be O(log n)."},{type:"mcq",q:"Inserting 10, 20, 30 into an AVL tree triggers which case?",options:["LL","RR","LR","RL"],answer:1,explain:"Right, then right from node 10."},{type:"mcq",q:"To delete a node with two children you replace it with:",options:["Its parent","Its left child","Its inorder successor (or predecessor)","The root"],answer:2,explain:"That key keeps the BST order intact."},{type:"mcq",q:"An AVL node has left height 3 and right height 1. Its balance factor is:",options:["\u22122","+2","+4","0"],answer:1,explain:"3 \u2212 1 = +2, so it needs a rotation."},{type:"tf",q:"A rotation changes the inorder sequence of the tree.",options:["True","False"],answer:1,explain:"Rotations preserve the BST order."}]},Ex={id:"PRJ",ready:!0,title:"Project guidance (T3 programming assignment)",summary:"The Term 3 project brief, how marks were split, a sensible structure for the code and report, and how to reuse the project to revise for T4.",why:"The project is 20% of the year. It also covers recursion, sorting, linked structures, BSTs and graphs in one place, so it doubles as a revision checklist for the whole module.",notes:[{t:"h",text:"The brief (ADP470S_Assignment.docx)"},{t:"p",text:"Deadline **9 October 2026**. Any object-oriented language (Java, C++, C#, Python). Submit well-commented source code organised by part, and a 2\u20133 page report explaining design decisions and Big-O analysis for each part."},{t:"table",head:["Part","Marks","What to build","Where to revise it"],rows:[["A: Recursion","15","Recursive factorial and Fibonacci; compare with iterative versions","Term 1 SO2"],["B: Searching and sorting","20","Selection, quick and heap sort; recursive and iterative binary search; timing on 1 000 random integers","Term 1 SO3, Term 2 SO9"],["C: Elementary structures","20","Singly linked list, array stack, circular queue; reverse a string, simulate a bank queue","Term 1 SO5\u20136, Term 2 SO3\u20134"],["D: Trees","25","BST with insert, search, delete and three traversals; O(log n) vs O(n)","Term 3 BST outcome"],["E: Graphs","20","Adjacency matrix, recursive DFS, queue-based BFS; fewest-edge route between cities","Term 3 SO1\u2013SO2"]]},{t:"h",text:"How to approach a project like this"},{t:"ol",items:["**One class per structure, one demo per part.** For example `PartD_Trees.java` holds the BST and a `main` that demonstrates it. Your submission already followed this layout.","**Write the tests first.** For each structure, list the edge cases: empty, one element, duplicates, deleting the root, a disconnected graph.","**Time fairly.** Run every sort on a copy of the same array, repeat several times, and report the average. Use `System.nanoTime()`.",'**Tie results to Big-O in the report.** "Selection sort was slowest at 1 000 items, as expected for O(n\xB2); quick sort and heap sort were close, both O(n log n)."',"**Explain theory vs practice.** For example, quick sort is often fastest in practice despite its O(n\xB2) worst case because of good cache behaviour and small constants."]},{t:"h",text:"Report structure that scores well"},{t:"list",items:["Introduction: language, how to run the code, folder layout.","One section per part: design decisions, a short code excerpt, time and space complexity in a table.","Experimental results: a table and a chart of sort times, with a paragraph interpreting them.","Reflection: where theory and measurements agreed or differed, and why.","References if you used any sources."]},{t:"callout",kind:"tip",title:"Use it to revise for T4",text:"Re-run your own Part B timings and Part E BFS, then answer: what is the Big-O of each, and why? If you can explain every method in your own project out loud, you have revised half the year."}],concepts:[],mnemonics:[],pitfalls:["Timing each sort on a different random array, which makes the comparison meaningless.","Sorting an already-sorted array with a first-element-pivot quick sort and getting O(n\xB2).",'Using recursion for Fibonacci on large n without memoisation and calling it "slow Java".',"Leaving Big-O out of the report. It is part of every section's marks."],examples:[],exercises:[],quiz:[]},Pm={id:"T3",n:3,title:"Graphs, shortest paths, hashing and BSTs",short:"Graphs & hashing",assessment:"T3 Project",weight:20,color:"t3",outcomes:[Ix,Ox,Tx,Ax,Rx,qx,Nx,Ex],cheatSheet:[{title:"Graph basics",rows:[["G = (V, E)","Vertices and edges"],["Handshake","\u03A3 degrees = 2E"],["Max edges","V(V\u22121)/2 undirected, V(V\u22121) directed"],["Tree","Connected, V \u2212 1 edges, no cycles"],["Matrix","O(V\xB2) space, O(1) edge check"],["List","O(V + E) space, O(deg) edge check"],["Edge list","O(E); sort it for Kruskal"]]},{title:"Traversal",rows:[["BFS","Queue; level order; fewest edges"],["DFS","Stack or recursion; deep first"],["Time","O(V + E) list, O(V\xB2) matrix"],["Lecture graph from A","BFS A B C D E; DFS A B D C E"],["Topological sort","Kahn: take in-degree 0, repeat"],["Cycle (directed)","DFS meets a grey vertex"],["Bipartite","Two-colour with BFS; no odd cycle"]]},{title:"MST and shortest paths",rows:[["Prim","Cheapest edge leaving the tree; O(E log V)"],["Kruskal","Sort edges, skip cycles (union-find); O(E log E)"],["Lecture MST","C\u2013D, A\u2013C, D\u2013B, D\u2013E = 11"],["Dijkstra","Closest unvisited, relax; O((V+E) log V); no negatives"],["Lecture from A","B 4, C 2, D 3, E 8"],["Floyd-Warshall","k outer: D[i][j] = min(D[i][j], D[i][k]+D[k][j]); O(V\xB3)"],["Bellman-Ford","Negative weights OK; O(V\xB7E)"]]},{title:"Union-find",rows:[["makeSet","parent[x] = x"],["find","Follow parents to root; compress path"],["union","Link roots; smaller rank under larger"],["Cost","O(\u03B1(n)) amortised \u2248 constant"]]},{title:"Hashing",rows:[["Division","h(k) = k mod m, m prime"],["Chaining","List per slot; \u03B1 can exceed 1"],["Linear","(h + i) mod m; primary clustering"],["Quadratic","(h + i\xB2) mod m"],["Double","(h\u2081 + i\xB7h\u2082) mod m; h\u2082 \u2260 0"],["Load factor","\u03B1 = n / m; Java resizes at 0.75"],["Delete (open addr.)","Tombstone, not empty"],["Cost","O(1) average, O(n) worst"]]},{title:"BST and AVL",rows:[["BST rule","Left < node < right"],["Inorder","Sorted output"],["Delete, 2 children","Replace with inorder successor"],["Height","log n balanced, n degenerate"],["Balance factor","h(left) \u2212 h(right) \u2208 {\u22121, 0, 1}"],["Rotations","LL \u2192 right; RR \u2192 left; LR, RL \u2192 double"]]}],exam:{title:"Term 3 practice test",minutes:90,intro:"A practice paper on all Term 3 work, 100 marks. Use it to check you are ready for T4 questions that build on graphs, hashing and trees. Section A marks itself; mark Sections B and C against the memo.",sections:[{title:"Section A: Multiple choice",kind:"mcq",marksEach:2,questions:[{q:"Space used by an adjacency list:",options:["O(V)","O(V\xB2)","O(V + E)","O(E\xB2)"],answer:2},{q:"Which traversal finds the fewest-edge path in an unweighted graph?",options:["DFS","BFS","Inorder","Preorder"],answer:1},{q:"Kahn's algorithm produces:",options:["An MST","A topological order","Shortest paths","A hash table"],answer:1},{q:"An MST of a graph with 12 vertices has how many edges?",options:["11","12","13","66"],answer:0},{q:"Which algorithm handles negative edge weights (no negative cycles) for all pairs?",options:["Dijkstra","Prim","Floyd-Warshall","BFS"],answer:2},{q:"Union by rank attaches:",options:["Larger rank under smaller","Smaller rank under larger","Always right under left","Leaves under the root"],answer:1},{q:"h(k) = k mod 11. Key 57 goes to slot:",options:["2","5","6","7"],answer:0},{q:"Primary clustering is a problem for:",options:["Chaining","Linear probing","Double hashing","BSTs"],answer:1},{q:"Inorder traversal of a BST gives:",options:["Level order","Sorted keys","Reverse insertion order","Root first"],answer:1},{q:"Inserting 10, 20, 30 into an AVL tree needs:",options:["No rotation","A single left rotation","A single right rotation","An LR double rotation"],answer:1}]},{title:"Section B: Graphs and traversal",kind:"written",questions:[{q:"Draw the adjacency matrix for the undirected weighted graph with edges P\u2013Q 3, P\u2013R 1, Q\u2013R 7, Q\u2013S 5, R\u2013S 2, S\u2013T 7, R\u2013T 8. State its space complexity.",marks:6,model:"Symmetric 5 \xD7 5 matrix, with 0 (or \u221E) where no edge: P: 0 3 1 0 0. Q: 3 0 7 5 0. R: 1 7 0 2 8. S: 0 5 2 0 7. T: 0 0 8 7 0 (4). O(V\xB2) (2)."},{q:"For the same graph, trace BFS and DFS from P (alphabetical neighbours). Show the queue for BFS and the call stack for DFS.",marks:10,model:"BFS (5): [P] \u2192 P: Q, R \u2192 [Q, R] \u2192 Q: S \u2192 [R, S] \u2192 R: T \u2192 [S, T] \u2192 S \u2192 T. Order P, Q, R, S, T. DFS (5): P \u2192 Q \u2192 R (Q's first unvisited) \u2192 S (R's next: P, Q visited, S) \u2192 T. Order P, Q, R, S, T, with stack P, Q, R, S, T before backtracking."},{q:"Explain why BFS on an adjacency matrix is O(V\xB2) but on an adjacency list is O(V + E).",marks:4,model:"Each vertex is processed once in both (1). With a matrix, finding its neighbours scans a full row of V cells, so V \xD7 V (2). With a list, each vertex scans only its own neighbours, so the total is \u03A3 deg = 2E, plus V (1)."},{q:"Give Kahn's algorithm in steps and apply it to the DAG with edges 1\u21922, 1\u21923, 2\u21924, 3\u21924, 4\u21925.",marks:8,model:"Steps (3): compute in-degrees; enqueue all with in-degree 0; repeatedly dequeue u, output it, decrement in-degree of its successors, enqueue those reaching 0; if not all output, there is a cycle. Application (5): in-degrees 1:0, 2:1, 3:1, 4:2, 5:1. Order 1, 2, 3, 4, 5."},{q:"Write a Java method that returns true if an undirected graph (adjacency list) is connected.",marks:12,model:"Handle the empty graph (1). Run BFS or DFS from vertex 0 with a visited array (6). Return true only if every vertex was visited (3). Complexity O(V + E) stated (2)."}]},{title:"Section C: MST, shortest paths, union-find and hashing",kind:"written",questions:[{q:"Apply Kruskal's algorithm to the graph in Section B. List the edges in the order considered, say whether each is added or skipped, and give the MST weight.",marks:8,model:"Sorted: P\u2013R 1, R\u2013S 2, P\u2013Q 3, Q\u2013S 5, Q\u2013R 7, S\u2013T 7, R\u2013T 8 (2). Add P\u2013R, R\u2013S, P\u2013Q (2). Skip Q\u2013S and Q\u2013R (same component) (2). Add S\u2013T 7, stop at 4 edges. Weight 1 + 2 + 3 + 7 = 13 (2)."},{q:"Apply Dijkstra's algorithm from P on the same graph. Show the distance table after each vertex is finalised.",marks:10,model:"Start P 0 (1). Finalise P: Q 3, R 1 (2). Finalise R (1): Q stays 3 (1 + 7 = 8), S 3, T 9 (2). Finalise Q (3) and S (3): S gives T = min(9, 3 + 7 = 10) = 9 (3). Final: Q 3, R 1, S 3, T 9 (2)."},{q:"Elements 0\u20135 start as singletons. Perform union(0,1), union(2,3), union(1,3), union(4,5) with union by rank. Show the parent array and say whether 0 and 3 are connected.",marks:6,model:"union(0,1): parent[1] = 0, rank[0] = 1. union(2,3): parent[3] = 2, rank[2] = 1. union(1,3): roots 0 and 2, equal rank, parent[2] = 0, rank[0] = 2. union(4,5): parent[5] = 4. Parent = [0, 0, 0, 2, 4, 4] (4). find(0) = find(3) = 0, so connected (2)."},{q:"Insert 12, 44, 13, 88, 23, 94, 11, 39 into a table of size 11 with h(k) = k mod 11, using (a) linear probing and (b) separate chaining. Give the load factor.",marks:10,model:"(a) 12\u21921, 44\u21920, 13\u21922, 88\u21920 taken\u21921 taken\u21922 taken\u21923, 23\u21921 taken\u2192\u2026\u21924, 94\u21926, 11\u21920\u2026\u21925, 39\u21926 taken\u21927 (5). (b) Slot 0: 44, 88, 11. Slot 1: 12, 23. Slot 2: 13. Slot 6: 94, 39 (3). \u03B1 = 8/11 \u2248 0.73 (2)."},{q:"Insert 40, 20, 10, 25, 30 into an AVL tree. Name every rotation and draw the final tree.",marks:6,model:"10 causes LL at 40 \u2192 right rotation, root 20 with 10 and 40 (2). 25 goes left of 40. 30: 40 becomes +2 with path L then R \u2192 LR at 40: left rotation at 25, right rotation at 40 \u2192 30 with children 25 and 40 (3). Final: 20 (10, 30 (25, 40)) (1)."}]}]}};var Bx={id:"SO1",ready:!0,title:"GPS and bitmap image data structures",summary:"How location data and raster images are stored in memory, and the spatial structures (grids, quadtrees, k-d trees, R-trees) that make searching them fast.",why:'Every ride-hailing app, delivery tracker and photo editor depends on these structures. Uber asks "which drivers are within 2 km?" thousands of times a second; a phone camera writes millions of pixels per photo. Choosing a plain list instead of a spatial index turns an instant query into a slow one.',visualizers:["quadtree","bitmap"],notes:[{t:"h",text:"1. GPS coordinates as data"},{t:"p",text:"A GPS receiver reports a position as **latitude** and **longitude** on the WGS-84 model of the Earth. Latitude runs from \u221290\xB0 (South Pole) to +90\xB0 (North Pole). Longitude runs from \u2212180\xB0 to +180\xB0, with 0\xB0 at Greenwich. South and West are negative."},{t:"diagram",id:"latlon",caption:"Latitude lines are flat (east\u2013west) and measure north\u2013south. Longitude lines run pole to pole and measure east\u2013west."},{t:"p",text:"Coordinates appear in two formats. **Decimal degrees (DD)** are what programs store: `-33.9321, 18.4290`. **Degrees, minutes, seconds (DMS)** are what people read: 33\xB0 55\u2032 55.6\u2033 S, 18\xB0 25\u2032 44.4\u2033 E. Convert with:"},{t:"formula",text:"DD = degrees + minutes / 60 + seconds / 3600   (negate for S or W)"},{t:"p",text:"Precision matters. One degree of latitude is about **111 km**, so each decimal place divides that by ten. Five decimal places (0.00001\xB0) is about **1.1 m**, which is roughly what a phone GPS can achieve."},{t:"table",head:["Decimal places","Degrees","Approx. distance","Good enough for"],rows:[["1","0.1","11 km","City"],["3","0.001","111 m","Neighbourhood"],["5","0.00001","1.1 m","Phone GPS"],["7","0.0000001","1.1 cm","Survey equipment"]]},{t:"h",text:"2. Storing a point and a track"},{t:"p",text:"A single fix is a small record: latitude, longitude, and usually a timestamp, altitude and speed. There are three common ways to store the numbers, each a trade-off between space and precision:"},{t:"table",head:["Representation","Bytes per point (lat+lon)","Precision","Notes"],rows:[["2 \xD7 double","16","~15 significant digits","Simplest; what Java and Python use by default"],["2 \xD7 float","8","~7 significant digits (\u22481 m)","Halves memory; borderline precision"],["2 \xD7 int, degrees \xD7 10\u2077","8","1e-7\xB0 (\u22481.1 cm)","Fixed-point; used by many GPS chips and file formats"]]},{t:"p",text:"A **track** (a recorded route) is an ordered sequence of points. An `ArrayList` is the usual choice: appending a new fix is amortised **O(1)**, and you can jump to the i-th point in **O(1)**. A linked list also gives O(1) append but loses random access, so it only makes sense if you constantly insert or delete in the middle (for example, simplifying a route)."},{t:"code",title:"A GPS point and track",java:`public class GpsPoint {
    final double lat, lon;   // decimal degrees, WGS-84
    final long time;         // epoch milliseconds

    GpsPoint(double lat, double lon, long time) {
        if (lat < -90 || lat > 90 || lon < -180 || lon > 180)
            throw new IllegalArgumentException("Coordinate out of range");
        this.lat = lat; this.lon = lon; this.time = time;
    }

    // Great-circle distance in kilometres (haversine formula)
    double distanceTo(GpsPoint o) {
        final double R = 6371.0;
        double dLat = Math.toRadians(o.lat - lat);
        double dLon = Math.toRadians(o.lon - lon);
        double a = Math.sin(dLat / 2) * Math.sin(dLat / 2)
                 + Math.cos(Math.toRadians(lat)) * Math.cos(Math.toRadians(o.lat))
                 * Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }
}

class Track {
    private final List<GpsPoint> points = new ArrayList<>();

    void add(GpsPoint p) { points.add(p); }          // amortised O(1)

    double lengthKm() {                               // O(n)
        double total = 0;
        for (int i = 1; i < points.size(); i++)
            total += points.get(i - 1).distanceTo(points.get(i));
        return total;
    }
}`,python:`from math import radians, sin, cos, atan2, sqrt
from dataclasses import dataclass

@dataclass
class GpsPoint:
    lat: float   # decimal degrees
    lon: float
    time: int    # epoch ms

    def distance_to(self, o: "GpsPoint") -> float:
        R = 6371.0
        d_lat = radians(o.lat - self.lat)
        d_lon = radians(o.lon - self.lon)
        a = sin(d_lat/2)**2 + cos(radians(self.lat)) * cos(radians(o.lat)) * sin(d_lon/2)**2
        return 2 * R * atan2(sqrt(a), sqrt(1 - a))

def track_length(points: list[GpsPoint]) -> float:
    return sum(points[i-1].distance_to(points[i]) for i in range(1, len(points)))`},{t:"callout",kind:"tip",title:"Why not just use Pythagoras?",text:"Degrees of longitude shrink as you move away from the equator (they are zero at the poles), and the Earth is curved. Over a few hundred metres a flat approximation is fine; across a country it is badly wrong. The **haversine** formula measures distance along the sphere."},{t:"h",text:"3. Reading raw GPS data (NMEA)"},{t:"p",text:"GPS chips send text lines called **NMEA sentences**. The `$GPGGA` sentence holds a fix, but in the awkward format **DDMM.MMMM** (degrees and decimal minutes):"},{t:"formula",text:"$GPGGA,123519,3355.926,S,01825.740,E,1,08,0.9,42.0,M,..."},{t:"p",text:"`3355.926,S` means 33\xB0 55.926\u2032 South. Take the digits before the last two whole-number digits as degrees: 33 + 55.926/60 = 33.9321, negated for South = **\u221233.9321**. Longitude has three degree digits: 018 + 25.740/60 = **18.4290**."},{t:"code",title:"Parsing NMEA degrees-minutes",java:`// "3355.926", "S"  ->  -33.9321
static double nmeaToDecimal(String value, String hemisphere) {
    double raw = Double.parseDouble(value);
    int degrees = (int) (raw / 100);          // 3355.926 / 100 = 33
    double minutes = raw - degrees * 100;     // 55.926
    double dd = degrees + minutes / 60.0;
    return (hemisphere.equals("S") || hemisphere.equals("W")) ? -dd : dd;
}`,python:`def nmea_to_decimal(value: str, hemisphere: str) -> float:
    raw = float(value)
    degrees = int(raw // 100)
    minutes = raw - degrees * 100
    dd = degrees + minutes / 60
    return -dd if hemisphere in ("S", "W") else dd`},{t:"h",text:"4. Spatial queries and why a list is too slow"},{t:"p",text:'The two questions a location app asks most are a **range query** ("all points inside this rectangle or circle") and a **nearest-neighbour query** ("the closest point to me"). With an unsorted list, both need a full scan: **O(n)** per query. With a million drivers and thousands of queries a second, that is too slow. A **spatial index** organises points by position so that most of the data can be skipped.'},{t:"p",text:"You cannot simply sort by latitude, because points with similar latitude can be on opposite sides of the world. The structures below split space in two dimensions at once."},{t:"h",text:"5. Uniform grid"},{t:"p",text:"Divide the map into equal cells and keep a list of points per cell (a 2D array of lists, or a hash map from cell to list). Finding the cell for a point is **O(1)**: `col = (int)((lon - minLon) / cellSize)`. A range query only checks cells that overlap the range. Grids are simple and fast when points are spread evenly, but waste memory on empty cells (oceans) and overload cells in dense areas (city centres)."},{t:"h",text:"6. Quadtree"},{t:"p",text:"A **quadtree** is a tree in which every internal node has exactly **four children**, one for each quadrant of its square region: **NW, NE, SW, SE**. Each node holds up to a fixed number of points (its capacity). When a node overflows, it **subdivides** into four children and pushes its points down. Dense areas get deep, fine subdivisions; empty areas stay as single large leaves. The grid adapts to the data."},{t:"diagram",id:"quadtree",caption:"A region quadtree with capacity 1. The dense top-right corner is subdivided twice; empty quadrants are left alone."},{t:"code",title:"Point quadtree (capacity 4)",java:`class QuadTree {
    static final int CAPACITY = 4;
    final double x, y, half;                  // centre and half-width of this square
    final List<double[]> points = new ArrayList<>();
    QuadTree nw, ne, sw, se;                  // null until subdivided

    QuadTree(double x, double y, double half) { this.x = x; this.y = y; this.half = half; }

    boolean contains(double px, double py) {
        return px >= x - half && px < x + half && py >= y - half && py < y + half;
    }

    boolean insert(double px, double py) {
        if (!contains(px, py)) return false;
        if (nw == null && points.size() < CAPACITY) { points.add(new double[]{px, py}); return true; }
        if (nw == null) subdivide();
        return nw.insert(px, py) || ne.insert(px, py) || sw.insert(px, py) || se.insert(px, py);
    }

    private void subdivide() {
        double h = half / 2;
        nw = new QuadTree(x - h, y + h, h);  ne = new QuadTree(x + h, y + h, h);
        sw = new QuadTree(x - h, y - h, h);  se = new QuadTree(x + h, y - h, h);
        for (double[] p : points) insert(p[0], p[1]);   // push existing points down
        points.clear();
    }

    // All points inside the rectangle [minX,maxX] x [minY,maxY]
    void query(double minX, double minY, double maxX, double maxY, List<double[]> out) {
        if (maxX < x - half || minX >= x + half || maxY < y - half || minY >= y + half) return; // prune
        for (double[] p : points)
            if (p[0] >= minX && p[0] <= maxX && p[1] >= minY && p[1] <= maxY) out.add(p);
        if (nw != null) { nw.query(minX, minY, maxX, maxY, out); ne.query(minX, minY, maxX, maxY, out);
                          sw.query(minX, minY, maxX, maxY, out); se.query(minX, minY, maxX, maxY, out); }
    }
}`,python:`class QuadTree:
    CAPACITY = 4

    def __init__(self, x, y, half):
        self.x, self.y, self.half = x, y, half
        self.points = []
        self.children = None            # [nw, ne, sw, se] after subdivision

    def contains(self, px, py):
        return self.x - self.half <= px < self.x + self.half and self.y - self.half <= py < self.y + self.half

    def insert(self, px, py):
        if not self.contains(px, py):
            return False
        if self.children is None and len(self.points) < self.CAPACITY:
            self.points.append((px, py))
            return True
        if self.children is None:
            self._subdivide()
        return any(c.insert(px, py) for c in self.children)

    def _subdivide(self):
        h = self.half / 2
        self.children = [QuadTree(self.x - h, self.y + h, h), QuadTree(self.x + h, self.y + h, h),
                         QuadTree(self.x - h, self.y - h, h), QuadTree(self.x + h, self.y - h, h)]
        for p in self.points:
            self.insert(*p)
        self.points = []

    def query(self, min_x, min_y, max_x, max_y, out):
        if max_x < self.x - self.half or min_x >= self.x + self.half or \\
           max_y < self.y - self.half or min_y >= self.y + self.half:
            return out                  # region does not overlap: skip the whole subtree
        out += [p for p in self.points if min_x <= p[0] <= max_x and min_y <= p[1] <= max_y]
        for c in self.children or []:
            c.query(min_x, min_y, max_x, max_y, out)
        return out`},{t:"table",head:["Operation","Average (spread-out points)","Worst case (heavily clustered)"],rows:[["Insert","O(log n)","O(depth), depth limited only by coordinate precision"],["Point search","O(log n)","O(depth)"],["Range query","O(log n + k), k = points returned","O(n)"],["Space","O(n)","O(n \xB7 depth) nodes in pathological cases"]]},{t:"h",text:"7. k-d tree and R-tree"},{t:"p",text:"A **k-d tree** is a binary search tree that alternates the splitting axis at each level: the root splits by x (longitude), its children by y (latitude), their children by x again, and so on. Each node holds one point. It works in any number of dimensions and gives O(log n) average search when balanced, but it is awkward to rebalance after many inserts."},{t:"p",text:"An **R-tree** groups nearby objects inside **minimum bounding rectangles (MBRs)**. Each internal node stores the rectangles of its children, and rectangles may overlap. Like a B-tree, it stays **height-balanced** and keeps many entries per node, which suits disk storage. It indexes shapes (roads, suburbs, buildings), not only points. PostGIS, SQLite and Oracle Spatial all use R-trees."},{t:"diagram",id:"rtree",caption:"R-tree: leaf rectangles R3\u2013R6 hold objects; R1 and R2 bound groups of leaves; the root bounds everything."},{t:"table",head:["Structure","Splits space by","Children per node","Best for"],rows:[["Uniform grid","Fixed equal cells","\u2013","Evenly spread points, simple code"],["Quadtree","Four equal quadrants","4","Points and images in 2D, uneven density"],["k-d tree","One axis per level, at a data point","2","Nearest-neighbour search, static data"],["R-tree","Bounding rectangles of the data","Many (M)","Shapes on disk, databases, GIS"]]},{t:"p",text:"**Geohash** is a related trick: interleave the bits of latitude and longitude and write them in base 32, giving strings like `k3vp5` for central Cape Town. Points that share a longer prefix are usually close, so a plain string index (or a hash map) can do rough proximity searches."},{t:"h",text:"8. Bitmap (raster) images"},{t:"p",text:"A **bitmap** stores an image as a rectangular grid of **pixels**. In memory it is a **2D array** `pixels[height][width]`, or a 1D array in **row-major** order where pixel (x, y) is at index `y \xD7 width + x`. This is the same row-major storage you met for 2D arrays in Term 1."},{t:"diagram",id:"bitmap",caption:"An 8 \xD7 8, 1-bit image of a smiley. Each row is exactly one byte, written here in binary and hex."},{t:"p",text:"The **bit depth** (bits per pixel, bpp) decides how many colours a pixel can have: 2^bpp."},{t:"table",head:["Bit depth","Colours","Typical use","Pixel stored as"],rows:[["1 bpp","2","Black and white, fax, QR codes","8 pixels packed per byte"],["8 bpp","256","Greyscale or a colour palette (GIF)","1 byte, or an index into a palette"],["24 bpp","16 777 216","True colour photos","3 bytes: R, G, B"],["32 bpp","16.7 M + transparency","Screens, PNG with alpha","4 bytes: A, R, G, B in one int"]]},{t:"formula",text:"Uncompressed size (bytes) = width \xD7 height \xD7 bits per pixel \xF7 8"},{t:"p",text:"Example: a 1920 \xD7 1080 photo at 24 bpp is 1920 \xD7 1080 \xD7 3 = **6 220 800 bytes** (about 5.9 MB). That is why images are compressed."},{t:"h",text:"9. Packing pixels with bit operations"},{t:"p",text:"In Java, `BufferedImage.getRGB(x, y)` returns one `int` holding four 8-bit channels: `0xAARRGGBB`. You extract a channel by shifting it to the bottom and masking with `0xFF`. In a 1-bit image, pixel x of a row lives in byte `x / 8` at bit `7 \u2212 (x % 8)` (most significant bit first)."},{t:"code",title:"Channels and packed bits",java:`int argb = image.getRGB(x, y);
int a = (argb >>> 24) & 0xFF;
int r = (argb >> 16) & 0xFF;
int g = (argb >> 8)  & 0xFF;
int b =  argb        & 0xFF;

// Greyscale using perceived brightness weights
int grey = (int) Math.round(0.299 * r + 0.587 * g + 0.114 * b);
int greyPixel = (a << 24) | (grey << 16) | (grey << 8) | grey;

// 1-bit image: one row stored in a byte[]
static int getBit(byte[] row, int x) {
    return (row[x >> 3] >> (7 - (x & 7))) & 1;      // x>>3 == x/8, x&7 == x%8
}
static void setBit(byte[] row, int x, int v) {
    int mask = 1 << (7 - (x & 7));
    if (v == 1) row[x >> 3] |= mask; else row[x >> 3] &= ~mask;
}`,python:`argb = 0xFF3366CC
a, r, g, b = (argb >> 24) & 0xFF, (argb >> 16) & 0xFF, (argb >> 8) & 0xFF, argb & 0xFF
grey = round(0.299*r + 0.587*g + 0.114*b)

def get_bit(row: bytearray, x: int) -> int:
    return (row[x >> 3] >> (7 - (x & 7))) & 1

def set_bit(row: bytearray, x: int, v: int) -> None:
    mask = 1 << (7 - (x & 7))
