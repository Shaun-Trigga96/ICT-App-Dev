System.out.println(steps);`,options:["1","2","3","6"],answer:1,explain:"mid 3 (7 < 11, low = 4), then mid 5 (11), found on step 2."},{type:"mcq",q:"Average number of comparisons for a successful linear search on 10 elements, if every position is equally likely:",options:["1","5","5.5","10"],answer:2,explain:"(1 + 2 + ... + 10) / 10 = 55 / 10 = 5.5, that is (n + 1)/2."},{type:"mcq",q:'In iterative binary search, the loop ends with "not found" when:',options:["low == high","low > high","mid == 0","a[mid] > target"],answer:1,explain:"When low passes high the search space is empty."}]},hx={id:"SO4",ready:!0,title:"Bubble sort and best, average and worst case",summary:"Tracing bubble sort pass by pass on the lecturer's array {90, 23, 5, 109, 12}, counting comparisons and swaps, the early-exit flag, stability, shaker sort, and why matrix multiplication is O(n\xB3).",why:"The bubble sort trace on {90, 23, 5, 109, 12} was worth 12 marks in the April 2025 test, with another 5 marks for its Big-O. It is the simplest sort to reason about, which makes it the standard way to learn best, average and worst case analysis before quick sort and heap sort in Term 2.",visualizers:["sorting"],notes:[{t:"h",text:"1. How bubble sort works"},{t:"p",text:'Walk through the array comparing each **adjacent pair**. If the left value is larger than the right, **swap** them. One complete walk is a **pass**. After pass 1 the largest value has "bubbled" to the last position; after pass 2 the second largest is in place, and so on. For n elements, n \u2212 1 passes are always enough.'},{t:"code",title:"Bubble sort as in Big O.docx (naive: every pass checks every pair)",java:`/**
 * Time:  steps (n-1)(n-1) = n\xB2 - 2n + 1   \u2192  O(n\xB2)
 * Space: 3 variables (i, j, temp)         \u2192  O(1)
 */
public static void bubbleSort(int[] numbers) {
    int n = numbers.length;
    for (int i = 0; i < n - 1; i++) {           // n - 1 passes
        for (int j = 0; j < n - 1; j++) {       // n - 1 comparisons per pass
            if (numbers[j] > numbers[j + 1]) {
                int temp = numbers[j];          // swap
                numbers[j] = numbers[j + 1];
                numbers[j + 1] = temp;
            }
        }
    }
}`,python:`def bubble_sort(numbers):
    n = len(numbers)
    for i in range(n - 1):            # n - 1 passes
        for j in range(n - 1):        # n - 1 comparisons each
            if numbers[j] > numbers[j + 1]:
                numbers[j], numbers[j + 1] = numbers[j + 1], numbers[j]`},{t:"h",text:"2. Full trace on {90, 23, 5, 109, 12}"},{t:"p",text:"This is the exact array from the practice questions and the April 2025 test. Bold values are in their final position."},{t:"table",head:["Pass","Comparison","Action","Array after"],rows:[["1","90 vs 23","swap","{23, 90, 5, 109, 12}"],["1","90 vs 5","swap","{23, 5, 90, 109, 12}"],["1","90 vs 109","no swap","{23, 5, 90, 109, 12}"],["1","109 vs 12","swap","{23, 5, 90, 12, **109**}"],["2","23 vs 5","swap","{5, 23, 90, 12, **109**}"],["2","23 vs 90","no swap","{5, 23, 90, 12, **109**}"],["2","90 vs 12","swap","{5, 23, 12, **90**, **109**}"],["3","5 vs 23","no swap","{5, 23, 12, **90**, **109**}"],["3","23 vs 12","swap","{5, 12, **23**, **90**, **109**}"],["4","5 vs 12","no swap","{**5**, **12**, **23**, **90**, **109**}"]]},{t:"table",head:["After pass","Array","Swaps in this pass"],rows:[["1","{23, 5, 90, 12, 109}","3"],["2","{5, 23, 12, 90, 109}","2"],["3","{5, 12, 23, 90, 109}","1"],["4","{5, 12, 23, 90, 109}","0"]]},{t:"p",text:"Totals: **6 swaps**. The optimised version (shrinking inner loop) makes 4 + 3 + 2 + 1 = **10 comparisons**. The naive Big O.docx version also compares the already-sorted tail every pass: 4 passes \xD7 4 comparisons = **16 comparisons**, which is the lecturer's (n \u2212 1)(n \u2212 1) with n = 5. The swaps are the same, 6, in both versions."},{t:"callout",kind:"tip",title:"Sorted is not the same as finished",text:'The array is already sorted after pass 3, and some memos stop the trace there. The algorithm itself does not know it is sorted until it has made a pass with **no swaps**. Pass 3 made a swap, so pass 4 still runs (in the flagged version, pass 4 is 1 comparison with no swap). Showing that final check earns the "understands the mechanism" mark.'},{t:"callout",kind:"why",title:"How many swaps? Count inversions",text:"Each swap fixes exactly one **inversion** (a pair that is out of order). {90, 23, 5, 109, 12} has 6 inversions: (90,23), (90,5), (90,12), (23,5), (23,12), (109,12). So bubble sort must make exactly 6 swaps, whichever version you use. This is a quick way to check your trace."},{t:"h",text:"3. Counting comparisons: (n \u2212 1)(n \u2212 1) vs n(n \u2212 1)/2"},{t:"p",text:'From the L1Algorithms slides: "If we are sorting n numbers, then we have to do (n \u2212 1) comparisons in each pass. And we have to do (n \u2212 1) passes. Therefore in total we have to do (n \u2212 1)(n \u2212 1) comparisons."'},{t:"p",text:"The improved version from the slides (`i < a.length - 1 - j`) skips the sorted tail. Pass 1 makes n \u2212 1 comparisons, pass 2 makes n \u2212 2, down to 1:"},{t:"formula",text:`Naive:      (n \u2212 1)(n \u2212 1) = n\xB2 \u2212 2n + 1                     \u2192 O(n\xB2)
Optimised:  (n \u2212 1) + (n \u2212 2) + ... + 1 = n(n \u2212 1)/2 = n\xB2/2 \u2212 n/2  \u2192 O(n\xB2)`},{t:"table",head:["n","Naive (n \u2212 1)\xB2","Optimised n(n \u2212 1)/2"],rows:[["5","16","10"],["10","81","45"],["100","9 801","4 950"],["1 000","998 001","499 500"]]},{t:"p",text:'The optimisation roughly halves the work, but halving does not change the Big-O: both are **O(n\xB2)**. The Bubble Sort and Matrix Multiplication slides make the same point: "given that you want to sort 1000 numbers you would need to perform in the region of **1 000 000 comparisons**. This could be very time consuming." (998 001 \u2248 1 000 000.) O(n log n) sorts such as quick sort need only about 10 000 for the same input.'},{t:"h",text:"4. The early-exit flag and best, average and worst case"},{t:"p",text:'The slides suggest the obvious improvement: "remember whether or not any exchanges have taken place during a pass". If a whole pass makes no swaps, the array is sorted and we can stop.'},{t:"code",title:"Optimised bubble sort: shrinking range + swapped flag",java:`public static void bubbleSort(int[] a) {
    int n = a.length;
    for (int i = 0; i < n - 1; i++) {
        boolean swapped = false;
        for (int j = 0; j < n - 1 - i; j++) {    // last i elements are already in place
            if (a[j] > a[j + 1]) {
                int temp = a[j];
                a[j] = a[j + 1];
                a[j + 1] = temp;
                swapped = true;
            }
        }
        if (!swapped) break;                      // no swaps: already sorted
    }
}`,python:`def bubble_sort(a):
    n = len(a)
    for i in range(n - 1):
        swapped = False
        for j in range(n - 1 - i):
            if a[j] > a[j + 1]:
                a[j], a[j + 1] = a[j + 1], a[j]
                swapped = True
        if not swapped:
            break`},{t:"table",head:["Case","Input (n = 5)","Comparisons","Swaps","Big-O"],rows:[["Best","Already sorted {1, 2, 3, 4, 5}","n \u2212 1 = 4 (one pass)","0","O(n)"],["Average","Random order","about n\xB2/2","about n\xB2/4","O(n\xB2)"],["Worst","Reverse sorted {5, 4, 3, 2, 1}","n(n \u2212 1)/2 = 10","n(n \u2212 1)/2 = 10","O(n\xB2)"]]},{t:"p",text:"**Without the flag, bubble sort is O(n\xB2) even on sorted input**, because it blindly runs every pass. The best case of O(n) exists only for the flagged version, which is why the slides call bubble sort **adaptive**: it is fast on nearly sorted data."},{t:"p",text:"**Space complexity is O(1)** in every case: bubble sort is **in place**, needing only i, j, temp and the flag."},{t:"h",text:"5. Stability"},{t:"p",text:"A sort is **stable** if equal values keep their original relative order. Bubble sort is stable because it only swaps when the left value is **strictly greater** (`>`). Equal neighbours are never swapped. Sorting (5, a), (3, x), (5, b), (1, y) by number gives (1, y), (3, x), (5, a), (5, b): the two 5s stay in order. Change `>` to `>=` and it becomes unstable, giving (5, b) before (5, a)."},{t:"p",text:"Stability matters when sorting records by one field after another, for example sorting students by name and then stably by class, so that each class stays alphabetical."},{t:"h",text:"6. Shaker sort (cocktail sort)"},{t:"p",text:'The slides point out a "strange asymmetry". A small value at the right-hand end moves left only **one place per pass**, so bubble sort needs n \u2212 1 passes to fix {2, 3, 4, 5, 1}. **Shaker sort** alternates a left-to-right pass (pushing the largest value right) with a right-to-left pass (pushing the smallest value left). It also remembers the index of the last swap and narrows the range from both ends.'},{t:"code",title:"Shaker sort (from the slides)",java:`public void shakerSort(int[] a) {
    int k = a.length, l = 0, r = a.length - 2;
    do {
        for (int i = l; i <= r; i++)                // left to right
            if (a[i] > a[i + 1]) { int t = a[i]; a[i] = a[i + 1]; a[i + 1] = t; k = i; }
        r = k - 1;
        for (int i = r; i >= l; i--)                // right to left
            if (a[i + 1] < a[i]) { int t = a[i]; a[i] = a[i + 1]; a[i + 1] = t; k = i; }
        l = k + 1;
    } while (l < r);
}`,python:`def shaker_sort(a):
    k, l, r = len(a), 0, len(a) - 2
    while True:
        for i in range(l, r + 1):
            if a[i] > a[i + 1]:
                a[i], a[i + 1] = a[i + 1], a[i]
                k = i
        r = k - 1
        for i in range(r, l - 1, -1):
            if a[i + 1] < a[i]:
                a[i], a[i + 1] = a[i + 1], a[i]
                k = i
        l = k + 1
        if not l < r:
            break`},{t:"p",text:"On {2, 3, 4, 5, 1}, the first backward sweep carries 1 all the way to the front. The slides stress the limits: these improvements reduce **comparisons**, not **swaps**, and swaps are the expensive part. Shaker sort is still O(n\xB2) and only helps when data is almost sorted."},{t:"h",text:"7. Matrix multiplication: O(n\xB3)"},{t:"p",text:"The same slide deck uses matrix multiplication to show cubic growth. To multiply an n \xD7 m matrix A by an m \xD7 p matrix B, each of the n \xD7 p results is a sum of m products: C[i][j] = \u03A3\u2096 A[i][k] \xD7 B[k][j]. Three nested loops."},{t:"code",title:"Matrix multiplication",java:`// For square n \xD7 n matrices: n \xB7 n \xB7 n multiplications \u2192 O(n\xB3)
public static int[][] multiply(int[][] A, int[][] B) {
    int n = A.length, m = B.length, p = B[0].length;   // A is n\xD7m, B is m\xD7p
    int[][] C = new int[n][p];
    for (int i = 0; i < n; i++)
        for (int j = 0; j < p; j++)
            for (int k = 0; k < m; k++)
                C[i][j] += A[i][k] * B[k][j];
    return C;
}`,python:`def multiply(A, B):
    n, m, p = len(A), len(B), len(B[0])
    C = [[0] * p for _ in range(n)]
    for i in range(n):
        for j in range(p):
            for k in range(m):
                C[i][j] += A[i][k] * B[k][j]
    return C`},{t:"p",text:"Example: A = [[1, 2, 3], [4, 5, 6]] (2 \xD7 3) times B = [[7, 8], [9, 10], [11, 12]] (3 \xD7 2) gives C = [[58, 64], [139, 154]], using 2 \xD7 2 \xD7 3 = 12 multiplications. For two 1000 \xD7 1000 matrices that becomes 10\u2079 multiplications."},{t:"table",head:["Algorithm","Best","Average","Worst","Space","Stable"],rows:[["Bubble sort (naive)","O(n\xB2)","O(n\xB2)","O(n\xB2)","O(1)","Yes"],["Bubble sort (with flag)","O(n)","O(n\xB2)","O(n\xB2)","O(1)","Yes"],["Shaker sort","O(n)","O(n\xB2)","O(n\xB2)","O(1)","Yes"],["Matrix multiplication (n \xD7 n)","O(n\xB3)","O(n\xB3)","O(n\xB3)","O(n\xB2) for C","n/a"]]}],concepts:[{term:"Bubble sort",def:"Repeatedly compares adjacent elements and swaps them if out of order, so the largest remaining value moves to the end each pass."},{term:"Pass",def:"One complete walk through the unsorted part of the array."},{term:"Comparison",def:"Checking whether a[j] > a[j + 1]; the main unit counted for bubble sort."},{term:"Swap (exchange)",def:"Exchanging two elements using a temporary variable; three assignments."},{term:"Inversion",def:"A pair of positions i < j with a[i] > a[j]. Bubble sort makes exactly one swap per inversion."},{term:"Swapped flag (early exit)",def:"A boolean recording whether a pass made any swap; if not, the array is sorted and the loop stops."},{term:"Adaptive sort",def:"A sort that runs faster on nearly sorted input; bubble sort with a flag is O(n) on sorted data."},{term:"In-place sort",def:"Uses only O(1) extra memory beyond the array."},{term:"Stable sort",def:"Keeps equal elements in their original relative order."},{term:"Shaker (cocktail) sort",def:"Bubble sort that alternates left-to-right and right-to-left passes and narrows the range from both ends."},{term:"(n \u2212 1)(n \u2212 1)",def:"The lecturer's comparison count for naive bubble sort: n \u2212 1 passes of n \u2212 1 comparisons."},{term:"n(n \u2212 1)/2",def:"Comparisons for bubble sort with a shrinking inner loop (and the worst-case number of swaps)."},{term:"Matrix multiplication",def:"C[i][j] = \u03A3 A[i][k] \xD7 B[k][j]; three nested loops, O(n\xB3) for n \xD7 n matrices."},{term:"Best / average / worst case",def:"For bubble sort with a flag: sorted input O(n); random input O(n\xB2); reverse-sorted input O(n\xB2)."}],mnemonics:[{title:"Biggest bubble rises first",text:"In ascending bubble sort the biggest remaining value travels to the right end on every pass, like the biggest bubble rising to the top of a glass. Each pass fixes one more place at the end."},{title:"n minus one, n minus one",text:"Naive bubble sort: (n \u2212 1) passes \xD7 (n \u2212 1) comparisons = (n \u2212 1)\xB2. For 1000 numbers \u2248 1 000 000 comparisons."},{title:"No swap, stop",text:"A pass with no swaps means the array is sorted. That flag is the only reason bubble sort has an O(n) best case."},{title:"Swaps = inversions",text:"Count the out-of-order pairs before you trace. That is exactly the number of swaps your trace must show."},{title:"Three loops, three powers",text:"Matrix multiplication has three nested loops: i, j and k, so O(n\xB3)."}],pitfalls:["Stopping the trace when the array first looks sorted. The algorithm only stops after a full pass with no swaps (or after n \u2212 1 passes).","Claiming bubble sort is O(n) in the best case without mentioning the swapped flag. The plain version is O(n\xB2) on every input.","Saying the optimised version is O(n\xB2/2). Drop the constant: O(n\xB2).","Writing `j < n` instead of `j < n - 1` in the inner loop, so `a[j + 1]` reads past the end of the array.","Using `>=` in the comparison, which makes extra swaps of equal values and breaks stability.","Swapping without a temporary variable (`a[j] = a[j+1]; a[j+1] = a[j];`), which copies one value over the other.","Confusing comparisons with swaps. Comparisons depend only on n (and the flag); swaps depend on how unsorted the input is.","The Big O.docx print loop `for (i = 0; i < numbers.length - 1; i++)` stops one early and never prints the largest value. Use `i < numbers.length`."],examples:[{title:"Bubble sort trace for 12 marks",problem:"Show how bubble sort modifies {90, 23, 5, 109, 12} as it executes. Show enough changes to demonstrate the mechanism. (Practice questions and April 2025 Test 1, Question 3.1.)",steps:["Pass 1: 90>23 swap {23,90,5,109,12}; 90>5 swap {23,5,90,109,12}; 90<109 no swap; 109>12 swap {23,5,90,12,109}. 109 is in place.","Pass 2: 23>5 swap {5,23,90,12,109}; 23<90 no swap; 90>12 swap {5,23,12,90,109}. 90 is in place.","Pass 3: 5<23 no swap; 23>12 swap {5,12,23,90,109}. 23 is in place.","Pass 4: 5<12 no swap. No swaps in this pass, so the algorithm stops.","Totals: 6 swaps; 10 comparisons with the shrinking inner loop (16 with the naive (n \u2212 1)(n \u2212 1) version)."],answer:"{5, 12, 23, 90, 109}. Marks come from: each pass shown with comparisons, swaps clearly marked, the sorted region growing at the right, and the final pass with no swaps."},{title:"Big-O of bubble sort for 5 marks",problem:"Show and explain the Big-O expression for bubble sort (time and space).",steps:["Outer loop: n \u2212 1 passes. Inner loop: n \u2212 1 comparisons per pass.","Total comparisons = (n \u2212 1)(n \u2212 1) = n\xB2 \u2212 2n + 1.","Drop the lower-order terms \u22122n and +1: O(n\xB2).","Space: only i, j and temp, independent of n: O(1).","Best case with a swapped flag on sorted input: one pass of n \u2212 1 comparisons, O(n)."],answer:"Time O(n\xB2) (average and worst), best case O(n) with the flag; space O(1)."},{title:"Best and worst case counts",problem:"Count the comparisons and swaps made by the flagged, shrinking bubble sort on {1, 2, 3, 4, 5} and on {5, 4, 3, 2, 1}.",steps:["Sorted: pass 1 compares 4 pairs, makes 0 swaps, the flag stays false and the loop breaks.","Reverse: every comparison is a swap. Pass 1: 4, pass 2: 3, pass 3: 2, pass 4: 1.","Reverse totals: 4 + 3 + 2 + 1 = 10 comparisons and 10 swaps = n(n \u2212 1)/2."],answer:"Sorted: 4 comparisons, 0 swaps (best case, O(n)). Reverse: 10 comparisons, 10 swaps (worst case, O(n\xB2))."},{title:"Bubble sort on the 8-element test array",problem:"Give the array after each pass of the flagged bubble sort on {90, 23, 5, 109, 12, 22, 67, 34}, and the totals.",steps:["Pass 1: {23, 5, 90, 12, 22, 67, 34, 109}","Pass 2: {5, 23, 12, 22, 67, 34, 90, 109}","Pass 3: {5, 12, 22, 23, 34, 67, 90, 109}","Pass 4: no swaps, stop.","Comparisons: 7 + 6 + 5 + 4 = 22. Swaps: 14 (the number of inversions)."],answer:"Sorted after 3 passes, confirmed by pass 4. 22 comparisons and 14 swaps, against (n \u2212 1)\xB2 = 49 comparisons for the naive version."},{title:"Multiply two matrices",problem:"Compute A \xD7 B for A = [[1, 2], [3, 4]] and B = [[5, 6], [7, 8]], and count the multiplications.",steps:["C[0][0] = 1\xB75 + 2\xB77 = 19","C[0][1] = 1\xB76 + 2\xB78 = 22","C[1][0] = 3\xB75 + 4\xB77 = 43","C[1][1] = 3\xB76 + 4\xB78 = 50","Multiplications: n\xB3 = 2\xB3 = 8"],answer:"C = [[19, 22], [43, 50]] using 8 multiplications. For n = 1000, n\xB3 = 1 000 000 000."}],exercises:[{q:"Trace the flagged bubble sort on {7, 3, 9, 1, 5, 2}. Give the array after each pass and the totals.",solution:"Pass 1: {3, 7, 1, 5, 2, 9}. Pass 2: {3, 1, 5, 2, 7, 9}. Pass 3: {1, 3, 2, 5, 7, 9}. Pass 4: {1, 2, 3, 5, 7, 9}. Pass 5: 1 comparison, no swap. Comparisons 5 + 4 + 3 + 2 + 1 = 15; swaps 10."},{q:"Trace bubble sort on {5, 1, 4, 2, 8} and say after which pass the flagged version stops.",solution:"Pass 1: {1, 4, 2, 5, 8} (3 swaps). Pass 2: {1, 2, 4, 5, 8} (1 swap). Pass 3: no swaps, stop. 4 + 3 + 2 = 9 comparisons, 4 swaps."},{q:"How many comparisons does the naive bubble sort make for n = 10? The shrinking version? The flagged version on already-sorted input?",solution:"Naive (n \u2212 1)\xB2 = 81. Shrinking n(n \u2212 1)/2 = 45. Flagged on sorted input: n \u2212 1 = 9."},{q:"Modify bubble sort to sort in descending order. What is the array after pass 1 on {90, 23, 5, 109, 12}?",solution:"Change the test to `if (a[j] < a[j + 1])`. Pass 1: 90 vs 23 no swap; 23 vs 5 no swap; 5 vs 109 swap \u2192 {90, 23, 109, 5, 12}; 5 vs 12 swap \u2192 {90, 23, 109, 12, 5}. The smallest value, 5, sinks to the end."},{q:"Explain why bubble sort is stable, and what change would make it unstable.",solution:"It swaps only when a[j] > a[j + 1], so two equal values are never swapped and keep their original order. Using >= would swap equal neighbours and could reverse their order."},{q:"Count the inversions in {4, 2, 7, 1, 3} and hence state how many swaps bubble sort makes. Check by tracing.",solution:"Inversions: (4,2), (4,1), (4,3), (2,1), (7,1), (7,3) = 6. Passes: {2, 4, 1, 3, 7}, {2, 1, 3, 4, 7}, {1, 2, 3, 4, 7}, then a pass with no swaps. 6 swaps."},{q:"Write a method that returns true if an int array is already sorted in ascending order. What is its complexity, and how does it relate to bubble sort's best case?",solution:[{t:"code",java:`static boolean isSorted(int[] a) {

}`,python:`def is_sorted(a):
    return all(a[i] <= a[i + 1] for i in range(len(a) - 1))`},{t:"p",text:"O(n): n \u2212 1 comparisons in the worst case. It is exactly what the first pass of flagged bubble sort does on sorted input, which is why that best case is O(n)."}]},{q:'Why does the slide say bubble sort improvements "in no way affect the number of exchanges"?',solution:"The flag and the shrinking range only skip comparisons that would not have caused a swap. Every inversion still needs its own swap, so the number of exchanges stays equal to the number of inversions. Since a swap (three assignments) costs more than a comparison, the improvements help less than you might expect."}],quiz:[{type:"mcq",q:"What is {90, 23, 5, 109, 12} after the first pass of bubble sort (ascending)?",options:["{23, 90, 5, 109, 12}","{23, 5, 90, 12, 109}","{5, 23, 90, 12, 109}","{5, 12, 23, 90, 109}"],answer:1,explain:"Swaps 90/23, 90/5 and 109/12; 90 vs 109 is not swapped. 109 ends in place."},{type:"mcq",q:"What is {90, 23, 5, 109, 12} after the second pass?",options:["{5, 23, 12, 90, 109}","{23, 5, 12, 90, 109}","{5, 12, 23, 90, 109}","{5, 23, 90, 12, 109}"],answer:0,explain:"From {23, 5, 90, 12, 109}: swap 23/5, keep 23/90, swap 90/12."},{type:"mcq",q:"How many swaps does bubble sort make on {90, 23, 5, 109, 12}?",options:["4","5","6","10"],answer:2,explain:"There are 6 inversions, and each swap removes exactly one."},{type:"mcq",q:"Using the lecturer's (n \u2212 1)(n \u2212 1) formula, how many comparisons for n = 5?",options:["10","16","20","25"],answer:1,explain:"4 \xD7 4 = 16."},{type:"mcq",q:"With the shrinking inner loop (j < n \u2212 1 \u2212 i), how many comparisons for n = 10 in the worst case?",options:["45","81","90","100"],answer:0,explain:"n(n \u2212 1)/2 = 10 \xD7 9 / 2 = 45."},{type:"complexity",q:"Best-case time of bubble sort WITH a swapped flag:",options:["O(1)","O(log n)","O(n)","O(n\xB2)"],answer:2,explain:"On sorted input one pass of n \u2212 1 comparisons finds no swaps and stops."},{type:"complexity",q:"Best-case time of bubble sort WITHOUT a swapped flag:",options:["O(1)","O(n)","O(n log n)","O(n\xB2)"],answer:3,explain:"It runs every pass regardless of the input."},{type:"complexity",q:"Space complexity of bubble sort:",options:["O(1)","O(log n)","O(n)","O(n\xB2)"],answer:0,explain:"It sorts in place using only a few variables."},{type:"tf",q:"Bubble sort is a stable sort when it swaps only if a[j] > a[j + 1].",options:["True","False"],answer:0,explain:"Equal values are never swapped, so their order is preserved."},{type:"mcq",q:"Which input is the worst case for bubble sort?",options:["Already sorted","All values equal","Reverse sorted","Random"],answer:2,explain:"Every comparison causes a swap: n(n \u2212 1)/2 swaps."},{type:"mcq",q:"About how many comparisons does naive bubble sort need for 1000 numbers, according to the slides?",options:["1 000","10 000","1 000 000","1 000 000 000"],answer:2,explain:"(999)\xB2 = 998 001, in the region of a million."},{type:"complexity",q:"Multiplying two n \xD7 n matrices with three nested loops is:",options:["O(n)","O(n\xB2)","O(n\xB3)","O(2\u207F)"],answer:2,explain:"n\xB2 results, each a sum of n products."},{type:"output",q:"What does this print?",code:`int[] a = {3, 1, 2};

System.out.println(swaps + " " + Arrays.toString(a));`,options:["1 [1, 2, 3]","2 [1, 2, 3]","3 [1, 2, 3]","2 [1, 3, 2]"],answer:1,explain:"Pass 1: 3>1 swap, 3>2 swap \u2192 [1, 2, 3]. Pass 2: 1<2. Two swaps."},{type:"mcq",q:"What problem does shaker sort address?",options:["Bubble sort is unstable","Small values at the right end move left only one place per pass","Bubble sort uses too much memory","Bubble sort cannot handle duplicates"],answer:1,explain:"Alternating directions lets a small value at the end travel all the way left in one backward sweep."}]},mx={id:"SO5",ready:!0,title:"2D arrays and linear linked lists",summary:"2D and multidimensional arrays (row-major storage, matrix operations), the limitations of arrays, and singly linked lists in Java: insert at front, end and after a node, delete, search and traversal.",why:"Tables, images, game boards and spreadsheets are 2D arrays. When the data keeps growing and shrinking (a playlist, an undo history, a queue of print jobs), a fixed-size array becomes a burden and a linked list is the natural fix. Linked lists are also the building block for the stacks, queues and graphs of Terms 2 and 3.",visualizers:["linkedlist"],notes:[{t:"h",text:"1. 2D arrays"},{t:"p",text:"A 2D array is a table of rows and columns, accessed with two indices: `matrix[row][col]`. In Java it is literally an **array of arrays**: `matrix[1]` is itself an `int[]` holding row 1."},{t:"code",title:"Declaring, accessing and traversing a 2D array",java:`int[][] matrix = {

int[][] grid = new int[3][4];        // 3 \xD7 4, all zeros

address(r, c) = base + (r \xD7 cols + c) \xD7 elementSize`},{t:"p",text:"For the 3 \xD7 4 matrix above, element (1, 2) is at index 1 \xD7 4 + 2 = **6**, which holds 70. If the array starts at address 1000 and each int takes 4 bytes, (1, 2) is at 1000 + 6 \xD7 4 = **1024** and (2, 3) is at 1000 + 11 \xD7 4 = **1044**. Going backwards, flat index 9 is row 9 \xF7 4 = 2, column 9 mod 4 = 1, which holds 100."},{t:"callout",kind:"tip",title:"Why the order of loops matters",text:"Because rows are stored contiguously, looping row by row (r outside, c inside) reads memory in order and is cache-friendly. Looping column by column jumps across memory and can be several times slower on large arrays, even though both are O(rows \xD7 cols). Bitmap images in Term 4 use exactly this row-major layout."},{t:"p",text:"Java also allows **jagged arrays**, where rows have different lengths, because each row is a separate array: `int[][] tri = new int[4][]; tri[0] = new int[1]; tri[1] = new int[2]; ...`. Always use `matrix[r].length` for the column count. **Multidimensional** arrays extend the idea: `int[][][] cube = new int[2][3][4]` has 24 elements, indexed (i \xD7 3 + j) \xD7 4 + k in row-major order."},{t:"h",text:"3. Common matrix operations"},{t:"code",title:"Row sums, column sums and transpose",java:`static int[] rowSums(int[][] m) {               // O(rows \xD7 cols)

    return sums;
}

    int data;
    Node next;                  // reference to the next node (null at the end)
    Node(int data) { this.data = data; this.next = null; }
}

class SinglyLinkedList {
    Node head;                  // first node; null when the list is empty

    // Insert at the front: O(1)
    void insertFront(int data) {
        Node newNode = new Node(data);
        newNode.next = head;    // 1. new node points at the old first node
        head = newNode;         // 2. head points at the new node
    }

    // Insert at the end: O(n), must walk to the last node
    void insertEnd(int data) {
        Node newNode = new Node(data);
        if (head == null) { head = newNode; return; }
        Node current = head;
        while (current.next != null) current = current.next;
        current.next = newNode;
    }

    // Insert after the first node holding key: O(n) to find, O(1) to link
    void insertAfter(int key, int data) {
        Node current = head;
        while (current != null && current.data != key) current = current.next;
        if (current == null) return;                // key not found
        Node newNode = new Node(data);
        newNode.next = current.next;                // 1. link new node forward first
        current.next = newNode;                     // 2. then link it in
    }

    // Delete the first node holding data: O(n)
    void delete(int data) {
        if (head == null) return;
        if (head.data == data) { head = head.next; return; }   // deleting the head
        Node current = head;
        while (current.next != null && current.next.data != data)
            current = current.next;                 // stop at the node BEFORE the target
        if (current.next != null)
            current.next = current.next.next;       // bypass the target
    }

    // Search: O(n), returns the position or -1
    int search(int data) {
        int index = 0;
        for (Node c = head; c != null; c = c.next, index++)
            if (c.data == data) return index;
        return -1;
    }

    // Traverse: O(n)
    void display() {
        for (Node c = head; c != null; c = c.next)
            System.out.print(c.data + " -> ");
        System.out.println("null");
    }
}`,python:`class Node:
    def __init__(self, data):
        self.data = data
        self.next = None

class SinglyLinkedList:
    def __init__(self):
        self.head = None

    def insert_front(self, data):          # O(1)
        node = Node(data)
        node.next = self.head
        self.head = node

    def insert_end(self, data):            # O(n)
        node = Node(data)
        if self.head is None:
            self.head = node
            return
        cur = self.head
        while cur.next:
            cur = cur.next
        cur.next = node

    def insert_after(self, key, data):     # O(n)
        cur = self.head
        while cur and cur.data != key:
            cur = cur.next
        if cur:
            node = Node(data)
            node.next = cur.next
            cur.next = node

    def delete(self, data):                # O(n)
        if self.head is None:
            return
        if self.head.data == data:
            self.head = self.head.next
            return
        cur = self.head
        while cur.next and cur.next.data != data:
            cur = cur.next
        if cur.next:
            cur.next = cur.next.next

    def search(self, data):                # O(n)
        cur, i = self.head, 0
        while cur:
            if cur.data == data:
                return i
            cur, i = cur.next, i + 1
        return -1

    def __str__(self):
        out, cur = [], self.head
        while cur:
            out.append(str(cur.data))
            cur = cur.next
        return " -> ".join(out + ["None"])`},{t:"callout",kind:"warn",title:"The order of the two link updates matters",text:"In insertFront and insertAfter, set **newNode.next first**, then redirect the old link. If you write `current.next = newNode` first, you have lost the only reference to the rest of the list, and `newNode.next = current.next` makes the node point to itself."},{t:"p",text:"Deleting needs the node **before** the target, because that node's next is what must change. That is why delete walks with `current.next.data` rather than `current.data`. In Java the bypassed node is reclaimed automatically by the garbage collector once nothing refers to it."},{t:"h",text:"6. Tracing a sequence of operations"},{t:"table",head:["Operation","List afterwards"],rows:[["insertFront(10)","head \u2192 10 \u2192 null"],["insertFront(20)","head \u2192 20 \u2192 10 \u2192 null"],["insertEnd(30)","head \u2192 20 \u2192 10 \u2192 30 \u2192 null"],["insertAfter(20, 25)","head \u2192 20 \u2192 25 \u2192 10 \u2192 30 \u2192 null"],["delete(10)","head \u2192 20 \u2192 25 \u2192 30 \u2192 null"]]},{t:"h",text:"7. Arrays vs singly linked lists"},{t:"table",head:["Operation","Array","Singly linked list"],rows:[["Access the i-th element","O(1)","O(n): walk from head"],["Search for a value","O(n) (O(log n) if sorted, binary search)","O(n), even if sorted"],["Insert at the front","O(n): shift everything","O(1)"],["Insert at the end","O(1) if there is space (amortised for ArrayList)","O(n) with head only; O(1) with a tail pointer"],["Insert after a known node / position","O(n): shift","O(1) once you have the node"],["Delete the front element","O(n): shift","O(1)"],["Size","Fixed","Grows and shrinks one node at a time"],["Extra memory","None per element","One reference per node"],["Memory layout","Contiguous, cache-friendly","Scattered nodes"]]},{t:"p",text:"Keeping a **tail** reference as well as head makes insertEnd O(1): link `tail.next = newNode; tail = newNode;`. Deleting the last node is still O(n) in a singly linked list, because you need the second-last node and cannot walk backwards. That limitation leads to doubly linked lists in SO6."}],concepts:[{term:"2D array",def:"A table of elements accessed with two indices [row][col]; in Java an array of arrays."},{term:"Row-major order",def:"Storing a 2D array row by row in memory; element (r, c) is at index r \xD7 cols + c."},{term:"Column-major order",def:"Storing column by column (Fortran, MATLAB); element (r, c) is at c \xD7 rows + r."},{term:"Jagged array",def:"A 2D array whose rows have different lengths; possible in Java because each row is its own array."},{term:"Multidimensional array",def:"An array with three or more indices, e.g. int[2][3][4]."},{term:"Transpose",def:"The matrix obtained by swapping rows and columns: t[c][r] = m[r][c]."},{term:"Random access",def:"Reaching any element in O(1) time via its index. Arrays have it, linked lists do not."},{term:"Linked list",def:"A linear collection of nodes where each node refers to the next; not stored contiguously."},{term:"Node",def:"An object holding one data value and one or more references to other nodes."},{term:"head",def:"The reference to the first node of a list; null when the list is empty."},{term:"tail",def:"An optional reference to the last node, making insertion at the end O(1)."},{term:"null",def:'The reference value meaning "no node"; marks the end of a singly linked list.'},{term:"Traversal",def:"Visiting every node in order by following next references from head until null."},{term:"Dynamic size",def:"A linked list grows and shrinks one node at a time, with no fixed capacity."},{term:"Garbage collection",def:"Java automatically frees nodes that are no longer referenced, such as a deleted node."}],mnemonics:[{title:"Rows first, like reading",text:"Row-major stores a table the way you read a page: left to right along a row, then down to the next row. index = r \xD7 cols + c."},{title:"Link before you cut",text:"When inserting, connect the new node to the rest of the list (newNode.next = ...) before you redirect the old link."},{title:"Delete from the node before",text:"To delete a node, stand on the node before it and jump over: prev.next = prev.next.next."},{title:"Array: jump. List: walk.",text:"Arrays jump straight to any index in O(1). Linked lists must walk from head, O(n). But a list inserts at the front in O(1) where an array must shift."},{title:"Treasure hunt",text:"A linked list is a treasure hunt: each clue (node) tells you where the next clue is. You cannot skip to clue 7 without following clues 1 to 6."}],pitfalls:["Mixing up rows and columns: `matrix.length` is the number of rows; `matrix[0].length` is the number of columns.","In Python, creating a grid with `[[0] * 4] * 3`. All three rows are the same list, so changing one changes all of them.","Losing the rest of the list by updating links in the wrong order during insertion.","Forgetting the empty-list case (`head == null`) in insertEnd or delete, which causes a NullPointerException.","Forgetting the special case of deleting the head node, which needs `head = head.next`.","Walking with `while (current != null)` when you need to stop on the last node or the node before the target (use `current.next != null`).","Saying a linked list search is O(log n) when the list is sorted. Without random access, binary search does not help.","Claiming insertion into a linked list is always O(1). It is O(1) only once you already hold the node; finding the position is O(n)."],examples:[{title:"Row-major address calculation",problem:"An int array `int[5][6]` starts at address 2000 (4 bytes per int). Find the flat index and address of element [3][4], and the row and column of flat index 17.",steps:["cols = 6, so index(3, 4) = 3 \xD7 6 + 4 = 22","address = 2000 + 22 \xD7 4 = 2088","Flat index 17: row = 17 \xF7 6 = 2, column = 17 mod 6 = 5","Total size: 5 \xD7 6 \xD7 4 = 120 bytes"],answer:"[3][4] is at index 22, address 2088. Index 17 is [2][5]."},{title:"Trace singly linked list operations",problem:"Starting from an empty list, perform insertEnd(8), insertEnd(3), insertEnd(6), insertFront(1), insertAfter(3, 9), delete(8), insertEnd(2). Show the list after each step.",steps:["insertEnd(8): 8","insertEnd(3): 8 \u2192 3","insertEnd(6): 8 \u2192 3 \u2192 6","insertFront(1): 1 \u2192 8 \u2192 3 \u2192 6","insertAfter(3, 9): 1 \u2192 8 \u2192 3 \u2192 9 \u2192 6","delete(8): 1 \u2192 3 \u2192 9 \u2192 6 (stand on 1, set 1.next = 3)","insertEnd(2): 1 \u2192 3 \u2192 9 \u2192 6 \u2192 2"],answer:"head \u2192 1 \u2192 3 \u2192 9 \u2192 6 \u2192 2 \u2192 null"},{title:"Count the work of building a list",problem:"You build a list of n values by calling insertEnd each time, with only a head reference. How many links are followed in total? What if you use insertFront, or a tail reference?",steps:["The k-th insertEnd walks past the k \u2212 1 nodes already there.","Total = 0 + 1 + 2 + ... + (n \u2212 1) = n(n \u2212 1)/2, which is O(n\xB2). For n = 1000 that is 499 500 steps.","insertFront never walks: n inserts cost O(n) in total (but the list comes out reversed).","With a tail reference, insertEnd is O(1), so n inserts cost O(n) and keep the order."],answer:"O(n\xB2) with head only; O(n) with insertFront or a tail pointer."},{title:"Reverse a singly linked list",problem:"Write an O(n), O(1)-space method that reverses a singly linked list in place, and apply it to 5 \u2192 20 \u2192 40 \u2192 50.",steps:["Keep three references: prev (starts null), current (starts at head) and next.","For each node: save next = current.next, point current.next back to prev, then move prev and current forward.","When current becomes null, prev is the new head."],code:{java:`void reverse() {

        Node next = current.next;   // remember the rest

}`,python:`def reverse(self):

}`,python:`def diagonal_sum(m):
    return sum(m[i][i] for i in range(len(m)))`},{t:"p",text:"O(n) for an n \xD7 n matrix: only n elements are visited. For [[1,2,3],[4,5,6],[7,8,9]] it returns 1 + 5 + 9 = 15."}]},{q:"List three limitations of arrays that linked lists overcome, and one thing arrays do better.",solution:"Fixed size (lists grow dynamically); O(n) insertion and deletion at the front or middle because of shifting (lists relink in O(1) once at the position); need for one contiguous block (nodes can be anywhere). Arrays do better at random access: O(1) by index versus O(n) for a list."},{q:"Write `int size()` and `int sum()` for SinglyLinkedList.",solution:[{t:"code",java:`int size() {

}`,python:`def size(self):

}`,python:`def delete_last(self):

        return
    cur = self.head

    cur = self.head

System.out.println(m[2][1] + " " + m.length + " " + m[0].length);`,options:["70 3 4","100 3 4","100 4 3","60 3 4"],answer:1,explain:"Row 2, column 1 is 100; there are 3 rows and 4 columns."},{type:"complexity",q:"Traversing every element of an r \xD7 c 2D array:",options:["O(r)","O(c)","O(r + c)","O(r \xD7 c)"],answer:3,explain:"Every one of the r \xD7 c elements is visited once."},{type:"complexity",q:"Inserting at the front of an array of n elements (shifting the rest):",options:["O(1)","O(log n)","O(n)","O(n\xB2)"],answer:2,explain:"All n elements move one place right."},{type:"complexity",q:"Inserting at the front of a singly linked list:",options:["O(1)","O(log n)","O(n)","O(n\xB2)"],answer:0,explain:"Two reference updates, independent of the list length."},{type:"complexity",q:"Inserting at the end of a singly linked list that has only a head reference:",options:["O(1)","O(log n)","O(n)","O(n\xB2)"],answer:2,explain:"You must walk to the last node first."},{type:"complexity",q:"Accessing the k-th element of a singly linked list:",options:["O(1)","O(log n)","O(n)","O(n log n)"],answer:2,explain:"No random access: follow k links from head, up to n in the worst case."},{type:"mcq",q:"In insertFront, which order of statements is correct?",options:["head = newNode; newNode.next = head;","newNode.next = head; head = newNode;","head.next = newNode; head = newNode;","newNode = head; head.next = newNode;"],answer:1,explain:"Link the new node to the old first node, then move head. The other order makes the node point to itself."},{type:"mcq",q:"To delete a node from a singly linked list, you need a reference to:",options:["The node after it","The node before it","The tail","Nothing else"],answer:1,explain:"The previous node's next must be changed to bypass the target."},{type:"output",q:"After insertFront(10), insertFront(20), insertEnd(30), insertAfter(20, 25), delete(10), what does display() print?",options:["10 -> 20 -> 25 -> 30 -> null","20 -> 25 -> 30 -> null","20 -> 25 -> 10 -> 30 -> null","25 -> 20 -> 30 -> null"],answer:1,explain:"20 \u2192 10, then 20 \u2192 10 \u2192 30, then 20 \u2192 25 \u2192 10 \u2192 30, then remove 10."},{type:"tf",q:"Binary search on a sorted singly linked list runs in O(log n).",options:["True","False"],answer:1,explain:"Finding the middle node takes O(n) steps, so there is no benefit."},{type:"mcq",q:"What marks the end of a singly linked list?",options:["The head reference","A node whose next is null","A node whose data is 0","The tail's next points to head"],answer:1,explain:"In a linear list the last node's next is null. (In a circular list it points back to the first node.)"},{type:"mcq",q:"Which is a genuine limitation of arrays compared with linked lists?",options:["Slow access by index","Fixed size set at creation","More memory per element for references","Cannot store integers"],answer:1,explain:"Arrays have O(1) index access and no per-element reference overhead, but their size is fixed."}]},gx={id:"SO6",ready:!0,title:"Doubly and circular linked lists",summary:"Why singly linked lists fall short, how prev pointers (doubly linked) and wrap-around (circular) fix it, sentinel nodes, and a full comparison of operation costs.",why:"Your browser's back and forward buttons, a text editor's undo and redo, and Java's own `LinkedList` class are doubly linked lists. Round-robin CPU scheduling, music on repeat and multiplayer turn order are circular lists. Knowing which variant gives O(1) for which operation is a standard test question.",visualizers:["linkedlist"],notes:[{t:"h",text:"1. What a singly linked list cannot do well"},{t:"list",items:["It can only be traversed in **one direction**, forwards from head.","To delete a node you need the node **before** it, which means walking from head: O(n).","Deleting the last node is O(n) even with a tail pointer, because you cannot step back to the second-last node.","Inserting **before** a given node also needs the previous node."]},{t:"h",text:"2. Doubly linked lists"},{t:"p",text:"Each node gets a second reference, **prev**, pointing to the previous node. The list keeps both **head** and **tail**. head.prev is null and tail.next is null."},{t:"diagram",id:"dll",caption:"A doubly linked list null \u2190 10 \u21C4 20 \u21C4 30 \u2192 null, with head and tail references."},{t:"code",title:"DNode and DoublyLinkedList",java:`class DNode {
    int data;
    DNode prev, next;
    DNode(int data) { this.data = data; }
}

class DoublyLinkedList {
    DNode head, tail;

    // Insert at front: O(1)
    void insertFront(int data) {
        DNode n = new DNode(data);
        if (head == null) { head = tail = n; return; }
        n.next = head;
        head.prev = n;
        head = n;
    }

    // Insert at end: O(1) thanks to tail
    void insertEnd(int data) {
        DNode n = new DNode(data);
        if (tail == null) { head = tail = n; return; }
        tail.next = n;
        n.prev = tail;
        tail = n;
    }

    // Insert after a given node: O(1), four links
    void insertAfter(DNode node, int data) {
        DNode n = new DNode(data);
        n.prev = node;
        n.next = node.next;
        if (node.next != null) node.next.prev = n;
        else tail = n;                       // inserted after the old tail
        node.next = n;
    }

    // Delete a given node: O(1), no search for the previous node
    void deleteNode(DNode node) {
        if (node.prev != null) node.prev.next = node.next;
        else head = node.next;               // deleting the head
        if (node.next != null) node.next.prev = node.prev;
        else tail = node.prev;               // deleting the tail
    }

    void printForward()  { for (DNode c = head; c != null; c = c.next) System.out.print(c.data + " "); }
    void printBackward() { for (DNode c = tail; c != null; c = c.prev) System.out.print(c.data + " "); }
}`,python:`class DNode:
    def __init__(self, data):
        self.data = data
        self.prev = None
        self.next = None

class DoublyLinkedList:
    def __init__(self):
        self.head = self.tail = None

    def insert_front(self, data):
        n = DNode(data)
        if self.head is None:
            self.head = self.tail = n
            return
        n.next = self.head
        self.head.prev = n
        self.head = n

    def insert_end(self, data):
        n = DNode(data)
        if self.tail is None:
            self.head = self.tail = n
            return
        self.tail.next = n
        n.prev = self.tail
        self.tail = n

    def insert_after(self, node, data):
        n = DNode(data)
        n.prev, n.next = node, node.next
        if node.next:
            node.next.prev = n
        else:
            self.tail = n
        node.next = n

    def delete_node(self, node):
        if node.prev:
            node.prev.next = node.next
        else:
            self.head = node.next
        if node.next:
            node.next.prev = node.prev
        else:
            self.tail = node.prev`},{t:"p",text:"deleteNode is the key win: given a reference to a node, it is unlinked in **O(1)** by making its neighbours point to each other. The two `else` branches handle deleting the head and deleting the tail."},{t:"table",head:["Operation","List afterwards (forward)","Backward"],rows:[["insertEnd 10, 20, 30","10 \u21C4 20 \u21C4 30","30 20 10"],["insertFront(5)","5 \u21C4 10 \u21C4 20 \u21C4 30","30 20 10 5"],["deleteNode(node 20)","5 \u21C4 10 \u21C4 30","30 10 5"],["insertAfter(node 10, 15)","5 \u21C4 10 \u21C4 15 \u21C4 30","30 15 10 5"],["deleteNode(tail 30)","5 \u21C4 10 \u21C4 15 (tail = 15)","15 10 5"]]},{t:"table",head:["Advantage","Disadvantage"],rows:[["Traverse in both directions","An extra reference per node (more memory)"],["Delete a given node in O(1)","Every insert and delete updates up to four links, so more code and more chances for bugs"],["Insert before a node in O(1)","Still O(n) to find a node by value or index"],["O(1) insert and delete at both ends with head and tail",""]]},{t:"callout",kind:"tip",title:"Java's LinkedList is doubly linked",text:"`java.util.LinkedList` is a doubly linked list with head and tail, which is why `addFirst`, `addLast`, `removeFirst` and `removeLast` are all O(1), while `get(i)` is O(n) (it walks from whichever end is closer). Python has no built-in linked list class; `collections.deque` gives O(1) operations at both ends."},{t:"h",text:"3. Circular linked lists"},{t:"p",text:"In a **circular** list the last node's next points back to the first node instead of null. There is no end: from any node you can reach every other node. It is common to keep only a **tail** reference, because the head is then simply `tail.next`, giving O(1) access to both ends."},{t:"diagram",id:"cll",caption:"A circular singly linked list 10 \u2192 20 \u2192 30 \u2192 back to 10. The tail reference gives O(1) access to the last node and, through tail.next, the first."},{t:"code",title:"Circular singly linked list with a tail reference",java:`class CircularLinkedList {
    Node tail;                                 // tail.next is the head

    // Insert at front: O(1)
    void insertFront(int data) {
        Node n = new Node(data);
        if (tail == null) { n.next = n; tail = n; return; }   // single node points to itself
        n.next = tail.next;                    // new node points at the old head
        tail.next = n;                         // tail points at the new head
    }

    // Insert at end: O(1). Insert at front, then move tail onto the new node
    void insertEnd(int data) {
        insertFront(data);
        tail = tail.next;
    }

    // Delete the front node: O(1)
    void deleteFront() {
        if (tail == null) return;
        Node head = tail.next;
        if (head == tail) tail = null;         // it was the only node
        else tail.next = head.next;
    }

    // Traverse once around: stop when we come back to the start
    void display() {
        if (tail == null) return;
        Node c = tail.next;
        do {
            System.out.print(c.data + " ");
            c = c.next;
        } while (c != tail.next);
    }
}`,python:`class CircularLinkedList:
    def __init__(self):
        self.tail = None                   # tail.next is the head

    def insert_front(self, data):
        n = Node(data)
        if self.tail is None:
            n.next = n
            self.tail = n
            return
        n.next = self.tail.next
        self.tail.next = n

    def insert_end(self, data):
        self.insert_front(data)
        self.tail = self.tail.next

    def delete_front(self):
        if self.tail is None:
            return
        head = self.tail.next
        if head is self.tail:
            self.tail = None
        else:
            self.tail.next = head.next

    def display(self):
        if self.tail is None:
            return
        c = self.tail.next
        while True:
            print(c.data, end=" ")
            c = c.next
            if c is self.tail.next:
                break`},{t:"callout",kind:"warn",title:"The infinite-loop trap",text:"There is no null in a circular list, so `while (c != null)` never stops. Traverse with a **do-while** that stops when you return to the starting node, or count n steps. The do-while form also correctly prints a list with a single node that points to itself."},{t:"p",text:"Circular lists suit anything that cycles: **round-robin scheduling** (each process gets a time slice, then moves to the back), turn order in a game, a music playlist on repeat, and the **Josephus problem** (people in a circle, every k-th one is eliminated). A **circular doubly linked list** links tail.next to head and head.prev to tail, so it can cycle in both directions."},{t:"h",text:"4. Sentinel (dummy) nodes"},{t:"p",text:'Most bugs in linked list code come from the special cases: empty list, deleting the head, deleting the tail. A **sentinel** is a dummy node that holds no real data and is never removed. With a sentinel at the front (a **header node**), every real node has a previous node, so "insert at front" and "insert after a node" become the same code.'},{t:"p",text:"The neatest form is a **circular doubly linked list with one sentinel**: the sentinel's next is the first real node and its prev is the last. An empty list is a sentinel pointing to itself. Insert and delete then never test for null."},{t:"code",title:"Doubly linked list with a sentinel: no special cases",java:`class SentinelList {
    final DNode sentinel = new DNode(0);
    SentinelList() { sentinel.next = sentinel; sentinel.prev = sentinel; }   // empty list

    void insertAfter(DNode node, int data) {     // works for front, middle and end
        DNode n = new DNode(data);
        n.prev = node;
        n.next = node.next;
        node.next.prev = n;
        node.next = n;
    }
    void insertFront(int data) { insertAfter(sentinel, data); }
    void insertEnd(int data)   { insertAfter(sentinel.prev, data); }

    void delete(DNode node) {                    // never null checks
        node.prev.next = node.next;
        node.next.prev = node.prev;
    }
    boolean isEmpty() { return sentinel.next == sentinel; }
}`,python:`class SentinelList:
    def __init__(self):
        self.s = DNode(None)
        self.s.next = self.s.prev = self.s

    def insert_after(self, node, data):
        n = DNode(data)
        n.prev, n.next = node, node.next
        node.next.prev = n
        node.next = n

    def insert_front(self, data):
        self.insert_after(self.s, data)

    def insert_end(self, data):
        self.insert_after(self.s.prev, data)

    def delete(self, node):
        node.prev.next = node.next
        node.next.prev = node.prev

    def is_empty(self):
        return self.s.next is self.s`},{t:"h",text:"5. Complexity comparison"},{t:"table",head:["Operation","Singly (head only)","Singly (head + tail)","Doubly (head + tail)","Circular singly (tail only)"],rows:[["Insert at front","O(1)","O(1)","O(1)","O(1)"],["Insert at end","O(n)","O(1)","O(1)","O(1)"],["Delete front","O(1)","O(1)","O(1)","O(1)"],["Delete end","O(n)","O(n)","O(1)","O(n)"],["Delete a given node (have its reference)","O(n)","O(n)","O(1)","O(n)"],["Insert after a given node","O(1)","O(1)","O(1)","O(1)"],["Search / access by index","O(n)","O(n)","O(n)","O(n)"],["Traverse backwards","Not possible (O(n\xB2) by restarting)","Not possible","O(n)","Not possible"],["References per node","1","1","2","1"]]},{t:"p",text:`"Delete a given node" in a singly linked list is O(n) because you must find the previous node first. (There is a trick that copies the next node's data into this node and deletes the next node instead, but it fails for the last node.)`}],concepts:[{term:"Doubly linked list",def:"A linked list whose nodes have both next and prev references, allowing traversal in both directions."},{term:"prev reference",def:"The link from a node to the node before it; null for the head in a linear doubly linked list."},{term:"tail",def:"A reference to the last node; makes insertion at the end O(1)."},{term:"Circular linked list",def:"A linked list in which the last node points back to the first instead of to null."},{term:"Circular doubly linked list",def:"Both directions wrap around: tail.next is head and head.prev is tail."},{term:"Sentinel (dummy) node",def:"A placeholder node with no real data that is never removed, so insert and delete have no special cases for empty lists or ends."},{term:"Header node",def:"A sentinel placed before the first real node."},{term:"Unlinking",def:"Removing a node by pointing its neighbours at each other: prev.next = next and next.prev = prev."},{term:"Round-robin scheduling",def:"Giving each process a time slice in turn, cycling through a circular list."},{term:"Josephus problem",def:"n people in a circle; every k-th is removed until one remains. A classic circular list exercise."},{term:"do-while traversal",def:"The safe way to visit every node of a circular list once: stop when you are back at the start."},{term:"java.util.LinkedList",def:"Java's built-in doubly linked list with head and tail; O(1) at both ends, O(n) for get(i)."}],mnemonics:[{title:"Doubly = two-way street",text:"A singly linked list is a one-way street; a doubly linked list lets you drive both ways, at the cost of painting a second lane (the prev reference)."},{title:"Four links for doubly",text:"Inserting into the middle of a doubly linked list touches four references: n.prev, n.next, the neighbour's prev and the other neighbour's next."},{title:"Tail of a circle knows the head",text:"In a circular list keep only tail: head is always tail.next, so both ends are one step away."},{title:"Back where you started",text:"Circular traversal stops when you are back at the start, never when you hit null. Use do-while."},{title:"Sentinels stand guard",text:'A sentinel node guards both ends so the code never has to ask "is this the head, the tail, or an empty list?"'}],pitfalls:["Updating only next (or only prev) in a doubly linked list, leaving the backward chain broken. Every insert and delete must fix both directions.","Forgetting to update head or tail when deleting the first or last node of a doubly linked list.","Using `while (current != null)` on a circular list: it loops forever.","Forgetting that a single node in a circular list points to itself; deleting it must set the list reference to null.","Inserting into a circular list without updating the last node's next, which breaks the circle.","Claiming deletion from a doubly linked list is O(1) when only the value is given. Finding the node by value is still O(n); only unlinking is O(1).","Saying a circular list makes delete-end O(1). With singly links you still need the second-last node: O(n).","Counting the sentinel as a data element when computing the size."],examples:[{title:"Trace a doubly linked list",problem:"Starting empty: insertEnd(3), insertEnd(6), insertEnd(9), insertEnd(12), insertFront(1), deleteNode(the node holding 9), insertEnd(15). Give the forward and backward traversal.",steps:["After the four insertEnds: 3 \u21C4 6 \u21C4 9 \u21C4 12","insertFront(1): 1 \u21C4 3 \u21C4 6 \u21C4 9 \u21C4 12","deleteNode(9): 6.next = 12 and 12.prev = 6, giving 1 \u21C4 3 \u21C4 6 \u21C4 12","insertEnd(15): tail.next = 15, 15.prev = 12, tail = 15"],answer:"Forward: 1 3 6 12 15. Backward: 15 12 6 3 1."},{title:"Write deleteNode and explain each line",problem:"Write deleteNode(DNode node) for a doubly linked list with head and tail, and explain how it handles the head and the tail.",steps:["If node has a predecessor, make it skip node: node.prev.next = node.next. Otherwise node was the head, so head = node.next.","If node has a successor, make it point back past node: node.next.prev = node.prev. Otherwise node was the tail, so tail = node.prev.","No loop anywhere, so the cost does not depend on n."],answer:"O(1). The two if/else pairs cover the middle, head, tail and single-node cases (a single node sets both head and tail to null)."},{title:"Circular list with a tail pointer",problem:"Starting empty, insertEnd(10), insertEnd(20), insertEnd(30), insertFront(5), insertEnd(40), deleteFront(). Give the list, the head and the tail after each step. What does a 7-step walk from the head print after the first three inserts?",steps:["insertEnd 10, 20, 30: 10 \u2192 20 \u2192 30 \u2192 (10). tail = 30, head = tail.next = 10.","A 7-step walk from head prints 10 20 30 10 20 30 10: it simply keeps going around.","insertFront(5): 5.next = old head 10, tail.next = 5. List 5 \u2192 10 \u2192 20 \u2192 30, tail still 30.","insertEnd(40): insert at front then tail = tail.next = 40. List 5 \u2192 10 \u2192 20 \u2192 30 \u2192 40, head 5, tail 40.","deleteFront(): tail.next = 5.next = 10. List 10 \u2192 20 \u2192 30 \u2192 40."],answer:"Final list 10 \u2192 20 \u2192 30 \u2192 40 \u2192 (back to 10), head 10, tail 40. Every operation was O(1)."},{title:"Josephus with a circular list",problem:"Five people numbered 1 to 5 stand in a circle. Starting at person 1, every second person is eliminated. Who survives?",steps:["Circle: 1 2 3 4 5. Count 1, 2: eliminate 2.","Continue from 3: count 3, 4: eliminate 4.","Continue from 5: count 5, 1: eliminate 1.","Continue from 3: count 3, 5: eliminate 5.","Only 3 remains."],answer:'Person 3 survives; elimination order 2, 4, 1, 5. A circular list makes "move on k steps and unlink" natural, because there is no end to fall off.'},{title:"Pick the right list",problem:"Choose a list type for: (a) browser back and forward history; (b) a CPU scheduler giving each process a time slice in turn; (c) a stack of undo actions where you only add and remove at one end.",steps:["(a) Must move both backwards and forwards from the current page: doubly linked list.","(b) After the last process comes the first again: circular linked list.","(c) Only one end is used: a singly linked list with insertFront and deleteFront, both O(1)."],answer:"(a) Doubly  (b) Circular  (c) Singly"}],exercises:[{q:"Explain two limitations of a singly linked list and how a doubly linked list overcomes them.",solution:"One direction only: a DLL can traverse backwards using prev. Deleting a node needs the previous node, found by an O(n) walk: in a DLL node.prev is available, so unlinking is O(1). Also, deleting the tail is O(1) in a DLL via tail.prev."},{q:"Write `void insertBefore(DNode node, int data)` for a doubly linked list.",solution:[{t:"code",java:`void insertBefore(DNode node, int data) {
    DNode n = new DNode(data);
    n.next = node;
    n.prev = node.prev;
    if (node.prev != null) node.prev.next = n;
    else head = n;                       // inserting before the head
    node.prev = n;
}`,python:`def insert_before(self, node, data):
    n = DNode(data)
    n.next, n.prev = node, node.prev
    if node.prev:
        node.prev.next = n
    else:
        self.head = n

    if (tail == null) return 0;

}`,python:`def size(self):
    if self.tail is None:
        return 0
    count, c = 0, self.tail.next
    while True:
        count += 1
        c = c.next
        if c is self.tail.next:
            return count`}]},{q:"Seven people in a circle, every third person eliminated, starting the count at person 1. Who survives?",solution:"Elimination order 3, 6, 2, 7, 5, 1. Person 4 survives."},{q:"Three processes A (needs 3 time slices), B (1) and C (2) are scheduled round-robin with a circular list, one slice per turn. Give the order in which they run.",solution:"A, B, C, A, C, A. B leaves after its first turn, C after its second, A after its third."},{q:"Complete the table: Delete the last node in (a) a singly list with head and tail, (b) a doubly list with head and tail, (c) a circular singly list with tail. Explain each.",solution:"(a) O(n): you must walk to the second-last node to set its next to null. (b) O(1): tail = tail.prev; tail.next = null. (c) O(n): you need the node before tail, and that requires walking around the circle from tail.next."},{q:"What is the advantage of a sentinel node? Write isEmpty() for a circular doubly linked list with a sentinel.",solution:"It removes special cases: every real node always has a non-null prev and next, so insert and delete are the same code at the front, middle and end, and there is no null check. isEmpty() { return sentinel.next == sentinel; }"},{q:"Convert a singly linked list into a circular one, and write how you would detect whether a list is circular.",solution:"Walk to the last node and set last.next = head. To detect a cycle, use two references: slow moves one step and fast moves two. If fast reaches null the list is linear; if fast ever equals slow, the list is circular (Floyd's algorithm, O(n) time, O(1) space)."}],quiz:[{type:"mcq",q:"How many references does each node of a doubly linked list hold?",options:["0","1","2","3"],answer:2,explain:"prev and next (plus the data, which is not a reference to another node)."},{type:"complexity",q:"Deleting a node from a doubly linked list when you already hold a reference to it:",options:["O(1)","O(log n)","O(n)","O(n\xB2)"],answer:0,explain:"Its neighbours are node.prev and node.next, so no search is needed."},{type:"complexity",q:"Deleting the last node of a singly linked list that has head and tail references:",options:["O(1)","O(log n)","O(n)","O(n\xB2)"],answer:2,explain:"You must find the second-last node, which means walking from head."},{type:"complexity",q:"Deleting the last node of a doubly linked list with head and tail:",options:["O(1)","O(log n)","O(n)","O(n\xB2)"],answer:0,explain:"tail = tail.prev; tail.next = null."},{type:"mcq",q:"In a circular singly linked list that stores only a tail reference, how do you reach the first node?",options:["tail.prev","tail.next","head.next","You must traverse the whole list"],answer:1,explain:"The last node links back to the first, so head = tail.next."},{type:"tf",q:"Traversing a circular list with `while (current != null)` will stop after visiting every node once.",options:["True","False"],answer:1,explain:"No node has a null next, so the loop never ends. Stop when you return to the start."},{type:"output",q:"A doubly linked list is built with insertEnd(10), insertEnd(20), insertEnd(30), insertFront(5), then the node holding 20 is deleted. What does printBackward() print?",options:["5 10 30","30 10 5","30 20 10 5","10 30 5"],answer:1,explain:"Forward it is 5 10 30, so backward from tail it is 30 10 5."},{type:"output",q:"A circular list holds 10 \u2192 20 \u2192 30 \u2192 (back to 10). Starting at 10, what do 7 steps of `print(c.data); c = c.next;` print?",options:["10 20 30","10 20 30 10 20 30 10","10 20 30 null","An exception"],answer:1,explain:"There is no end, so the walk just keeps cycling."},{type:"mcq",q:"What is the main purpose of a sentinel node?",options:["To store the list size","To make the list faster to search","To remove special cases for empty lists and the ends","To sort the list"],answer:2,explain:"Every real node always has neighbours, so insert and delete never need null checks."},{type:"mcq",q:"Which application suits a circular linked list best?",options:["Browser back/forward history","Round-robin CPU scheduling","Binary search","Storing a 2D image"],answer:1,explain:"After the last process, scheduling starts again at the first."},{type:"mcq",q:"Which application suits a doubly linked list best?",options:["Browser back/forward history","Counting to 10","A fixed table of 12 months","Matrix multiplication"],answer:0,explain:"You must move both backwards and forwards from the current page."},{type:"mcq",q:"A disadvantage of a doubly linked list compared with a singly linked list is:",options:["It cannot be traversed forwards","It uses more memory per node and needs more link updates","Insert at front becomes O(n)","It cannot store duplicates"],answer:1,explain:"Every node carries an extra prev reference, and each insert or delete must keep both chains consistent."},{type:"tf",q:"java.util.LinkedList is implemented as a doubly linked list.",options:["True","False"],answer:0,explain:"That is why addFirst, addLast, removeFirst and removeLast are all O(1)."},{type:"mcq",q:"Five people in a circle, every second person is eliminated starting from person 1. Who survives?",options:["1","3","4","5"],answer:1,explain:"Eliminated in order 2, 4, 1, 5, leaving 3."}]},yx={id:"SO7",ready:!0,title:"Term 1 exercises",summary:"Exam-style practice across every Term 1 topic, built around the format of the April 2025 Test 1: Big-O excerpts, recursion with stack frames, searching, bubble sort traces and linked lists.",why:"The T1 test rewards fluent, well-set-out answers under time pressure. The April 2025 paper was 75 marks: 9 for Big-O excerpts, 15 for recursion, and the rest for sorting traces and their complexity. These exercises follow that pattern so you can practise writing answers the way the memo awards marks.",visualizers:["sorting","complexity"],notes:[{t:"h",text:"How the T1 paper awards marks"},{t:"table",head:["Question type","Typical marks","What earns the marks"],rows:[["Big-O of a code excerpt","3 each","Iterations of each loop (1), how they combine: add or multiply (1), final simplified answer (1)"],["Implement recursive / iterative method","5 each","Correct base case, correct recursive step or loop, correct return, compiles"],["Explain recursion with stack frames","9\u201310","Frames pushed in order, base case, frames popped with return values, time and space with reasons"],["Compare recursion and iteration","5\u20136","Time and space of BOTH versions, plus a justified conclusion"],["Trace a sort","12","Each pass shown, comparisons and swaps clear, sorted region marked, correct stopping point"],["Big-O of a sort","5","Count of comparisons, simplification, best / average / worst, space"],["Linked list code or trace","4\u201310","Correct link order, special cases (empty list, head), complexity"]]},{t:"h",text:"Answer technique"},{t:"ol",items:['**Show the count before the Big-O.** "Outer loop n/3 times, inner n \u2212 1 times, nested so multiply: n\xB2/3 \u2192 O(n\xB2)." A bare "O(n\xB2)" may earn only 1 of 3.','**Always give space as well as time** when the question says "performance" or "complexity", and say what uses the memory (stack frames, an extra array, or only a few variables).',"**For traces, use a table.** One row per comparison (or per pass for long arrays), with the array after each swap. Mark the sorted part.",'**State conventions.** "I use fib(0) = 0, fib(1) = 1." "Pivot = middle element." Markers accept either convention if you are consistent.',"**Write Java that compiles.** Method signature, types, braces and return statements. Recursion questions lose marks for a missing base case more than anything else.","**Budget time.** 75 marks in 60 minutes is about 48 seconds per mark. A 3-mark Big-O question deserves about 2 to 3 minutes, not 10."]},{t:"callout",kind:"tip",title:"Check your traces with arithmetic",text:"Bubble sort swaps = number of inversions. Shrinking bubble sort comparisons = n(n \u2212 1)/2 unless the flag stops it early. Binary search on n items takes at most \u230Alog\u2082 n\u230B + 1 comparisons. Recursive factorial(n) has n frames at its deepest (base case n \u2264 1). If your trace disagrees with these, look for the slip."}],concepts:[],mnemonics:[{title:"Count, Combine, Cancel",text:"For any Big-O excerpt: Count each loop's iterations, Combine them (add if sequential, multiply if nested), Cancel constants and lower-order terms."},{title:"Push down, pop up",text:"For stack-frame questions: push frames on the way down to the base case, pop them with return values on the way up. Draw both phases."}],pitfalls:["Giving only the final Big-O without showing iteration counts, which costs method marks.","Forgetting to report space complexity in recursion questions.","Stopping a bubble sort trace as soon as the array looks sorted, without showing the final pass that confirms it.","Mixing comparisons and swaps when asked to count one of them.","Writing linked list code that fails on an empty list."],examples:[{title:"April 2025, Q1: three Big-O excerpts [9]",problem:"Determine the Big-O expression for each excerpt: (1) two sequential loops over n; (2) outer i++ to n, inner j = j * 3 to n; (3) outer i += 3 to n \u2212 1, inner j-- from n \u2212 1 to 1.",steps:["(1) Loop A runs n times [1]. Loop B runs n times, after A [1]. O(n) + O(n) = O(2n) = O(n) [1].","(2) Outer loop n \u2212 1 times = O(n) [1]. Inner j = 1, 3, 9, ... runs log\u2083 n times = O(log n) [1]. Nested: O(n log n) [1].","(3) Outer i = 0, 3, 6, ... runs about n/3 times = O(n) [1]. Inner runs n \u2212 1 times = O(n) [1]. Nested: n\xB2/3 \u2192 O(n\xB2) [1]."],answer:"O(n), O(n log n), O(n\xB2)."},{title:"April 2025, Q2.1: factorial with stack frames [9]",problem:"Demonstrate, using the concept of a stack frame, how the recursive factorial method executes for factorial(5). Report its time and space complexity in Big-O notation.",steps:["Code: if (n == 0 || n == 1) return 1; return n * factorial(n \u2212 1); [1]","Winding: push f(5) {n=5, waits on 5 \xD7 f(4)}, push f(4), push f(3), push f(2), push f(1) [2]","Base case: f(1) returns 1; 5 frames are on the stack at this moment [1]","Unwinding: f(2) = 2 \xD7 1 = 2, f(3) = 3 \xD7 2 = 6, f(4) = 4 \xD7 6 = 24, f(5) = 5 \xD7 24 = 120, popping each frame as it returns [2]","Time O(n): n calls, one multiplication each [1.5]","Space O(n): n frames held on the call stack simultaneously at the deepest point [1.5]"],answer:"120. Time O(n), space O(n)."},{title:"April 2025, Q2.2: compare recursive and iterative factorial [6]",problem:"Report on the space and time complexity of recursive and iterative factorial, and say which is preferable.",steps:["Recursive time O(n): n calls each doing one multiplication [1].","Recursive space O(n): one stack frame per call, n alive at once [1].","Iterative time O(n): the loop runs n times [1].","Iterative space O(1): only prod and i, regardless of n [1].","Conclusion: same time class, but iterative uses constant memory, avoids call overhead and cannot overflow the stack, so it is preferable [2]."],answer:"Recursive O(n)/O(n); iterative O(n)/O(1); iterative preferred."},{title:"April 2025, Q3.1\u20133.2: bubble sort trace and Big-O [12 + 5]",problem:"Show how bubble sort modifies {90, 23, 5, 109, 12}, then show and explain its Big-O.",steps:["Pass 1: {23, 90, 5, 109, 12} \u2192 {23, 5, 90, 109, 12} \u2192 no swap \u2192 {23, 5, 90, 12, 109}","Pass 2: {5, 23, 90, 12, 109} \u2192 no swap \u2192 {5, 23, 12, 90, 109}","Pass 3: no swap \u2192 {5, 12, 23, 90, 109}","Pass 4: 5 vs 12, no swap: no swaps in the pass, stop.","Big-O: (n \u2212 1) passes \xD7 (n \u2212 1) comparisons = n\xB2 \u2212 2n + 1 \u2192 O(n\xB2). Space O(1). Best case O(n) with a swapped flag on sorted input."],answer:"{5, 12, 23, 90, 109}; 6 swaps. O(n\xB2) time (average and worst), O(1) space."},{title:"Binary search trace [5]",problem:"Trace binary search for 50 in [2, 5, 8, 12, 16, 23, 38, 56, 72, 91] and state the number of comparisons.",steps:["low 0, high 9, mid 4: 16 < 50, low = 5","low 5, high 9, mid 7: 56 > 50, high = 6","low 5, high 6, mid 5: 23 < 50, low = 6","low 6, high 6, mid 6: 38 < 50, low = 7","low 7 > high 6: stop, return \u22121"],answer:"Not found (\u22121) after 4 comparisons, the maximum for 10 elements."},{title:"Linked list code [6]",problem:"Write insertEnd for a singly linked list with only a head reference. State its complexity and explain how adding a tail reference changes it.",steps:["Create the node.","Empty list: head = newNode.","Otherwise walk current from head while current.next != null, then current.next = newNode.","The walk visits every node: O(n).","With a tail reference: tail.next = newNode; tail = newNode; which is O(1)."],code:{java:`void insertEnd(int data) {

}`,python:`def sum_to(n):
    return 0 if n == 0 else n + sum_to(n - 1)`},{t:"p",text:"Push sumTo(4), sumTo(3), sumTo(2), sumTo(1), sumTo(0). sumTo(0) returns 0; then 1 + 0 = 1, 2 + 1 = 3, 3 + 3 = 6, 4 + 6 = 10. Five frames at the deepest point. Time O(n), space O(n)."}]},{q:"How many calls does this make for q(4), and what is its time complexity? `int q(int n) { if (n <= 1) return 1; return q(n - 1) + q(n - 1); }`",solution:"q(4) calls q(3) twice, each calls q(2) twice, and so on: 1 + 2 + 4 + 8 = 15 calls, returning 8. Each level doubles the calls: O(2\u207F) time, O(n) space (depth)."},{q:"Trace bubble sort (flagged, shrinking) on {34, 12, 67, 5, 22}. Give the array after each pass, the number of comparisons and the number of swaps.",solution:"Pass 1: {12, 34, 5, 22, 67}. Pass 2: {12, 5, 22, 34, 67}. Pass 3: {5, 12, 22, 34, 67}. Pass 4: 5 vs 12 no swap, stop. Comparisons 4 + 3 + 2 + 1 = 10, swaps 6."},{q:"Trace bubble sort on {8, 4, 6, 2} and count comparisons and swaps.",solution:"Pass 1: {4, 6, 2, 8} (3 swaps). Pass 2: {4, 2, 6, 8} (1 swap). Pass 3: {2, 4, 6, 8} (1 swap). Comparisons 3 + 2 + 1 = 6, swaps 5. The loop ends after n \u2212 1 = 3 passes."},{q:"Trace binary search for 72 in [2, 5, 8, 12, 16, 23, 38, 56, 72, 91].",solution:"mid 4 (16 < 72, low = 5); mid 7 (56 < 72, low = 8); mid 8 (72, found). Index 8 after 3 comparisons."},{q:"After insertEnd(15), insertEnd(7), insertEnd(22), insertFront(4), insertAfter(7, 11), delete(15), what does the singly linked list contain?",solution:"15 \u2192 7 \u2192 22, then 4 \u2192 15 \u2192 7 \u2192 22, then 4 \u2192 15 \u2192 7 \u2192 11 \u2192 22, then 4 \u2192 7 \u2192 11 \u2192 22."},{q:"Compare deleting a node (given a reference to it) from a singly and a doubly linked list.",solution:"Singly: you need the previous node, found by walking from head: O(n). Doubly: node.prev.next = node.next and node.next.prev = node.prev (with head/tail checks): O(1)."},{q:"Use Euclid's algorithm to compute hcf(270, 192), showing each step.",solution:"270 mod
