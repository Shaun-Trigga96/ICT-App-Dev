 36, 78 mod 36 = 6, 36 mod 6 = 0."}]},Em={id:"T1",n:1,title:"Foundations: complexity, recursion, searching and lists",short:"Foundations",assessment:"T1 Written Test",weight:10,color:"t1",outcomes:[cx,fx,px,hx,mx,gx,yx],cheatSheet:[{title:"Algorithms",rows:[["Definition","A finite and definite procedure for solving a problem"],["Five properties","Input, Output, Definiteness, Finiteness, Effectiveness"],["Euclid HCF","repeat l = n mod m; n = m; m = l until m = 0; answer n"],["hcf(1071, 462)","= 21 in 3 iterations (brute force: 442)"],["Measure quality by","Time (steps) and space (extra memory)"]]},{title:"Big-O rules",rows:[["O / \u03A9 / \u0398","Upper bound / lower bound / tight bound"],["Constants","Drop: O(3n) = O(n), O(n\xB2/3) = O(n\xB2)"],["Lower terms","Drop: n\xB2 + 5n + 7 = O(n\xB2)"],["Sequential","Add: O(n) + O(n) = O(n)"],["Nested","Multiply: O(n) \xD7 O(n) = O(n\xB2)"],["j *= k or i /= k","O(log n) iterations"],["i += 3","Still O(n)"],["Order","1 < log n < n < n log n < n\xB2 < n\xB3 < 2\u207F"]]},{title:"Lecturer's excerpts",rows:[["Two loops one after another","O(n)"],["Outer i++, inner j = j * 3","O(n log n)"],["Outer i += 3, inner j--","O(n\xB2)"],["Matrix multiplication","O(n\xB3)"],["Linear search","Best O(1), average n/2 \u2192 O(n), worst O(n)"]]},{title:"Recursion",rows:[["Parts","Base case + recursive case"],["Stack frame","Parameters, locals, return address; push on call, pop on return"],["Factorial","Recursive O(n) time, O(n) space; iterative O(n), O(1)"],["Naive Fibonacci","O(2\u207F) time, O(n) space; fib(5) makes 15 calls"],["Fibonacci fixes","Iterative O(n)/O(1); memoised O(n)/O(n)"],["Too deep / no base case","StackOverflowError (Python: RecursionError)"],["int overflow","13! and the 47th Fibonacci number exceed int"],["Tail call","Last action is the call; Java does not optimise it"]]},{title:"Searching",rows:[["Linear","Any data; O(n) worst, O(1) best; O(1) space"],["Binary","Sorted array only; O(log n); iterative O(1) space, recursive O(log n)"],["Stop condition","Found, or low > high"],["Max comparisons","\u230Alog\u2082 n\u230B + 1: 10 for 1000, 20 for 1 000 000"],["Safe midpoint","mid = low + (high \u2212 low) / 2"]]},{title:"Bubble sort",rows:[["Mechanism","Swap adjacent pairs if left > right; largest bubbles to the end each pass"],["{90, 23, 5, 109, 12}","P1 {23,5,90,12,109} P2 {5,23,12,90,109} P3 {5,12,23,90,109}; 6 swaps"],["Naive comparisons","(n \u2212 1)(n \u2212 1) = n\xB2 \u2212 2n + 1; 1000 items \u2248 1 000 000"],["Shrinking loop","n(n \u2212 1)/2 comparisons"],["Cases (with flag)","Best O(n) sorted; average and worst O(n\xB2)"],["Without flag","O(n\xB2) always"],["Properties","In place O(1), stable (uses >), adaptive with flag"],["Swaps","= number of inversions"]]},{title:"2D arrays",rows:[["Access","m[row][col]; m.length rows, m[0].length columns"],["Row-major index","r \xD7 cols + c"],["Address","base + (r \xD7 cols + c) \xD7 size"],["Traverse","O(rows \xD7 cols)"],["Limits of arrays","Fixed size, O(n) insert/delete (shifting); O(1) random access"]]},{title:"Linked lists",rows:[["SLL insert front","O(1): newNode.next = head; head = newNode"],["SLL insert end","O(n) head only; O(1) with tail"],["SLL delete","O(n): stand on the node before, prev.next = prev.next.next"],["DLL","prev + next; delete given node O(1); delete tail O(1)"],["Circular","Last node \u2192 first; keep tail, head = tail.next; traverse with do-while"],["Sentinel","Dummy node removes empty / head / tail special cases"],["All lists","Search and access by index O(n)"]]}],exam:{title:"T1 Written Test simulation",minutes:60,intro:"Modelled on the April 2025 Test 1. Six sections, 75 marks, 60 minutes. Section A (20 marks) is marked automatically. Sections B to F (55 marks) are written: answer on paper, then reveal the memo and award yourself marks honestly.",sections:[{title:"Section A: Multiple choice",kind:"mcq",marksEach:2,questions:[{q:"Which property of an algorithm requires that it terminates?",options:["Definiteness","Effectiveness","Finiteness","Output"],answer:2},{q:"n\xB2 + 100n + 5 simplifies to:",options:["O(n)","O(n\xB2)","O(100n)","O(n\xB2 + n)"],answer:1},{q:"A loop `for (j = 1; j < n; j = j * 2)` runs about:",options:["n times","n/2 times","log\u2082 n times","n\xB2 times"],answer:2},{q:"Space complexity of iterative factorial:",options:["O(1)","O(log n)","O(n)","O(n\xB2)"],answer:0},{q:"Naive recursive Fibonacci has time complexity:",options:["O(n)","O(n log n)","O(n\xB2)","O(2\u207F)"],answer:3},{q:"Binary search requires the data to be:",options:["Stored in a linked list","Sorted","Of even length","Unique"],answer:1},{q:"The best case of bubble sort with a swapped flag is:",options:["O(1)","O(log n)","O(n)","O(n\xB2)"],answer:2},{q:"Naive bubble sort on 1000 numbers makes about how many comparisons?",options:["1 000","10 000","1 000 000","1 000 000 000"],answer:2},{q:"Inserting at the front of a singly linked list is:",options:["O(1)","O(log n)","O(n)","O(n\xB2)"],answer:0},{q:"In a circular singly linked list with a tail reference, the first node is:",options:["tail.prev","tail.next","null","tail itself"],answer:1}]},{title:"Section B: Big-O analysis",kind:"written",questions:[{q:"Determine the Big-O expression for: `int sum = 0; for (int i = 0; i < n; i++) sum += a[i]; for (int j = 0; j < n; j++) for (int k = 0; k < 5; k++) sum += a[j] * k;`",marks:3,model:"First loop: n iterations, O(n) (1). Second: n \xD7 5 = 5n, the k-loop is a constant, O(n) (1). Sequential, so add: n + 5n = 6n \u2192 O(n) (1)."},{q:"Determine the Big-O expression for: `int count = 0; for (int i = n; i > 0; i = i / 2) for (int j = 0; j < n; j++) count++;`",marks:3,model:"Outer loop halves i each time: about log\u2082 n iterations, O(log n) (1). Inner loop: n iterations, O(n) (1). Nested, so multiply: O(n log n) (1)."},{q:"Determine the Big-O expression for: `int count = 0; for (int i = 0; i < n; i += 2) for (int j = i; j < n; j++) count++;`",marks:3,model:"Outer loop runs n/2 times, O(n) (1). Inner loop runs n \u2212 i times, on average about n/2, O(n) (1). Nested: about n\xB2/4 iterations \u2192 drop the constant \u2192 O(n\xB2) (1)."}]},{title:"Section C: Recursion",kind:"written",questions:[{q:"Write a recursive Java method `int power(int b, int e)` that returns b\u1D49 for e \u2265 0. Using the concept of stack frames, demonstrate how power(2, 4) executes, and report its time and space complexity in Big-O notation.",marks:9,model:"Code: if (e == 0) return 1; return b * power(b, e \u2212 1); (2: base case 1, recursive case 1). Winding: frames power(2,4), power(2,3), power(2,2), power(2,1), power(2,0) pushed in order (2). Base case power(2,0) returns 1 with 5 frames on the stack (1). Unwinding: 2 \xD7 1 = 2, 2 \xD7 2 = 4, 2 \xD7 4 = 8, 2 \xD7 8 = 16, frames popped (2). Time O(e): e + 1 calls, one multiplication each (1). Space O(e): e + 1 frames alive at the deepest point (1)."},{q:"Compare the time and space complexity of naive recursive Fibonacci and iterative Fibonacci. Explain why the recursive version is so slow and which you would use in practice.",marks:6,model:"Recursive time O(2\u207F) (1): each call makes two calls and values are recomputed many times, e.g. fib(5) makes 15 calls and computes fib(2) three times (1). Recursive space O(n): depth of the call tree (1). Iterative time O(n) (1), space O(1), only two or three variables (1). Use iteration (or memoisation) in practice: exponentially faster and constant memory (1)."}]},{title:"Section D: Searching",kind:"written",questions:[{q:"Trace binary search for 72 in the sorted array [2, 5, 8, 12, 16, 23, 38, 56, 72, 91]. Show low, high and mid at each step and state the number of comparisons.",marks:4,model:"low 0, high 9, mid 4: 16 < 72, low = 5 (1). low 5, high 9, mid 7: 56 < 72, low = 8 (1). low 8, high 9, mid 8: 72 found (1). Index 8 after 3 comparisons (1)."},{q:"Compare linear and binary search in terms of requirements and best, average and worst case. Explain why `mid = low + (high \u2212 low) / 2` is used instead of `(low + high) / 2` in Java.",marks:5,model:"Linear: works on any data; best O(1), average and worst O(n) (1). Binary: requires sorted data with random access (1); best O(1), average and worst O(log n) (1). low + high can exceed the int maximum of 2 147 483 647 and overflow to a negative number (1); high \u2212 low never exceeds the array size, so the alternative gives the same midpoint without overflow (1)."}]},{title:"Section E: Bubble sort",kind:"written",questions:[{q:"Show how bubble sort modifies {34, 12, 67, 5, 22} as it executes. Show enough changes to demonstrate the mechanism.",marks:8,model:"Pass 1: 34>12 swap {12,34,67,5,22}; 34<67; 67>5 swap {12,34,5,67,22}; 67>22 swap {12,34,5,22,67} (2). Pass 2: 12<34; 34>5 swap {12,5,34,22,67}; 34>22 swap {12,5,22,34,67} (2). Pass 3: 12>5 swap {5,12,22,34,67}; 12<22 (2). Pass 4: 5<12, no swaps, stop (1). Largest values shown settling at the right after each pass, final {5, 12, 22, 34, 67} (1)."},{q:"How many comparisons and swaps did your trace make (with a shrinking inner loop)? State the best, average and worst case Big-O of bubble sort, and explain the best case.",marks:4,model:"Comparisons 4 + 3 + 2 + 1 = 10, swaps 6 (1). Average and worst O(n\xB2): (n \u2212 1)(n \u2212 1) or n(n \u2212 1)/2 comparisons (1). Best O(n) (1): with a swapped flag, sorted input needs one pass of n \u2212 1 comparisons with no swaps, then stops (1)."}]},{title:"Section F: Linked lists",kind:"written",questions:[{q:"Starting from an empty singly linked list, perform insertEnd(15), insertEnd(7), insertEnd(22), insertFront(4), insertAfter(7, 11), delete(15). Draw the list after each operation.",marks:3,model:"15; 15 \u2192 7; 15 \u2192 7 \u2192 22 (0.5). 4 \u2192 15 \u2192 7 \u2192 22 (0.5). 4 \u2192 15 \u2192 7 \u2192 11 \u2192 22 (1). 4 \u2192 7 \u2192 11 \u2192 22 \u2192 null (1)."},{q:"Write a Java method insertEnd(int data) for a singly linked list that has only a head reference. State its time complexity and explain how a tail reference would change it.",marks:4,model:"Create node; if head == null set head = newNode (1). Walk current while current.next != null, then current.next = newNode (1). O(n), since every node is visited (1). With tail: tail.next = newNode; tail = newNode; which is O(1) (1)."},{q:"Explain why deleting a given node is O(n) in a singly linked list but O(1) in a doubly linked list.",marks:3,model:"Deleting requires changing the previous node's next reference (1). A singly linked list cannot step backwards, so it must walk from head to find the previous node: O(n) (1). A doubly linked list has node.prev, so node.prev.next = node.next and node.next.prev = node.prev, with no search: O(1) (1)."}]}]}};var xx={id:"SO1",ready:!0,title:"Review of Term 1 exercises",summary:"Worked solutions to the ten Term 1 practice exercises: factorial both ways, stack frames, the three Big-O excerpts, and bubble, insertion and quick sort traces.",why:"The Term 2 test opens with the same kind of questions as Term 1. The 8 June 2023 paper spends its whole first question (20 marks) on factorial and Big-O excerpts, and Questions 3 and 4 expect the sorting trace skills you built in Term 1. Getting these right is the fastest way to bank marks.",visualizers:["recursion","sorting","complexity"],notes:[{t:"h",text:"The ten exercises"},{t:"p",text:"Mr Makhurane's Term 1 practice set has ten questions, and every one of them has appeared on a real test (April 2025, May 2021 and June 2023). They are:"},{t:"ol",items:["Implement a recursive method for factorial [5].","Implement an iterative method for factorial [5].","Using the concept of a stack frame, explain the performance of the recursive method in Big-O [10].","Compare the two from the viewpoint of time and space. Which is preferable in the real world? [5]","Big-O of two sequential loops [3].","Big-O of an outer `i++` loop with an inner `j = j * 3` loop [3].","Big-O of an outer `i += 3` loop with an inner `j--` loop [3].","Bubble sort trace of {90, 23, 5, 109, 12} [12].","Insertion sort trace of the same array [12].","Quick sort of {9, 7, 5, 11, 12, 2, 14, 3, 10, 6} with the middle element as pivot, plus best, average and worst case [12 + 6]."]},{t:"h",text:"1. Factorial, both ways"},{t:"code",title:"Recursive and iterative factorial",java:`// Recursive: base case + recursive case
public static long factorialRecursive(int n) {
    if (n == 0 || n == 1) return 1;          // base case stops the recursion
    return n * factorialRecursive(n - 1);    // smaller problem each time
}

// Iterative: one loop, one accumulator
public static long factorialIterative(int n) {
    long result = 1;
    for (int i = 2; i <= n; i++) {
        result = result * i;
    }
    return result;
}`,python:`def factorial_recursive(n):
    if n == 0 or n == 1:
        return 1                          # base case
    return n * factorial_recursive(n - 1)

def factorial_iterative(n):
    result = 1
    for i in range(2, n + 1):
        result *= i
    return result`,csharp:`static long FactorialRecursive(int n) => n <= 1 ? 1 : n * FactorialRecursive(n - 1);

static long FactorialIterative(int n) {
    long result = 1;
    for (int i = 2; i <= n; i++) result *= i;
    return result;
}`},{t:"diagram",id:"callstack",caption:"The call stack for factorial(4) at its deepest point. Every frame is still waiting for the one above it to return."},{t:"p",text:"Each call pushes a **stack frame** holding its own copy of `n`, its local variables and the return address. For factorial(5) the frames for 5, 4, 3, 2 and 1 are all alive at once. Only when the base case returns do they unwind: 1, then 2 \xD7 1 = 2, 3 \xD7 2 = 6, 4 \xD7 6 = 24, 5 \xD7 24 = **120**."},{t:"table",head:["","Recursive","Iterative"],rows:[["Time","O(n): n calls, one multiplication each","O(n): the loop runs n \u2212 1 times"],["Space","**O(n)**: n stack frames alive together","**O(1)**: just `result` and `i`"],["Risk","StackOverflowError for very deep recursion","None"],["Overhead","A method call per step","None beyond the loop"],["Verdict","Clear, mirrors n! = n \xD7 (n \u2212 1)!","**Preferred in practice**"]]},{t:"callout",kind:"tip",title:"Where the 5 marks for Q4 come from",text:"One mark each for: same time O(n); recursive space O(n) because of stack frames; iterative space O(1); stack overflow risk; a clear conclusion that iteration is preferable in the real world."},{t:"h",text:"2. The three Big-O excerpts"},{t:"table",head:["Excerpt","Outer loop","Inner loop","Combine","Answer"],rows:[["Two loops one after the other","n","n (separate loop)","Add: n + n = 2n","**O(n)**"],["`i++` outside, `j = j * 3` inside","n \u2212 1","\u2308log\u2083 n\u2309 (j = 1, 3, 9, 27\u2026)","Multiply: n \xD7 log\u2083 n","**O(n log n)**"],["`i += 3` outside, `j--` inside","\u2308n / 3\u2309","n \u2212 1","Multiply: (n/3)(n \u2212 1)","**O(n\xB2)**"]]},{t:"p",text:"Checked by counting iterations: for n = 1000 the three excerpts run 2 000, 6 993 and 333 666 times. 6 993 is (n \u2212 1) \xD7 7 because \u2308log\u2083 1000\u2309 = 7, and 333 666 is 334 \xD7 999."},{t:"callout",kind:"warn",title:"Some answer guides copy excerpt 2 wrongly",text:"The paper says `for (int j = 1; j < n; j = j * 3)`. A few circulating answer guides write `j = i` instead and still give O(n log n). If j really started at i, the inner loop would run about log\u2083(n/i) times and the total adds up to only about 1.5n (1 497 iterations for n = 1000), which is **O(n)**. Read the starting value carefully: with `j = 1`, as on the paper, the answer is O(n log n)."},{t:"h",text:"3. Bubble and insertion sort on {90, 23, 5, 109, 12}"},{t:"table",head:["Bubble pass","Array after the pass","Swaps","Fixed at the end"],rows:[["Start","[90, 23, 5, 109, 12]","\u2013","\u2013"],["1","[23, 5, 90, 12, 109]","3","109"],["2","[5, 23, 12, 90, 109]","2","90"],["3","[5, 12, 23, 90, 109]","1","23"],["4","[5, 12, 23, 90, 109]","0","all sorted"]]},{t:"p",text:"With the shrinking inner loop that is 4 + 3 + 2 + 1 = **10 comparisons** and **6 swaps**. The lecturer's simplest version does not shrink the inner loop, so it makes **(n \u2212 1)(n \u2212 1) = 16 comparisons** for n = 5. Both are O(n\xB2)."},{t:"table",head:["Insertion step","Key","What happens","Array after"],rows:[["i = 1","23","23 < 90, shift 90 right, insert at 0","[23, 90, 5, 109, 12]"],["i = 2","5","Shift 90 and 23 right, insert at 0","[5, 23, 90, 109, 12]"],["i = 3","109","109 > 90, no shift","[5, 23, 90, 109, 12]"],["i = 4","12","Shift 109, 90, 23 right; 5 < 12 so insert at 1","[5, 12, 23, 90, 109]"]]},{t:"p",text:"Insertion sort used **8 comparisons** and **6 shifts** here. Its best case (already sorted) is O(n) because each key is compared once with its left neighbour and stays put."},{t:"h",text:"4. Quick sort with the middle pivot"},{t:"p",text:"The full trace of {9, 7, 5, 11, 12, 2, 14, 3, 10, 6} is worked in SO9 and in the examples below. The first partition picks a[4] = 12, swaps 12 with 6 and 14 with 10, and splits the array into [9, 7, 5, 11, 6, 2, 10, 3] and [14, 12]. The final result is [2, 3, 5, 6, 7, 9, 10, 11, 12, 14]."},{t:"callout",kind:"why",title:"How to approach a review question",text:"Write the definition or code first (method marks), then the trace, then the Big-O with a one-line reason. The memos give marks for each of those three parts separately."}],concepts:[{term:"Base case",def:"The condition that stops recursion and returns a value directly, e.g. n \u2264 1 for factorial."},{term:"Recursive case",def:"The part of a recursive method that calls itself on a smaller input."},{term:"Stack frame",def:"The block of memory pushed for each method call: parameters, local variables and the return address."},{term:"Unwinding",def:"Frames being popped one by one as each call returns its result to the caller."},{term:"Sequential loops",def:"Loops one after the other. Their costs add: O(n) + O(n) = O(n)."},{term:"Nested loops",def:"A loop inside a loop. Their costs multiply: O(n) \xD7 O(log n) = O(n log n)."},{term:"Constant rule",def:"Constant factors are dropped in Big-O: O(2n) = O(n), O(n\xB2/3) = O(n\xB2)."},{term:"Pass (bubble sort)",def:"One sweep of adjacent comparisons. After pass k, the k largest values are in place at the end."},{term:"Shift (insertion sort)",def:"Moving a larger element one place right to make room for the key."},{term:"Pivot",def:"The value quick sort partitions around. Here it is always the middle element a[(low + high) / 2]."}],mnemonics:[{title:"Add beside, multiply inside",text:"Loops BESIDE each other ADD. Loops INSIDE each other MULTIPLY."},{title:"Times three is a tree",text:"Whenever the loop variable is multiplied or divided (j *= 3, j /= 2) you get a logarithm, just like the levels of a tree."},{title:"Same time, different space",text:"Recursive vs iterative factorial: SAME time O(n), DIFFERENT space O(n) vs O(1)."},{title:"Bubbles rise, cards slide",text:"Bubble sort: the biggest bubble rises to the end each pass. Insertion sort: slide each new card into your sorted hand."}],pitfalls:["Saying two sequential O(n) loops are O(n\xB2). They add, so the answer is O(n).","Treating `j = j * 3` as linear. It is logarithmic, so excerpt 2 is O(n log n), not O(n\xB2).","Thinking `i += 3` changes the class. n/3 iterations is still O(n), so excerpt 3 is O(n\xB2).","Saying recursive factorial has O(1) space. Every pending call holds a stack frame, so it is O(n).","Forgetting the base case, which recurses until a StackOverflowError.","Showing only the final sorted array in a trace question. The marks are for the intermediate states.","Using int for factorial results. 13! already overflows a Java int; use long (or BigInteger beyond 20!)."],examples:[{title:"Explain recursive factorial with stack frames (10 marks)",problem:"Using the concept of a stack frame, explain the performance of recursive factorial in Big-O notation. Use factorial(4).",steps:["factorial(4) is called: a frame with n = 4 is pushed. It needs factorial(3), so it waits.","Frames for n = 3, 2 and 1 are pushed the same way. The stack is now 4 frames deep.","factorial(1) hits the base case and returns 1. Its frame is popped.","Unwinding: factorial(2) returns 2 \xD7 1 = 2, factorial(3) returns 3 \xD7 2 = 6, factorial(4) returns 4 \xD7 6 = 24.","Time: one call per value of n, each doing O(1) work, so O(n).","Space: at the deepest point n frames exist together, so O(n) extra memory. The iterative loop needs O(1)."],answer:"factorial(4) = 24. Time O(n), space O(n) because of n simultaneous stack frames."},{title:"Count the iterations of excerpt 2",problem:"How many times does `prod = prod * j` run when n = 10? Generalise.",steps:["Outer loop: i = 1 \u2026 9, so 9 iterations.","Inner loop: j = 1, 3, 9, then 27 \u2265 10 stops. 3 iterations.","Total = 9 \xD7 3 = 27.","In general (n \u2212 1) \xD7 \u2308log\u2083 n\u2309, which is O(n log n)."],answer:"27 times for n = 10; O(n log n) in general."},{title:"Bubble sort with the early-exit flag",problem:"Trace optimised bubble sort on {90, 23, 5, 109, 12} and count comparisons and swaps.",steps:["Pass 1 (4 comparisons): swap 90/23, swap 90/5, keep 90/109, swap 109/12 \u2192 [23, 5, 90, 12, 109].","Pass 2 (3 comparisons): swap 23/5, keep 23/90, swap 90/12 \u2192 [5, 23, 12, 90, 109].","Pass 3 (2 comparisons): keep 5/23, swap 23/12 \u2192 [5, 12, 23, 90, 109].","Pass 4 (1 comparison): keep 5/12. No swaps, so the flag ends the sort."],answer:"10 comparisons, 6 swaps, sorted array [5, 12, 23, 90, 109]."},{title:"Insertion sort, detailed final step",problem:"Show the shifts when key = 12 is inserted into the sorted part [5, 23, 90, 109].",steps:["j = 3: 109 > 12, copy a[3] to a[4] \u2192 [5, 23, 90, 109, 109].","j = 2: 90 > 12, copy to a[3] \u2192 [5, 23, 90, 90, 109].","j = 1: 23 > 12, copy to a[2] \u2192 [5, 23, 23, 90, 109].","j = 0: 5 < 12, stop. Place key at a[1]."],answer:"[5, 12, 23, 90, 109] after 3 shifts and 4 comparisons in this step."},{title:"Quick sort performance (6 marks)",problem:"Explain the best, average and worst case of quick sort.",steps:["Best: the pivot always splits the range in half. log\u2082 n levels, O(n) partition work per level, so O(n log n).","Average: random data gives reasonably balanced splits, still O(n log n) (about 1.39 n log\u2082 n comparisons).","Worst: the pivot is always the smallest or largest, so each partition removes one element. n + (n \u2212 1) + \u2026 + 1 \u2248 n\xB2/2, so O(n\xB2).","Space: O(log n) stack on average, O(n) in the worst case."],answer:"Best O(n log n), average O(n log n), worst O(n\xB2)."}],exercises:[{q:"Write recursive and iterative methods that return the sum 1 + 2 + \u2026 + n. Give the time and space of each.",solution:[{t:"code",java:`static long sumRec(int n) { return n == 0 ? 0 : n + sumRec(n - 1); }   // O(n) time, O(n) space

def sum_iter(n):

ssions.",why:"Stacks sit under every method call your program makes, the undo button in your editor, the back button in your browser and every compiler's expression parser. The 2021 test asked for a linked stack of Student objects (20 marks), and the lecturer's Stack2026 slides build both array and linked versions.",visualizers:["stack","recursion"],notes:[{t:"h",text:"1. What a stack is"},{t:"p",text:"A **stack** is a linear collection where items are added and removed at **one end only**, called the **top**. The last item pushed is the first one popped: **LIFO** (Last In, First Out). Think of a stack of plates in the canteen: you take the top plate and put clean ones on top."},{t:"table",head:["Operation","What it does","Time"],rows:[["push(x)","Put x on the top","O(1)"],["pop()","Remove and return the top item (error if empty: **underflow**)","O(1)"],["peek() / top()","Return the top item without removing it","O(1)"],["isEmpty()","True if there are no items","O(1)"],["isFull()","True if an array-based stack is at capacity (**overflow** on the next push)","O(1)"],["size()","Number of items","O(1)"]]},{t:"diagram",id:"stackops",caption:"push 5, push 8, push 3, then pop: 3 comes off first and 8 is the new top."},{t:"p",text:"A stack is an **abstract data type (ADT)**: it is defined by these operations, not by how they are stored. The lecturer's slides build it twice: once on an array, once on linked nodes."},{t:"h",text:"2. A stack on a static array"},{t:"p",text:"Keep an array and an index `top` that points at the current top item. An empty stack has `top = -1`. Push increments `top` then stores; pop reads then decrements. Nothing ever shifts, so every operation is O(1)."},{t:"code",title:"Array-based stack of int",java:`public class ArrayStack {
    private final int[] data;
    private int top = -1;                       // -1 means empty

    public ArrayStack(int capacity) { data = new int[capacity]; }

    public boolean isEmpty() { return top == -1; }
    public boolean isFull()  { return top == data.length - 1; }

    public void push(int value) {
        if (isFull()) throw new IllegalStateException("Stack overflow");
        data[++top] = value;                    // move up, then store
    }

    public int pop() {
        if (isEmpty()) throw new IllegalStateException("Stack underflow");
        return data[top--];                     // read, then move down
    }

    public int peek() {
        if (isEmpty()) throw new IllegalStateException("Stack is empty");
        return data[top];
    }

    public int size() { return top + 1; }
}`,python:`class ArrayStack:
    def __init__(self, capacity):
        self.data = [None] * capacity
        self.top = -1                      # -1 means empty

    def is_empty(self): return self.top == -1
    def is_full(self):  return self.top == len(self.data) - 1

    def push(self, value):
        if self.is_full():
            raise OverflowError("Stack overflow")
        self.top += 1
        self.data[self.top] = value

    def pop(self):
        if self.is_empty():
            raise IndexError("Stack underflow")
        value = self.data[self.top]
        self.top -= 1
        return value

    def peek(self):
        if self.is_empty():
            raise IndexError("Stack is empty")
        return self.data[self.top]`,csharp:`public class ArrayStack {

    String name, studentId;
    double overallMark;
    Student(String name, String studentId, double overallMark) {
        this.name = name; this.studentId = studentId; this.overallMark = overallMark;
    }
    public String toString() { return name + " (" + studentId + ") " + overallMark; }
}

class StudentStack {
    private static class Node {
        Student data;
        Node next;
        Node(Student data, Node next) { this.data = data; this.next = next; }
    }

    private Node top;                    // null means empty
    private int size;

    public boolean isEmpty() { return top == null; }

    public void push(Student s) {        // O(1)
        top = new Node(s, top);          // new node points at the old top
        size++;
    }

    public Student pop() {               // O(1)
        if (isEmpty()) throw new RuntimeException("Stack underflow");
        Student s = top.data;
        top = top.next;                  // old top becomes garbage
        size--;
        return s;
    }

    public Student peek() {
        if (isEmpty()) throw new RuntimeException("Stack is empty");
        return top.data;
    }

    public int size() { return size; }
}

// push John, Ayanda, Khaya  ->  TOP -> Khaya -> Ayanda -> John -> null
// pop() returns Khaya`,python:`class Student:
    def __init__(self, name, student_id, mark):
        self.name, self.student_id, self.mark = name, student_id, mark

class _Node:
    def __init__(self, data, next_node):
        self.data, self.next = data, next_node

class StudentStack:
    def __init__(self):
        self.top = None
        self.size = 0

    def is_empty(self):
        return self.top is None

    def push(self, s):
        self.top = _Node(s, self.top)
        self.size += 1

    def pop(self):
        if self.is_empty():
            raise IndexError("Stack underflow")
        s = self.top.data
        self.top = self.top.next
        self.size -= 1
        return s

    def peek(self):
        if self.is_empty():
            raise IndexError("Stack is empty")
        return self.top.data`},{t:"table",head:["","Array stack","Linked stack"],rows:[["push / pop / peek","O(1)","O(1)"],["Capacity","Fixed (overflow possible)","Grows until memory runs out"],["Memory per item","Just the value","Value + a next reference"],["Cache behaviour","Contiguous, very fast","Nodes scattered in the heap"],["isFull()","top == capacity \u2212 1","Always false"]]},{t:"p",text:"In real Java code use `ArrayDeque<T>` as a stack (`push`, `pop`, `peek`). The old `java.util.Stack` class still works but is synchronised and extends `Vector`, so the documentation recommends `Deque` instead."},{t:"h",text:"4. Recursion runs on the call stack"},{t:"p",text:"The JVM keeps a **call stack**. Each method call pushes a frame; each return pops one. Recursion is simply a method that pushes several frames of itself. That is why every recursive algorithm can be rewritten with an explicit stack, and why deep recursion ends in `StackOverflowError`: the call stack has a fixed size (often around 10 000 to 20 000 frames for a simple method with default settings)."},{t:"diagram",id:"callstack",caption:"factorial(4): frames are pushed on the way down and popped on the way back up, exactly like push and pop."},{t:"code",title:"The same recursion done with an explicit stack",java:`// Recursive
static long factorial(int n) { return n <= 1 ? 1 : n * factorial(n - 1); }

// Simulating the call stack yourself
static long factorialWithStack(int n) {
    Deque<Integer> stack = new ArrayDeque<>();
    while (n > 1) stack.push(n--);         // "calls": push pending work
    long result = 1;
    while (!stack.isEmpty()) result *= stack.pop();   // "returns": unwind
    return result;
}`,python:`def factorial_with_stack(n):
    stack = []
    while n > 1:
        stack.append(n)       # push pending multiplications
        n -= 1
    result = 1
    while stack:
        result *= stack.pop() # unwind
    return result`},{t:"p",text:"Recursion also has a cost in **time**: Fibonacci written naively as fib(n) = fib(n \u2212 1) + fib(n \u2212 2) makes 15 calls for fib(5) and 177 calls for fib(10), because it recomputes the same values. Factorial and Euclid's HCF make only one call per level, so they are O(n) and O(log n) respectively."},{t:"h",text:"5. Application: reversing a string"},{t:"p",text:'Push every character, then pop them all. Because the stack is LIFO, they come out in reverse order. "ADP470S" becomes "S074PDA". Time O(n), space O(n).'},{t:"code",title:"Reverse with a stack",java:`static String reverse(String s) {
    Deque<Character> stack = new ArrayDeque<>();
    for (char c : s.toCharArray()) stack.push(c);
    StringBuilder out = new StringBuilder();
    while (!stack.isEmpty()) out.append(stack.pop());
    return out.toString();
}`,python:`def reverse(s):
    stack = list(s)
    out = []
    while stack:
        out.append(stack.pop())
    return "".join(out)`},{t:"h",text:"6. Application: palindromes"},{t:"p",text:`A **palindrome** reads the same forwards and backwards. The lecturer's examples are **2002**, **1991** and **amanaplanacanalpanama** ("a man, a plan, a canal: Panama" with spaces and punctuation removed). Push every character, then pop and compare with the string read from the start. One mismatch means it is not a palindrome. 2026 is not one: it reverses to 6202.`},{t:"code",title:"Palindrome check with a stack",java:`static boolean isPalindrome(String s) {
    String clean = s.toLowerCase().replaceAll("[^a-z0-9]", "");
    Deque<Character> stack = new ArrayDeque<>();
    for (char c : clean.toCharArray()) stack.push(c);
    for (char c : clean.toCharArray())
        if (c != stack.pop()) return false;   // first mismatch ends it
    return true;
}

    Deque<Character> stack = new ArrayDeque<>();
    for (char c : s.toCharArray()) {
        if (c == '(' || c == '[' || c == '{') stack.push(c);
        else if (c == ')' || c == ']' || c == '}') {
            if (stack.isEmpty()) return false;            // closer with no opener
            char open = stack.pop();
            if ((c == ')' && open != '(') || (c == ']' && open != '[') || (c == '}' && open != '{'))
                return false;                             // wrong type
        }
    }
    return stack.isEmpty();                               // leftovers = unclosed
}`,python:`def is_balanced(s):
    pairs = {")": "(", "]": "[", "}": "{"}

    Deque<Integer> stack = new ArrayDeque<>();
    for (String tok : expr.trim().split("\\\\s+")) {

                int b = stack.pop();          // right operand comes off first
                int a = stack.pop();

                    case "-" -> a - b;
                    case "*" -> a * b;
                    default  -> a / b;
                });
                break;
            }
            default: stack.push(Integer.parseInt(tok));
        }
    }
    return stack.pop();

1 is a palindrome; 2026 is not (it reverses to 6202)."}],exercises:[{q:"Write a generic array-based stack `ArrayStack<T>` that doubles its capacity instead of throwing on overflow. What is the amortised cost of push?",solution:[{t:"code",java:`public class ArrayStack<T> {
    private T[] data = (T[]) new Object[4];
    private int top = -1;

    public void push(T x) {
        if (top == data.length - 1) data = java.util.Arrays.copyOf(data, data.length * 2); // O(n), rare
        data[++top] = x;
    }
    public T pop() {
        if (top == -1) throw new RuntimeException("underflow");
        T x = data[top];
        data[top--] = null;              // let the garbage collector reclaim it
        return x;
    }
    public T peek() { if (top == -1) throw new RuntimeException("empty"); return data[top]; }
    public boolean isEmpty() { return top == -1; }
}`},{t:"p",text:"Copying costs O(n) but happens only when the size doubles, so over n pushes the total copying is at most 2n. Push is **amortised O(1)**."}]},{q:"Evaluate the postfix expression 2 3 4 * + and convert it back to infix.",solution:"push 2, 3, 4; * gives 12; + gives 2 + 12 = 14. Infix: 2 + 3 * 4."},{q:"Convert A * (B + C) \u2212 D / E to postfix.",solution:"A B C + * D E / \u2212"},{q:"Which of these are balanced? (a) ([]{}) (b) ([)] (c) (( ) (d) {[()]}",solution:"(a) balanced, (b) not (wrong type popped), (c) not (one ( left over), (d) balanced."},{q:'Write a recursive method that reverses a string without using a stack object. Where is the "stack" in your solution?',solution:[{t:"code",java:`static String reverse(String s) {

t the rear) and dequeue (remove from the front). Say so in one line at the top of your answer so the marker knows you are not describing a stack."},{t:"h",text:"2. Queue on a static array (shifting version)"},{t:"p",text:"The first design on the lecturer's slides keeps the front always at index 0. Enqueue writes at `data[count]` and is **O(1)**. Dequeue takes `data[0]` and then **shifts every remaining item one place left**, which is **O(n)**. Emptying a queue of 5 items this way costs 4 + 3 + 2 + 1 + 0 = 10 shifts."},{t:"code",title:"Array queue: the 2023 test answer (push, pop, isEmpty, peek)",java:`public class ArrayQueue {
    private final int[] data;
    private int count = 0;                       // items stored in data[0 .. count-1]

    public ArrayQueue(int capacity) { data = new int[capacity]; }

    // 2.3 isEmpty
    public boolean isEmpty() { return count == 0; }
    public boolean isFull()  { return count == data.length; }

    public void push(int value) {
        if (isFull()) throw new IllegalStateException("Queue is full");
        data[count++] = value;
    }

    // 2.2 pop (dequeue from the front) - O(n) because of the shift
    public int pop() {

        int front = data[0];

}`,python:`class ArrayQueue:

        int value = data[front];

ersion above, say "empty when count == 0, full when count == capacity".'},{t:"h",text:"6. Linked queue"},{t:"p",text:"A singly linked list with **two** references: `front` (head) for dequeue and `rear` (tail) for enqueue. Both operations are O(1) and there is no capacity. The one subtle case: when the last node is dequeued, set `rear` to null too."},{t:"code",title:"Linked queue",java:`public class LinkedQueue<T> {
    private static class Node<T> { T data; Node<T> next; Node(T d) { data = d; } }
    private Node<T> front, rear;
    private int size;

    public boolean isEmpty() { return front == null; }

    public void enqueue(T x) {                 // O(1): add after the tail
        Node<T> n = new Node<>(x);
        if (rear == null) front = rear = n;    // first node is both ends
        else { rear.next = n; rear = n; }
        size++;
    }

    public T dequeue() {                       // O(1): remove the head
        if (isEmpty()) throw new RuntimeException("Queue is empty");
        T x = front.data;
        front = front.next;
        if (front == null) rear = null;        // queue became empty
        size--;
        return x;
    }

    public T peek() {
        if (isEmpty()) throw new RuntimeException("Queue is empty");
        return front.data;
    }

s insertion and removal at both ends."},{term:"ArrayDeque",def:"Java's resizable circular-array deque; the recommended class for both queues and stacks."}],mnemonics:[{title:"Join the back, served at the front",text:"Like the queue at a till: enqueue at the REAR, dequeue from the FRONT."},{title:"Sushi belt",text:"A circular queue is a sushi conveyor: the plates go round and empty spots come back to you. % capacity is the bend in the belt."},{title:"Count the people",text:"Full or empty? Just count the people in the queue: 0 is empty, capacity is full."},{title:"Offer, poll, peek",text:"The polite trio returns null or false instead of throwing: OFFER a seat, POLL the first person, PEEK at who is next."},{title:"Two pointers for two ends",text:"A linked stack needs one pointer (top). A linked queue needs two (front and rear)."}],pitfalls:["Writing rear = rear + 1 without % capacity, which runs off the end of the array instead of wrapping.","Using front == rear alone as the empty test with the count-free design, which cannot tell empty from full.","Forgetting to set rear = null when the last node is dequeued from a linked queue; the next enqueue then links onto a dead node.","Enqueueing at the head and dequeueing at the tail of a singly linked list, which makes dequeue O(n).","Saying a circular queue can grow. It still has a fixed capacity; only a resizing version (like ArrayDeque) grows.","Claiming the shifting array queue has O(1) dequeue. The shift loop is O(n).","Confusing the queue's push/pop (2023 paper wording) with a stack's push/pop.","Calling remove() or element() on an empty Java queue and getting NoSuchElementException when poll() or peek() would have returned null."],examples:[{title:"Circular queue wrap-around",problem:"A circular queue has capacity 5, front = 0, rear = \u22121, count = 0. Perform enqueue 10, 20, 30, 40, dequeue, dequeue, enqueue 50, 60, 70. Give front, rear and the array after the last step.",steps:["Four enqueues: rear moves 0, 1, 2, 3. count = 4.","Two dequeues return 10 then 20. front = 2, count = 2.","enqueue 50: rear = (3 + 1) % 5 = 4.","enqueue 60: rear = (4 + 1) % 5 = 0. Cell 0 is reused.","enqueue 70: rear = 1. count = 5, so the queue is now full."],answer:"front = 2, rear = 1, count = 5, array [60, 70, 30, 40, 50]. Queue order from the front: 30, 40, 50, 60, 70."},{title:"Cost of the shifting queue",problem:"Five items are enqueued into the shifting array queue and then all five are dequeued. How many element shifts happen? Generalise to n.",steps:["Dequeue 1 shifts the remaining 4 items.","Then 3, 2, 1, 0 shifts.","Total 4 + 3 + 2 + 1 + 0 = 10.","For n items: (n \u2212 1) + \u2026 + 0 = n(n \u2212 1)/2."],answer:"10 shifts; n(n \u2212 1)/2 in general, so each dequeue is O(n) and emptying the queue is O(n\xB2)."},{title:"Sacrifice one slot",problem:"With the one-empty-slot design (front = rear = 0, rear is the next free cell), how many items fit in a capacity-5 array? Show when it reports full.",steps:["enqueue 1: store at 0, rear = 1.","enqueue 2, 3, 4: rear becomes 2, 3, 4.","enqueue 5: (rear + 1) % 5 = 0 == front, so it reports full."],answer:"Only 4 items fit; one cell is always left empty to distinguish full from empty."},{title:"Write peek and isEmpty for a circular queue (10 marks)",problem:"Give isEmpty and peek for a circular queue that uses front, rear and count. State their complexity.",steps:["isEmpty: return count == 0 (O(1)).","peek: if empty, throw an exception (or return a sentinel).","Otherwise return data[front]; do not change front or count (O(1))."],code:{java:`public boolean isEmpty() { return count == 0; }

    private final T[] data;
    private int front = 0, rear = -1, count = 0;

    @SuppressWarnings("unchecked")
    public CircularQueue(int capacity) { data = (T[]) new Object[capacity]; }

    public boolean isEmpty() { return count == 0; }
    public boolean isFull()  { return count == data.length; }

    public void enqueue(T x) {
        if (isFull()) throw new IllegalStateException("full");
        rear = (rear + 1) % data.length;
        data[rear] = x;
        count++;
    }
    public T dequeue() {
        if (isEmpty()) throw new IllegalStateException("empty");
        T x = data[front];
        data[front] = null;
        front = (front + 1) % data.length;
        count--;
        return x;
    }
    public T peek() { if (isEmpty()) throw new IllegalStateException("empty"); return data[front]; }
}`}]},{q:"Capacity 6, front = 4, rear = 1, count = 4. Which indices hold items, in queue order? Where will the next enqueue go?",solution:"Items run from front around to rear: indices 4, 5, 0, 1. The next enqueue goes to (1 + 1) % 6 = 2."},{q:"Explain the false full problem and how the circular queue solves it.",solution:"In a linear array queue, rear only moves forward. After rear reaches the last index, enqueue fails even if dequeues have freed cells at the front. A circular queue computes the next index as (rear + 1) % capacity, so rear wraps to 0 and reuses those cells without shifting anything."},{q:"Why does a linked queue need a rear pointer when a linked stack does not?",solution:"A stack adds and removes at the same end (the head). A queue adds at one end and removes at the other. Without a rear pointer, enqueue would have to walk the whole list to find the tail, which is O(n)."},{q:'What does this print? `Queue<Integer> q = new ArrayDeque<>(); q.offer(4); q.offer(7); q.poll(); q.offer(9); System.out.println(q.peek() + " " + q.size());`',solution:'"7 2". 4 is polled, leaving 7 at the front and 9 behind it.'},{q:"Write a method that reverses a queue using a stack.",solution:[{t:"code",java:`static <T> void reverse(Queue<T> q) {

    while (!q.isEmpty()) stack.push(q.poll());   // front goes to the bottom of the stack
    while (!stack.isEmpty()) q.offer(stack.pop()); // last item comes out first
}   // O(n) time, O(n) extra space`}]},{q:"Give two real systems that use a queue and explain why FIFO is the right discipline for each.",solution:"A print spooler: jobs should print in the order they were sent, so nobody is skipped. A web server request buffer: requests are handled in arrival order so that response times are fair. Breadth-first search also uses a queue so that nodes are explored level by level."}],quiz:[{type:"mcq",q:"A queue follows which discipline?",options:["LIFO","FIFO","Highest priority first","Sorted order"],answer:1,explain:"First In, First Out."},{type:"complexity",q:"dequeue on a static array queue that keeps the front at index 0 and shifts the rest left:",options:["O(1)","O(log n)","O(n)","O(n\xB2)"],answer:2,explain:"Every remaining item moves one place."},{type:"complexity",q:"dequeue on a circular array queue:",options:["O(1)","O(log n)","O(n)","O(n log n)"],answer:0,explain:"Only front moves, with modulo."},{type:"mcq",q:"Capacity 8 and rear = 7. After one enqueue, rear is:",options:["8","0","1","7"],answer:1,explain:"(7 + 1) % 8 = 0."},{type:"mcq",q:"With the count method, a circular queue is full when:",options:["front == rear","rear == capacity \u2212 1","count == capacity","(rear + 1) % capacity == front"],answer:2,explain:"Count makes it unambiguous."},{type:"mcq",q:"With the sacrifice-one-slot method, a capacity-10 array can hold at most:",options:["8 items","9 items","10 items","11 items"],answer:1,explain:"One cell always stays empty."},{type:"output",q:"What does this print?",code:`Queue<String> q = new ArrayDeque<>();

y**. In a **min-priority queue** the smallest key comes out first (Java's default); in a **max-priority queue** the largest does."},{t:"table",head:["Operation","What it does"],rows:[["insert(x) / offer(x)","Add x with its priority"],["extractMin() / poll()","Remove and return the highest-priority item"],["peek()","Return the highest-priority item without removing it"],["isEmpty(), size()","As for any collection"]]},{t:"h",text:"2. Simple implementations and their cost"},{t:"table",head:["Implementation","insert","extract highest","peek"],rows:[["Unsorted array or list","O(1): append","O(n): scan for the best, then remove it","O(n)"],["Sorted array (best at the end)","O(n): find the place and shift","O(1): take the last","O(1)"],["Sorted linked list","O(n): walk to the place","O(1): take the head","O(1)"],["**Binary heap**","**O(log n)**","**O(log n)**","**O(1)**"],["Balanced BST (AVL)","O(log n)","O(log n)","O(log n), or O(1) with a cached min"]]},{t:"p",text:"Each simple version makes one operation fast and the other slow. For n inserts and n extracts both list versions cost O(n\xB2) in total. A heap balances the two and costs O(n log n)."},{t:"h",text:"3. The binary heap"},{t:"p",text:"A **binary heap** is a binary tree with two rules:"},{t:"ol",items:["**Shape rule:** it is a **complete** binary tree. Every level is full except possibly the last, which is filled from the left with no gaps.","**Order rule (heap property):** in a **max-heap** every parent is \u2265 its children, so the maximum is at the root. In a **min-heap** every parent is \u2264 its children, so the minimum is at the root."]},{t:"p",text:"A heap is **not** sorted and is **not** a BST: siblings can be in any order, and the left child can be bigger than the right. It only promises that the best item is on top."},{t:"h",text:"4. Storing a heap in an array"},{t:"p",text:"Because the tree is complete, it fits in an array with no gaps and no pointers. Read the tree level by level, left to right, into indices 0, 1, 2, \u2026 For a node at index i:"},{t:"formula",text:"left child = 2i + 1      right child = 2i + 2      parent = (i \u2212 1) / 2   (integer division)"},{t:"diagram",id:"heaparray",caption:"The max-heap [109, 90, 67, 34, 12, 22, 5, 23] built from {90, 23, 5, 109, 12, 22, 67, 34}. Node 1 (90) has children at 3 (34) and 4 (12); node 3 (34) has its left child at 7 (23)."},{t:"p",text:"In an array of n items the leaves are at indices \u230An/2\u230B to n \u2212 1, and the last non-leaf is at **\u230An/2\u230B \u2212 1**. A heap with n items has height \u230Alog\u2082 n\u230B, which is why its operations are O(log n)."},{t:"h",text:"5. Insert: add at the end, then sift up"},{t:"p",text:"Put the new item in the next free cell (the bottom row, leftmost gap), which keeps the shape rule. Then **sift up** (also called bubble up or percolate up): while it is better than its parent, swap with the parent. At most one swap per level: **O(log n)**."},{t:"table",head:["Insert (min-heap)","Swaps","Array afterwards"],rows:[["40","\u2013","[40]"],["20","20 \u2194 40","[20, 40]"],["50","\u2013","[20, 40, 50]"],["10","10 \u2194 40, then 10 \u2194 20","[10, 20, 50, 40]"],["30","\u2013 (parent 20 is smaller)","[10, 20, 50, 40, 30]"],["5","5 \u2194 50, then 5 \u2194 10","[5, 20, 10, 40, 30, 50]"]]},{t:"h",text:"6. Extract: move the last to the root, then sift down"},{t:"p",text:"The answer is the root. Move the **last** item into the root (keeping the shape rule) and shrink the heap by one. Then **sift down** (heapify): while it is worse than its better child, swap with that child. Always swap with the **better** of the two children (the smaller in a min-heap), otherwise the order rule breaks. **O(log n)**."},{t:"table",head:["Extract from [5, 20, 10, 40, 30, 50]","Steps","Array afterwards"],rows:[["First extractMin \u2192 5","50 moves to the root; children 20 and 10, smaller is 10; swap 50 \u2194 10","[10, 20, 50, 40, 30]"],["Second extractMin \u2192 10","30 moves to the root; children 20 and 50; swap 30 \u2194 20; 30 now has child 40, stop","[20, 30, 50, 40]"]]},{t:"code",title:"Min-heap priority queue",java:`public class MinHeap {
    private int[] heap = new int[16];
    private int size = 0;

    public boolean isEmpty() { return size == 0; }
    public int peek() { if (size == 0) throw new RuntimeException("empty"); return heap[0]; }

    public void insert(int x) {                          // O(log n)
        if (size == heap.length) heap = java.util.Arrays.copyOf(heap, size * 2);
        heap[size] = x;
        siftUp(size++);
    }

    public int extractMin() {                            // O(log n)
        if (size == 0) throw new RuntimeException("empty");
        int min = heap[0];
        heap[0] = heap[--size];                          // last item to the root
        siftDown(0);
        return min;
    }

    private void siftUp(int i) {
        while (i > 0) {
            int p = (i - 1) / 2;
            if (heap[i] >= heap[p]) break;               // order rule holds
            swap(i, p);
            i = p;
        }
    }

    private void siftDown(int i) {
        while (true) {
            int l = 2 * i + 1, r = 2 * i + 2, best = i;
            if (l < size && heap[l] < heap[best]) best = l;
            if (r < size && heap[r] < heap[best]) best = r;
            if (best == i) return;
            swap(i, best);
            i = best;
        }
    }

    private void swap(int a, int b) { int t = heap[a]; heap[a] = heap[b]; heap[b] = t; }
}`,python:`class MinHeap:
    def __init__(self):
        self.h = []

    def insert(self, x):
        self.h.append(x)
        i = len(self.h) - 1
        while i > 0 and self.h[i] < self.h[(i - 1) // 2]:        # sift up
            p = (i - 1) // 2
            self.h[i], self.h[p] = self.h[p], self.h[i]
            i = p

    def extract_min(self):
        top = self.h[0]
        last = self.h.pop()
        if self.h:
            self.h[0] = last
            i, n = 0, len(self.h)
            while True:                                           # sift down
                l, r, best = 2 * i + 1, 2 * i + 2, i
                if l < n and self.h[l] < self.h[best]: best = l
                if r < n and self.h[r] < self.h[best]: best = r
                if best == i: break
                self.h[i], self.h[best] = self.h[best], self.h[i]
                i = best
        return top

cs:[{title:"Two-i plus one, two-i plus two",text:"Children of i live at 2i+1 and 2i+2. The parent lives at (i\u22121)/2, rounded down."},{title:"Insert climbs, extract sinks",text:"A new item is added at the bottom and CLIMBS (sift up). After extract, the moved item SINKS (sift down)."},{title:"Swap with the stronger child",text:"When sifting down a max-heap, swap with the BIGGER child, never just the left one."},{title:"Java is a min-ion",text:"Java's PriorityQueue is a MIN-heap unless you tell it otherwise with reverseOrder()."},{title:"Heap is not sorted",text:'A heap only promises the BEST item is on top. Everything below is just "better than its children".'}],pitfalls:["Thinking a heap is sorted. [1, 5, 3] is a valid min-heap; printing a PriorityQueue does not show sorted order.","Confusing a heap with a BST. A heap does not keep left < parent < right, so it cannot be searched in O(log n).","During sift down, swapping with the left child instead of the better child, which breaks the heap property.","Using parent = i / 2 with 0-based arrays. That formula is for 1-based arrays; 0-based uses (i \u2212 1) / 2.","Forgetting that Java's PriorityQueue is a min-heap and expecting poll() to return the largest value.","Starting bottom-up heapify at index n \u2212 1 or 0 instead of \u230An/2\u230B \u2212 1 and working backwards.","Assuming PriorityQueue.remove(x) or contains(x) is O(log n). Both scan the array: O(n)."],examples:[{title:"Max-heap by repeated insertion",problem:"Insert 90, 23, 5, 109, 12, 22, 67, 34 one at a time into an empty max-heap. Give the array after each insert that causes swaps, and the final heap.",steps:["90, 23, 5: no swaps \u2192 [90, 23, 5]","109 at index 3: parent 23 \u2192 swap; parent 90 \u2192 swap \u2192 [109, 90, 5, 23]","12 at index 4: parent 90 is bigger, stop \u2192 [109, 90, 5, 23, 12]","22 at index 5: parent 5 \u2192 swap \u2192 [109, 90, 22, 23, 12, 5]","67 at index 6: parent 22 \u2192 swap \u2192 [109, 90, 67, 23, 12, 5, 22]","34 e arrival number breaks the tie between the two level-1 patients."}],exercises:[{q:"Insert 15, 3, 18, 7, 20, 9 into an empty max-heap. Give the final array.",solution:"15 \u2192 [15]; 3 \u2192 [15, 3]; 18 swaps with 15 \u2192 [18, 3, 15]; 7 swaps with 3 \u2192 [18, 7, 15, 3]; 20 swaps with 7 then 18 \u2192 [20, 18, 15, 3, 7]; 9 under 15, no swap \u2192 **[20, 18, 15, 3, 7, 9]**."},{q:"Extract the minimum twice from the min-heap [5, 20, 10, 40, 30, 50].",solution:"First: return 5, 50 to the root, swap with 10 \u2192 [10, 20, 50, 40, 30]. Second: return 10, 30 to the root, swap with 20 \u2192 [20, 30, 50, 40]."},{q:"Is [10, 15, 30, 40, 50, 100, 40] a valid min-heap? Is [10, 15, 30, 12, 50] one?",solution:"The first is valid: every parent is \u2264 its children (10 \u2264 15, 30; 15 \u2264 40, 50; 30 \u2264 100, 40). The second is not: index 3 (12) is a child of index 1 (15) and 12 < 15."},{q:'What does this print? `PriorityQueue<Integer> pq = new PriorityQueue<>(); for (int x : new int[]{7, 3, 9, 1}) pq.offer(x); System.out.println(pq.peek() + " " + pq);`',solution:'"1 [1, 3, 9, 7]". The internal array is the heap after sift-ups: 3 swaps with 7, then 1 swaps with 7 and with 3.'},{q:"Write a Comparator-based PriorityQueue of Student objects where the highest overallMark comes out first.",solution:[{t:"code",java:`PriorityQueue<Student> pq = new PriorityQueue<>(

t:"h",text:"1. Binary tree vocabulary"},{t:"p",text:"A **binary tree** is either empty, or a node with a value and two subtrees, **left** and **right**, which are themselves binary trees. Each node therefore has **0, 1 or 2 children**."},{t:"tree",keys:[50,30,70,20,40,60,80],caption:"The tree from the lecturer's notes: insert 50, 30, 70, 20, 40, 60, 80. Root 50, leaves 20, 40, 60, 80, height 2."},{t:"table",head:["Term","Meaning","In the tree above"],rows:[["Root","The only node with no parent","50"],["Parent / child","A node directly above / below another","30 is the parent of 20 and 40"],["Siblings","Children of the same parent","20 and 40; 60 and 80"],["Leaf","A node with no children","20, 40, 60, 80"],["Internal node","A node with at least one child","50, 30, 70"],["Edge","The link between a parent and a child","6 edges for 7 nodes"],["Depth of a node","Number of edges from the root to it","depth(40) = 2"],["Level","All nodes with the same depth","Level 1 is 30 and 70"],["Height of the tree","Edges on the longest root-to-leaf path","2"],["Subtree","A node together with all its descendants","The subtree at 70 is {70, 60, 80}"]]},{t:"callout",kind:"warn",title:"Two height conventions",text:"The lecturer's notes count **edges**: a single leaf has height 0 and an empty tree has height \u22121. Some textbooks (and some code, including the visualiser's internal counter) count **nodes**, giving 1 for a leaf and 0 for empty. Both give the same balance factors. State your convention in a test answer."},{t:"h",text:"2. Special shapes"},{t:"table",head:["Shape","Definition","Fact"],rows:[["**Full** (proper)","Every node has 0 or 2 children","Leaves = internal nodes + 1"],["**Complete**","Every level full except possibly the last, which is filled from the left","Fits in an array with no gaps (heaps)"],["**Perfect**","All internal nodes have 2 children and all leaves are on the same level","Height h has 2^(h+1) \u2212 1 nodes"],["**Balanced**","Left and right subtree heights differ by at most 1 at every node","Height O(log n) (AVL trees, SO7)"],["**Degenerate** (skewed)","Every internal node has exactly one child","Behaves like a linked list: height n \u2212 1"]]},{t:"p",text:"The 50/30/70 tree above is full, complete and perfect: height 2 with 2\xB3 \u2212 1 = 7 nodes. A perfect tree is always complete and full, but not the other way round."},{t:"h",text:"3. The binary search tree rule"},{t:"p",text:"A **binary search tree (BST)** is a binary tree where, for **every** node, all keys in the **left** subtree are **smaller** and all keys in the **right** subtree are **larger**. Duplicates are usually ignored or counted. It is not enough to compare a node with its own children: the rule must hold for whole subtrees."},{t:"p",text:"To **search**, start at the root: equal means found, smaller means go left, larger means go right, null means not there. Each step discards one subtree, so search costs **O(h)**: O(log n) when the tree is balanced, O(n) when it is degenerate. **Insert** follows the same path and hangs the new node where the search fell off the tree."},{t:"p",text:"Running example: insert **45, 20, 70, 10, 30, 60, 90, 25, 35, 65**."},{t:"tree",keys:[45,20,70,10,30,60,90,25,35,65],caption:"BST after inserting 45, 20, 70, 10, 30, 60, 90, 25, 35, 65. Height 3, five leaves (10, 25, 35, 65, 90)."},{t:"p",text:"Search 35: 35 < 45 go left to 20; 35 > 20 go right to 30; 35 > 30 go right: found after visiting 45, 20, 30, 35. Search 62: 45 \u2192 70 \u2192 60 \u2192 65 \u2192 left of 65 is null, so 62 is not in the tree."},{t:"h",text:"4. Deleting from a BST: three cases"},{t:"table",head:["Case","Rule","Example on the tree above"],rows:[["Leaf","Just remove it","Delete 10: 20 now has only its right child 30"],["One child","Replace the node by its only child","Delete 60: 65 moves up to be the left child of 70"],["Two children","Copy in the **inorder successor** (smallest key in the right subtree), then delete the successor from the right subtree","Delete 20: successor 25 replaces it \u2192 25 with children 10 and 30(., 35)"]]},{t:"p",text:"Deleting the root 45 uses case 3 as well: its successor is 60 (go right to 70, then left as far as possible). 60 takes the root and 65 takes 60's old place. Preorder afterwards: 60, 20, 10, 30, 25, 35, 70, 65, 90. The **inorder predecessor** (largest key in the left subtree) works equally well; just be consistent."},{t:"code",title:"BST with insert, search, delete and the four traversals",java:`import java.util.*;

public class BST {
    private static class Node {
        int key; Node left, right;
        Node(int key) { this.key = key; }
    }
    private Node root;

    public void insert(int key) { root = insert(root, key); }
    private Node insert(Node n, int key) {
        if (n == null) return new Node(key);            // found the empty spot
        if (key < n.key) n.left = insert(n.left, key);
        else if (key > n.key) n.right = insert(n.right, key);
        return n;                                       // duplicates ignored
    }

    public boolean search(int key) {                    // O(h)
        Node n = root;
        while (n != null) {
            if (key == n.key) return true;
            n = key < n.key ? n.left : n.right;
        }
        return false;
    }

    public void delete(int key) { root = delete(root, key); }
    private Node delete(Node n, int key) {
        if (n == null) return null;
        if (key < n.key) n.left = delete(n.left, key);
        else if (key > n.key) n.right = delete(n.right, key);
        else {
            if (n.left == null) return n.right;         // leaf or only a right child
            if (n.right == null) return n.left;         // only a left child
            Node s = n.right;                           // two children: inorder successor
            while (s.left != null) s = s.left;
            n.key = s.key;
            n.right = delete(n.right, s.key);
        }
        return n;
    }

    // Depth-first traversals: O(n) time, O(h) stack space
    void inorder(Node n, List<Integer> out)   { if (n == null) return; inorder(n.left, out); out.add(n.key); inorder(n.right, out); }
    void preorder(Node n, List<Integer> out)  { if (n == null) return; out.add(n.key); preorder(n.left, out); preorder(n.right, out); }
    void postorder(Node n, List<Integer> out) { if (n == null) return; postorder(n.left, out); postorder(n.right, out); out.add(n.key); }

    // Breadth-first traversal with a queue: O(n) time, O(width) space
    List<Integer> levelOrder() {
        List<Integer> out = new ArrayList<>();
        Queue<Node> q = new ArrayDeque<>();
        if (root != null) q.offer(root);
        while (!q.isEmpty()) {
            Node n = q.poll();
            out.add(n.key);
            if (n.left != null) q.offer(n.left);
            if (n.right != null) q.offer(n.right);
        }
        return out;
    }

    int height(Node n) { return n == null ? -1 : 1 + Math.max(height(n.left), height(n.right)); }
}`,python:`from collections import deque

class Node:
    def __init__(self, key):

def insert(n, key):

        return Node(key)
    if key < n.key:
        n.left = insert(n.left, key)
    elif key > n.key:
        n.right = insert(n.right, key)
    return n

def search(n, key):
    while n:
        if key == n.key:
            return True
        n = n.left if key < n.key else n.right
    return False

def delete(n, key):
    if n is None:
        return None
    if key < n.key:
        n.left = delete(n.left, key)
    elif key > n.key:
        n.right = delete(n.right, key)
    else:
        if n.left is None:
            return n.right
        if n.right is None:
            return n.left
        s = n.right
        while s.left:
            s = s.left
        n.key = s.key
        n.right = delete(n.right, s.key)
    return n

def inorder(n):   return inorder(n.left) + [n.key] + inorder(n.right) if n else []
def preorder(n):  return [n.key] + preorder(n.left) + preorder(n.right) if n else []
def postorder(n): return postorder(n.left) + postorder(n.right) + [n.key] if n else []

def level_order(root):
    out, q = [], deque([root] if root else [])
    while q:
        n = q.popleft()
        out.append(n.key)
        if n.left:  q.append(n.left)
        if n.right: q.append(n.right)
    return out

def height(n):
    return -1 if n is None else 1 + max(height(n.left), height(n.right))`},{t:"h",text:"5. The four traversals"},{t:"p",text:"A **traversal** visits every node exactly once. The three depth-first ones differ only in **when** the node itself is visited relative to its two subtrees. The name tells you where the root goes: **pre** = before, **in** = in between, **post** = after."},{t:"table",head:["Traversal","Order","On the 50/30/70 tree","Typical use"],rows:[["Inorder","Left, Node, Right","20, 30, 40, 50, 60, 70, 80","Sorted output from a BST"],["Preorder","Node, Left, Right","50, 30, 20, 40, 70, 60, 80","Copying or saving a tree (rebuilds the same shape)"],["Postorder","Left, Right, Node","20, 40, 30, 60, 80, 70, 50","Deleting a tree, evaluating expression trees"],["Level-order","Level by level, left to right, using a queue","50, 30, 70, 20, 40, 60, 80","Printing by level, shortest path in a tree"]]},{t:"table",head:["Traversal","On the 45/20/70 tree"],rows:[["Inorder","10, 20, 25, 30, 35, 45, 60, 65, 70, 90"],["Preorder","45, 20, 10, 30, 25, 35, 70, 60, 65, 90"],["Postorder","10, 25, 35, 30, 20, 65, 60, 90, 70, 45"],["Level-order","45, 20, 70, 10, 30, 60, 90, 25, 35, 65"]]},{t:"callout",kind:"tip",title:"The flag trick for drawing traversals by hand",text:'Trace a line around the outside of the tree, starting left of the root. Each node has three "flags": left side, underneath, right side. Preorder lists a node when you pass its left side, inorder when you pass underneath, postorder when you pass its right side.'},{t:"p",text:"Level-order trace on the 45/20/70 tree with a queue: start [45]. Visit 45, enqueue 20, 70. Visit 20, enqueue 10, 30. Visit 70, enqueue 60, 90. Visit 10. Visit 30, enqueue 25, 35. Visit 60, enqueue 65. Visit 90, 25, 35, 65. Output: 45, 20, 70, 10, 30, 60, 90, 25, 35, 65."},{t:"h",text:"6. Cost of BST operations"},{t:"table",head:["Operation","Balanced (h \u2248 log\u2082 n)","Degenerate (h = n \u2212 1)"],rows:[["Search","O(log n)","O(n)"],["Insert","O(log n)","O(n)"],["Delete","O(log n)","O(n)"],["Any traversal","O(n)","O(n)"],["Find min / max","O(log n)","O(n)"]]},{t:"p",text:"Inserting already-sorted keys such as 10, 20, 30, 40, 50 gives a degenerate tree of height 4 that is really a linked list. That is the problem SO7 (AVL trees) solves."},{t:"tree",keys:[10,20,30,40,50],caption:"Sorted inserts make a degenerate BST: every search walks the whole chain."},{t:"callout",kind:"tip",title:"String keys: the 2021 Student BST",text:"For a BST of Student objects keyed on name, compare with `s.name.compareTo(node.data.name)`: negative goes left, positive goes right, zero is a duplicate. Inserting John, Ayanda, Khaya, Zanele gives root John, Ayanda on the left, Khaya on the right and Zanele right of Khaya. Inorder prints them alphabetically: Ayanda, John, Khaya, Zanele."}],concepts:[{term:"Binary tree",def:"A tree in which every node has at most two children, called left and right."},{term:"Root",def:"The top node; the only node without a parent."},{term:"Leaf",def:"A node with no children."},{term:"Internal node",def:"A node with at least one child."},{term:"Depth",def:"Number of edges from the root to a node. The root has depth 0."},{term:"Height",def:"Number of edges on the longest path from a node down to a leaf. A leaf has height 0; an empty tree \u22121."},{term:"Subtree",def:"A node together with all of its descendants."},{term:"Full binary tree",def:"Every node has either 0 or 2 children."},{term:"Complete binary tree",def:"All levels full except possibly the last, which is filled from left to right."},{term:"Perfect binary tree",def:"All internal nodes have two children and all leaves share the same depth; 2^(h+1) \u2212 1 nodes."},{term:"Degenerate tree",def:"Each internal node has one child, so the tree is effectively a linked list."},{term:"Binary search tree",def:"A binary tree where every key in a node's left subtree is smaller and every key in its right subtree is larger."},{term:"Inorder successor",def:"The next larger key: the leftmost node of the right subtree. Used when deleting a node with two children."},{term:"Inorder traversal",def:"Left, Node, Right. Gives a BST's keys in ascending order."},{term:"Preorder traversal",def:"Node, Left, Right. The root comes first."},{term:"Postorder traversal",def:"Left, Right, Node. The root comes last."},{term:"Level-order traversal",def:"Breadth-first: visit level 0, then level 1, and so on, using a queue."}],mnemonics:[{title:"Pre, In, Post: where is the root?",text:"PRE = root BEFORE the children, IN = root IN between, POST = root AFTER. Left always comes before right."},{title:"Inorder is in order",text:"INorder on a BST gives keys IN ORDER (sorted)."},{title:"Smaller left, larger right",text:"At every fork in a BST: smaller keys turn LEFT, larger keys turn RIGHT."},{title:"Successor: right once, then left all the way",text:"To find the inorder successor of a node with two children, step RIGHT once, then go LEFT until you cannot."},{title:"Levels need a line",text:"Level-order needs a QUEUE (people standing in line). The depth-first three use the call STACK."}],pitfalls:["Checking the BST rule only between a parent and its children. A key in the left subtree of the root must be smaller than the root even if it is a grandchild.","Mixing up preorder and postorder. Preorder starts with the root; postorder ends with it.","Giving height in nodes when the question uses edges (or the reverse). State your convention.","When deleting a node with two children, removing the successor from the wrong subtree or forgetting to delete it at all, which duplicates a key.","Assuming all BST operations are O(log n). They are O(h), which is O(n) for a degenerate tree.","Using a stack instead of a queue for level-order traversal, which produces a depth-first order instead.","Comparing String keys with < or == in Java. Use compareTo for ordering and equals for equality."],examples:[{title:"Build and traverse a BST",problem:"Insert 50, 30, 70, 20, 40, 60, 80 into an empty BST. Give the inorder, preorder, postorder and level-order traversals.",steps:["50 is the root. 30 < 50 goes left, 70 > 50 goes right.","20 < 50, 20 < 30: left of 30. 40: right of 30. 60: left of 70. 80: right of 70.","Inorder (L, N, R): 20, 30, 40, 50, 60, 70, 80.","Preorder (N, L, R): 50, 30, 20, 40, 70, 60, 80.","Postorder (L, R, N): 20, 40, 30, 60, 80, 70, 50.","Level-order: 50, 30, 70, 20, 40, 60, 80."],answer:"A perfect tree of height 2; the four orders as listed."},{title:"Traverse a less regular tree",problem:"For the BST built from 45, 20, 70, 10, 30, 60, 90, 25, 35, 65, give the preorder and postorder.",steps:["Shape: 45 has children 20 and 70. 20 has 10 and 30; 30 has 25 and 35. 70 has 60 and 90; 60 has only a right child 65.","Preorder: 45, then the whole left subtree (20, 10, 30, 25, 35), then the right subtree (70, 60, 65, 90).","Postorder: left subtree (10, 25, 35, 30, 20), right subtree (65, 60, 90, 70), then 45."],answer:"Preorder 45, 20, 10, 30, 25, 35, 70, 60, 65, 90. Postorder 10, 25, 35, 30, 20, 65, 60, 90, 70, 45."},{title:"Delete with two children",problem:"Delete 20 from the 45/20/70 tree above.",steps:["20 has two children (10 and 30).","Inorder successor: go right to 30, then left as far as possible: 25.","Copy 25 into the node that held 20.","Delete 25 from the right subtree; it is a leaf, so just remove it."],answer:"The left subtree of 45 becomes 25 with children 10 and 30, and 30 keeps only its right child 35. Inorder is still sorted: 10, 25, 30, 35, 45, 60, 65, 70, 90."},{title:"Reconstruct a tree from two traversals",problem:"A binary tree has preorder A, B, D, E, C and inorder D, B, E, A, C. Draw it and give its postorder.",steps:["Preorder starts with the root: A.","In the inorder, everything left of A (D, B, E) is the left subtree; C is the right subtree.","The next preorder item, B, is the root of the left subtree. In the inorder D is left of B and E is right of B.","So A has children B and C; B has children D and E."],answer:"Postorder: D, E, B, C, A. This is the tree used in the lecturer's notes."},{title:"Count nodes in special trees",problem:"How many nodes does a perfect binary tree of height 4 have? What is the minimum height of any binary tree with 100 nodes?",steps:["Perfect tree: 2^(h+1) \u2212 1 = 2\u2075 \u2212 1 = 31 nodes.","A tree of height h holds at most 2^(h+1) \u2212 1 nodes. Height 5 holds 63, height 6 holds 127.","100 > 63, so height 6 is the minimum."],answer:"31 nodes; minimum height 6 (that is \u230Alog\u2082 100\u230B = 6)."}],exercises:[{q:"Insert 6, 7, 4, 9, 10, 3, 1, 8 into an empty BST and give all four traversals.",solution:"Inorder 1, 3, 4, 6, 7, 8, 9, 10. Preorder 6, 4, 3, 1, 7, 9, 8, 10. Postorder 1, 3, 4, 8, 10, 9, 7, 6. Level-order 6, 4, 7, 3, 9, 1, 8, 10. (This is the Term 3 lecture example.)"},{q:"Write a recursive method that counts the leaves of a binary tree.",solution:[{t:"code",java:`int leaves(Node n) {
    if (n == null) return 0;
    if (n.left == null && n.right == null) return 1;   // a leaf

}   // O(n)`,python:`def leaves(n):

    if (root == null) throw new NoSuchElementException();
    Node n = root;

private boolean check(Node n, long lo, long hi) {
    if (n == null) return true;
    if (n.key <= lo || n.key >= hi) return false;      // outside the range allowed by ancestors
    return check(n.left, lo, n.key) && check(n.right, n.key, hi);
}`},{t:"p",text:"Each node carries the range its ancestors allow. An equivalent check: the inorder traversal must be strictly increasing."}]},{q:"Delete 45 (the root) from the 45/20/70 tree. Give the new preorder.",solution:"Successor of 45 is 60 (right to 70, then left to 60). 60 replaces 45 and 65 takes 60's place under 70. Preorder: 60, 20, 10, 30, 25, 35, 70, 65, 90."},{q:"Explain why level-order needs a queue and what would happen with a stack.",solution:"Level-order must finish a whole level before the next. A queue releases nodes in the order they were discovered, so all of level k come out before any of level k + 1. A stack releases the newest node first, so it dives down one branch, producing a depth-first (preorder-like) order instead."},{q:"State whether the 45/20/70 tree is full, complete or perfect, with a reason.",solution:"Not full: 60 has exactly one child. Not complete: the last level (25, 35, 65) is not filled from the left, because 10 has no children while 30 and 60 do. Not perfect, since it is neither full nor complete."},{q:"Implement a BST of Student objects keyed on name with an inorder method that prints them alphabetically (2021 test, 20 marks).",solution:[{t:"code",java:`class StudentBST {
    private static class Node { Student data; Node left, right; Node(Student s) { data = s; } }
    private Node root;

    public void insert(Student s) { root = insert(root, s); }
    private Node insert(Node n, Student s) {
        if (n == null) return new Node(s);
        int cmp = s.name.compareTo(n.data.name);
        if (cmp < 0) n.left = insert(n.left, s);
        else if (cmp > 0) n.right = insert(n.right, s);
        return n;                                   // same name: ignore
    }

    public void inorder() { inorder(root); }
    private void inorder(Node n) {
        if (n == null) return;
        inorder(n.left);
        System.out.println(n.data);                 // alphabetical order
        inorder(n.right);
    }
}`}]}],quiz:[{type:"mcq",q:"Which traversal of a BST gives its keys in ascending order?",options:["Preorder","Inorder","Postorder","Level-order"],answer:1,explain:"Left subtree (smaller), node, right subtree (larger)."},{type:"mcq",q:"Preorder of the BST built from 50, 30, 70, 20, 40, 60, 80:",options:["20, 30, 40, 50, 60, 70, 80","50, 30, 20, 40, 70, 60, 80","20, 40, 30, 60, 80, 70, 50","50, 30, 70, 20, 40, 60, 80"],answer:1,explain:"Node, then the whole left subtree, then the right."},{type:"mcq",q:"Postorder of the BST built from 50, 30, 70, 20, 40, 60, 80:",options:["20, 40, 30, 60, 80, 70, 50","50, 70, 80, 60, 30, 40, 20","20, 30, 40, 60, 70, 80, 50","40, 20, 30, 80, 60, 70, 50"],answer:0,explain:"Left, right, then node; the root is last."},{type:"mcq",q:"Which data structure does level-order traversal use?",options:["Stack","Queue","Heap","Hash table"],answer:1,explain:"FIFO keeps whole levels together."},{type:"complexity",q:"Search in a BST whose keys were inserted in sorted order:",options:["O(1)","O(log n)","O(n)","O(n log n)"],answer:2,explain:"The tree is a chain of height n \u2212 1."},{type:"complexity",q:"Any of the four traversals of a tree with n nodes:",options:["O(log n)","O(n)","O(n log n)","O(n\xB2)"],answer:1,explain:"Each node is visited exactly once."},{type:"mcq",q:"When deleting a BST node with two children, it is replaced by its inorder successor, which is:",options:["Its right child","The largest key in its left subtree","The smallest key in its right subtree","Its parent"],answer:2,explain:"The next larger key: right once, then left all the way."},{type:"mcq",q:"A perfect binary tree of height 3 (edges) has how many nodes?",options:["7","8","15","16"],answer:2,explain:"2^(3+1) \u2212 1 = 15."},{type:"tf",q:"Every complete binary tree is also a full binary tree.",options:["True","False"],answer:1,explain:"A complete tree may have a node with only a left child on the last level."},{type:"tf",q:"In a BST it is enough to check that each node is larger than its left child and smaller than its right child.",options:["True","False"],answer:1,explain:"The rule applies to whole subtrees, not just direct children."},{type:"mcq",q:"Preorder A, B, D, E, C and inorder D, B, E, A, C. The postorder is:",options:["D, E, B, C, A","D, B, E, C, A","E, D, B, C, A","A, C, B, E, D"],answer:0,explain:"A has children B (with D, E) and C."},{type:"output",q:"What does this return for a single-node tree, using the notes' convention?",code:`int height(Node n) {
