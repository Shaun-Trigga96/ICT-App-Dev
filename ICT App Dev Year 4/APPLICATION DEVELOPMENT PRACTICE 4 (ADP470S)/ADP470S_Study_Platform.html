}`,options:["\u22121","0","1","2"],answer:1,explain:"1 + max(\u22121, \u22121) = 0: a leaf has height 0."},{type:"mcq",q:"In the BST built from 45, 20, 70, 10, 30, 60, 90, 25, 35, 65, the search path for 62 is:",options:["45, 70, 60, 65","45, 70, 90","45, 20, 30","45, 70, 60"],answer:0,explain:"62 > 45, < 70, > 60, < 65, then null: not found."}]},Sx={id:"SO7",ready:!0,title:"AVL and height-balanced trees",summary:"Why plain BSTs degrade, balance factors, the four rotation cases (LL, RR, LR, RL) with fully traced inserts, and why an AVL tree guarantees O(log n) search, insert and delete.",why:"A BST is only fast while it stays bushy. Real data often arrives sorted (dates, student numbers, auto-increment IDs), which turns a plain BST into a linked list. AVL trees fix that automatically, and the same idea of self-balancing powers Java's TreeMap and TreeSet (red-black trees) and database indexes (B-trees).",visualizers:["bst"],notes:[{t:"h",text:"1. The problem: unbalanced BSTs"},{t:"p",text:"Every BST operation costs O(h). Insert 1, 2, 3, 4, 5, 6, 7 into a plain BST and you get a chain of height 6, so searching for 7 visits all seven nodes. The same keys in an AVL tree give a perfect tree of height 2."},{t:"tree",keys:[1,2,3,4,5,6,7],avl:!0,caption:"1 to 7 inserted in order into an AVL tree: four RR rotations later, a perfect tree of height 2 (a plain BST would be a chain of height 6)."},{t:"h",text:"2. Balance factor"},{t:"formula",text:"balance factor (BF) = height(left subtree) \u2212 height(right subtree)"},{t:"p",text:"An **AVL tree** (Adelson-Velsky and Landis, 1962) is a BST in which **every** node has BF \u22121, 0 or +1. A BF of +2 means the node is left-heavy; \u22122 means right-heavy. With the notes' convention an empty subtree has height \u22121, so a leaf has BF (\u22121) \u2212 (\u22121) = 0."},{t:"tree",keys:[45,20,70,10,30,60,90,25,35,65],avl:!0,caption:"A valid AVL tree. BFs: 45 is 0, 20 is \u22121, 70 is +1, 60 is \u22121, all leaves 0."},{t:"p",text:"Check the BFs in that tree: node 20 has a left subtree of height 0 (just 10) and a right subtree of height 1 (30 with two leaves), so BF = 0 \u2212 1 = \u22121. Node 60 has no left child (\u22121) and a leaf on the right (0): BF = \u22121. Every value is within \u22121 to +1, so no rotation is needed."},{t:"h",text:"3. Rotations"},{t:"p",text:"A **rotation** rearranges three nodes (and moves at most one subtree) so the tree gets shorter while the inorder sequence, and therefore the BST rule, is preserved. It changes a constant number of pointers: O(1)."},{t:"code",title:"Right and left rotation",java:`// Right rotation at y (fixes left-heavy):      Left rotation at x (fixes right-heavy):
//        y              x                      //     x                 y
//       / \\            / \\                     //    / \\               / \\
//      x   C   ==>     A   y                   //   A   y      ==>     x   C
//     / \\                / \\                   //      / \\           / \\
//    A   B              B   C                  //     B   C         A   B
Node rotateRight(Node y) {
    Node x = y.left;
    y.left = x.right;          // B moves across
    x.right = y;
    update(y); update(x);      // recompute heights bottom-up
    return x;                  // new root of this subtree
}

Node rotateLeft(Node x) {
    Node y = x.right;
    x.right = y.left;          // B moves across
    y.left = x;
    update(x); update(y);
    return y;
}`,python:`def rotate_right(y):
    x = y.left
    y.left = x.right       # B moves across
    x.right = y
    update(y); update(x)
    return x

def rotate_left(x):
    y = x.right
    x.right = y.left
    y.left = x
    update(x); update(y)
    return y`},{t:"h",text:"4. The four cases"},{t:"p",text:"After inserting, walk back up from the new node. At the **first** (lowest) node whose BF becomes \xB12, look at the two steps from that node towards the new key. They name the case:"},{t:"table",head:["Case","Path from the unbalanced node","BFs","Fix"],rows:[["**LL**","Left, then Left","node +2, left child +1","Single **right** rotation at the node"],["**RR**","Right, then Right","node \u22122, right child \u22121","Single **left** rotation at the node"],["**LR**","Left, then Right","node +2, left child \u22121","Left rotation at the left child, then right rotation at the node"],["**RL**","Right, then Left","node \u22122, right child +1","Right rotation at the right child, then left rotation at the node"]]},{t:"p",text:"The smallest examples all end in the same balanced tree, 20 with children 10 and 30:"},{t:"table",head:["Insert order","Case","Rotation"],rows:[["30, 20, 10","LL at 30","Right rotation at 30"],["10, 20, 30","RR at 10","Left rotation at 10"],["30, 10, 20","LR at 30","Left at 10, then right at 30"],["10, 30, 20","RL at 10","Right at 30, then left at 10"]]},{t:"h",text:"5. A full trace with all four cases"},{t:"p",text:"Insert **10, 20, 90, 80, 40, 70, 15** into an empty AVL tree."},{t:"table",head:["Insert","Unbalanced node (BF)","Path","Case and fix","Tree afterwards"],rows:[["10, 20","\u2013","\u2013","\u2013","10 with right child 20"],["90","10 (\u22122)","R, R","**RR**: left rotate at 10","20 (10, 90)"],["80","\u2013","\u2013","20 has BF \u22121, fine","20 (10, 90 (80, \u2013))"],["40","90 (+2)","L, L","**LL**: right rotate at 90","20 (10, 80 (40, 90))"],["70","20 (\u22122)","R (to 80), L (to 40)","**RL**: right rotate at 80, then left rotate at 20","40 (20 (10, \u2013), 80 (70, 90))"],["15","20 (+2)","L (to 10), R (to 15)","**LR**: left rotate at 10, then right rotate at 20","40 (15 (10, 20), 80 (70, 90))"]]},{t:"tree",keys:[10,20,90,80,40,70,15],avl:!0,caption:"Final AVL tree: perfect, height 2. The same seven keys in a plain BST give height 5."},{t:"p",text:"Look closely at the RL step. Before it, 20 has a right subtree rooted at 80 whose left child 40 just received 70. Right-rotating at 80 lifts 40 above 80 (70 becomes 80's left child). Left-rotating at 20 then lifts 40 to the root with 20 on its left. The inorder sequence 10, 20, 40, 70, 80, 90 never changes."},{t:"h",text:"6. Fix the lowest unbalanced node"},{t:"p",text:"Insert 68 into the AVL tree from section 2. It goes 45 \u2192 70 \u2192 60 \u2192 65 \u2192 right of 65. Now 60 has BF \u22122 **and** 70 has BF +2. Fix the lowest one, 60: the path is R, R, so a single left rotation at 60 makes 65 the parent of 60 and 68. That one rotation restores the old height of the subtree, so 70 and 45 are balanced again automatically. One rotation (single or double) always suffices after an insert."},{t:"tree",keys:[45,20,70,10,30,60,90,25,35,65,68],avl:!0,caption:"After inserting 68: RR at 60 turns 60 \u2192 65 \u2192 68 into 65 (60, 68)."},{t:"code",title:"AVL insert",java:`class AVLTree {
    static class Node { int key, height; Node left, right; Node(int k) { key = k; } }   // leaf height 0
    Node root;

    static int h(Node n)  { return n == null ? -1 : n.height; }
    static int bf(Node n) { return h(n.left) - h(n.right); }
    static void update(Node n) { n.height = 1 + Math.max(h(n.left), h(n.right)); }

    void insert(int key) { root = insert(root, key); }

    Node insert(Node n, int key) {
        if (n == null) return new Node(key);
        if (key < n.key) n.left = insert(n.left, key);
        else if (key > n.key) n.right = insert(n.right, key);
        else return n;                                        // no duplicates
        update(n);
        int b = bf(n);
        if (b > 1 && key < n.left.key)   return rotateRight(n);               // LL
        if (b < -1 && key > n.right.key) return rotateLeft(n);                // RR
        if (b > 1 && key > n.left.key)  { n.left = rotateLeft(n.left);  return rotateRight(n); }  // LR
        if (b < -1 && key < n.right.key) { n.right = rotateRight(n.right); return rotateLeft(n); } // RL
        return n;
    }
    // rotateRight / rotateLeft as above
}`,python:`class Node:
    def __init__(self, key):
        self.key, self.left, self.right, self.height = key, None, None, 0

def h(n):  return -1 if n is None else n.height
def bf(n): return h(n.left) - h(n.right)
def update(n): n.height = 1 + max(h(n.left), h(n.right))

def insert(n, key):
    if n is None:
        return Node(key)
    if key < n.key:
        n.left = insert(n.left, key)
    elif key > n.key:
        n.right = insert(n.right, key)
    else:
        return n
    update(n)
    b = bf(n)
    if b > 1 and key < n.left.key:   return rotate_right(n)          # LL
    if b < -1 and key > n.right.key: return rotate_left(n)           # RR
    if b > 1 and key > n.left.key:                                    # LR
        n.left = rotate_left(n.left);   return rotate_right(n)
    if b < -1 and key < n.right.key:                                  # RL
        n.right = rotate_right(n.right); return rotate_left(n)
    return n`},{t:"h",text:"7. Why AVL guarantees O(log n)"},{t:"p",text:"Let N(h) be the fewest nodes an AVL tree of height h can have. The sparsest tree has one subtree of height h \u2212 1 and the other of height h \u2212 2, so N(h) = N(h \u2212 1) + N(h \u2212 2) + 1. That grows like the Fibonacci numbers, which grow exponentially, so the height is at most about **1.44 log\u2082 n**. Search, insert and delete all walk one root-to-leaf path and do O(1) rotation work per level."},{t:"table",head:["Operation","Plain BST worst case","AVL tree (all cases)"],rows:[["Search","O(n)","O(log n)"],["Insert","O(n)","O(log n), at most one single or double rotation"],["Delete","O(n)","O(log n), may rotate at several levels"],["Space","O(n)","O(n) plus a height (or BF) per node"]]},{t:"callout",kind:"tip",title:"AVL versus red-black",text:"AVL trees are more strictly balanced, so lookups are slightly faster. Red-black trees (Java's TreeMap and TreeSet, C++ std::map) allow a little more imbalance and need fewer rotations on insert and delete. Both guarantee O(log n)."},{t:"callout",kind:"why",title:"Term 3 connection",text:"Term 3 revisits BSTs and AVL rotations in the project lectures, with the lecture sequence 30, 10, 20, 40, 50, 25, 5, 3, 4, 35, 45, 2. Practise both sequences with the BST visualiser in AVL mode."}],concepts:[{term:"Height-balanced tree",def:"A tree where, at every node, the heights of the left and right subtrees differ by at most a fixed amount (1 for AVL)."},{term:"AVL tree",def:"A self-balancing BST in which every node's balance factor is \u22121, 0 or +1."},{term:"Balance factor",def:"height(left subtree) \u2212 height(right subtree)."},{term:"Left-heavy / right-heavy",def:"BF +2 means the left subtree is two levels taller; \u22122 means the right subtree is."},{term:"Rotation",def:"An O(1) local restructuring that changes the shape of a BST without changing its inorder sequence."},{term:"Right rotation",def:"The left child moves up to replace the node, and the node becomes its right child. Fixes LL."},{term:"Left rotation",def:"The right child moves up to replace the node, and the node becomes its left child. Fixes RR."},{term:"LL case",def:"Inserted into the left subtree of the left child. Fix: single right rotation."},{term:"RR case",def:"Inserted into the right subtree of the right child. Fix: single left rotation."},{term:"LR case",def:"Inserted into the right subtree of the left child. Fix: left rotation on the child, then right rotation on the node."},{term:"RL case",def:"Inserted into the left subtree of the right child. Fix: right rotation on the child, then left rotation on the node."},{term:"Double rotation",def:"Two single rotations in sequence, needed for the LR and RL cases."},{term:"Self-balancing BST",def:"A BST that restructures itself on insert and delete to keep height O(log n): AVL, red-black, splay."}],mnemonics:[{title:"Name it by the path",text:"Walk from the unbalanced node towards the new key: the first two turns (L or R) are the case name."},{title:"Straight line: one turn. Zig-zag: two",text:"LL and RR are straight lines and need ONE rotation. LR and RL zig-zag and need TWO."},{title:"Rotate opposite to the heavy side",text:"Left-heavy (LL)? Rotate RIGHT. Right-heavy (RR)? Rotate LEFT."},{title:"Double = straighten, then fix",text:"For LR or RL, the first rotation at the child straightens the zig-zag into LL or RR; the second fixes it."},{title:"Inorder never changes",text:"If your inorder sequence changed after a rotation, you rotated wrongly."}],pitfalls:["Computing BF as right \u2212 left. The notes use left \u2212 right, so a left-heavy node is +2.","Rotating at the root instead of at the lowest unbalanced node.","Using a single rotation for a zig-zag (LR or RL). It just produces the mirror image, still unbalanced.","Forgetting to move the middle subtree (B) across during a rotation, which loses nodes or breaks the BST rule.","Forgetting to update the heights of the rotated nodes (the lower one first, then the new subtree root).","Mixing up height conventions (leaf = 0 or leaf = 1) halfway through a trace.","Thinking AVL makes search O(1). It makes the worst case O(log n), the same as a balanced BST."],examples:[{title:"Balance factors by hand",problem:"Insert 45, 20, 70, 10, 30, 60, 90, 25, 35, 65 into a plain BST. Is it an AVL tree?",steps:["Heights (edges): leaves 10, 25, 35, 65, 90 have height 0.","30: children both height 0 \u2192 height 1, BF 0. 60: left \u22121, right 0 \u2192 height 1, BF \u22121.","20: left 0 (10), right 1 (30) \u2192 height 2, BF \u22121. 70: left 1 (60), right 0 (90) \u2192 height 2, BF +1.","45: left 2, right 2 \u2192 BF 0."],answer:"Every BF is \u22121, 0 or +1, so it is already a valid AVL tree with no rotations."},{title:"Trace all four rotations",problem:"Insert 10, 20, 90, 80, 40, 70, 15 into an empty AVL tree and name each rotation.",steps:["90: 10 has BF \u22122, path R, R \u2192 RR, left rotate at 10. Tree 20 (10, 90).","80: goes left of 90. BFs: 90 is +1, 20 is \u22121. Fine.","40: left of 80. 90 has BF +2, path L, L \u2192 LL, right rotate at 90. Tree 20 (10, 80 (40, 90)).","70: right of 40. 20 has BF \u22122, path R then L \u2192 RL: right rotate at 80, then left rotate at 20. Tree 40 (20 (10), 80 (70, 90)).","15: right of 10. 20 has BF +2, path L then R \u2192 LR: left rotate at 10, then right rotate at 20. Tree 40 (15 (10, 20), 80 (70, 90))."],answer:"RR, LL, RL, LR. Final preorder 40, 15, 10, 20, 80, 70, 90; height 2."},{title:"An RL inside a bigger tree",problem:"Insert 27 into the AVL tree built from 45, 20, 70, 10, 30, 60, 90, 25, 35, 65.",steps:["27 goes 45 \u2192 20 \u2192 30 \u2192 25 \u2192 right of 25.","Walk up: 25 BF \u22121, 30 BF +1, 20: left height 0, right height 2 \u2192 BF \u22122.","Path from 20: Right (to 30), then Left (to 25) \u2192 RL.","Right rotate at 30: 25 moves up with 30 as its right child (27 becomes 30's left child).","Left rotate at 20: 25 moves up with 20 on its left."],answer:"The left subtree of 45 becomes 25 (20 (10, \u2013), 30 (27, 35)). The whole tree keeps height 3."},{title:"Sorted input",problem:"Insert 10, 20, 30, 40, 50 into an AVL tree. Compare its height with a plain BST.",steps:["30: RR at 10 \u2192 20 (10, 30).","40: right of 30. BFs fine (20 is \u22121).","50: 30 has BF \u22122, RR at 30 \u2192 40 (30, 50). Tree 20 (10, 40 (30, 50))."],answer:"AVL height 2 with root 20; the plain BST is a chain of height 4."}],exercises:[{q:"Insert 50, 40, 30, 60, 70, 65, 10, 20 into an empty AVL tree. Name each rotation and give the final preorder.",solution:"30: LL at 50 \u2192 40 (30, 50). 70: RR at 50 \u2192 40 (30, 60 (50, 70)). 65: 40 has BF \u22122, path R (60), R (70) \u2192 RR at 40 \u2192 60 (40 (30, 50), 70 (65, \u2013)). 10: no rotation. 20: LR at 30 \u2192 20 (10, 30). Final preorder: **60, 40, 20, 10, 30, 50, 70, 65**. Height 3 (plain BST: 4)."},{q:"Insert 40, 20, 60, 10, 30, 25. Which rotation happens and what is the new root?",solution:"25 goes 40 \u2192 20 \u2192 30 \u2192 left of 30. 40 has BF +2 and the path is L (20) then R (30): **LR at 40**. Left rotate at 20 (30 moves up), then right rotate at 40. New root **30**, with 20 (10, 25) on the left and 40 (\u2013, 60) on the right."},{q:"Draw the result of a right rotation at y where y has left child x, x has children A and B, and y has right child C.",solution:"x becomes the subtree root. Its left child is A, its right child is y. y keeps C as its right child and takes B as its new left child. Inorder A, x, B, y, C is unchanged."},{q:"What is the minimum number of nodes in an AVL tree of height 3? Of height 4?",solution:"N(0) = 1, N(1) = 2, N(h) = N(h \u2212 1) + N(h \u2212 2) + 1. N(2) = 4, N(3) = 7, N(4) = 12."},{q:"Explain why a single rotation does not fix the LR case.",solution:"In LR the new key is in the middle (between the child and the node). A single right rotation at the node moves the child up but makes the node its right child while the heavy middle subtree moves across to the node, giving a mirror-image RL imbalance. Rotating left at the child first turns the zig-zag into a straight LL line, which one right rotation then fixes."},{q:"Write the code for the LR case given rotateLeft and rotateRight.",solution:[{t:"code",java:`if (bf(n) > 1 && key > n.left.key) {   // left-heavy, new key went right of the left child
    n.left = rotateLeft(n.left);        // straighten into LL
    return rotateRight(n);              // fix LL
}`}]},{q:"A plain BST holds 1 000 000 keys inserted in sorted order. How many comparisons does an unsuccessful search need in the worst case? How many in an AVL tree?",solution:"Plain BST: a chain of 1 000 000 nodes, so up to 1 000 000 comparisons. AVL: height at most about 1.44 log\u2082 10\u2076 \u2248 29, so about 29 comparisons (a perfect tree would need 20)."}],quiz:[{type:"mcq",q:"In an AVL tree, every node's balance factor must be:",options:["0","\u22121 or +1","\u22121, 0 or +1","Between \u22122 and +2"],answer:2,explain:"\xB12 triggers a rotation."},{type:"mcq",q:"Inserting 30, 20, 10 into an empty AVL tree causes which case?",options:["LL","RR","LR","RL"],answer:0,explain:"Left, then left from 30."},{type:"mcq",q:"Inserting 10, 30, 20 into an empty AVL tree causes which case?",options:["LL","RR","LR","RL"],answer:3,explain:"Right to 30, then left to 20."},{type:"mcq",q:"The LR case is fixed by:",options:["One right rotation","One left rotation","Left rotation at the left child, then right rotation at the node","Right rotation at the left child, then left rotation at the node"],answer:2,explain:"Straighten into LL, then rotate right."},{type:"mcq",q:"A node has left subtree height 2 and right subtree height 0. Its BF is:",options:["\u22122","0","+2","+1"],answer:2,explain:"Left \u2212 right = 2 \u2212 0."},{type:"complexity",q:"Worst-case search in an AVL tree with n nodes:",options:["O(1)","O(log n)","O(n)","O(n log n)"],answer:1,explain:"Height is at most about 1.44 log\u2082 n."},{type:"complexity",q:"Cost of a single rotation:",options:["O(1)","O(log n)","O(n)","O(h)"],answer:0,explain:"A fixed number of pointer changes."},{type:"tf",q:"A rotation changes the inorder sequence of the tree.",options:["True","False"],answer:1,explain:"Rotations preserve the BST order."},{type:"tf",q:"After an AVL insertion, at most one single or double rotation is needed.",options:["True","False"],answer:0,explain:"Fixing the lowest unbalanced node restores the subtree's old height."},{type:"mcq",q:"Root of the AVL tree after inserting 10, 20, 90, 80, 40, 70, 15:",options:["10","20","40","80"],answer:2,explain:"The RL rotation at 20 lifts 40 to the root."},{type:"mcq",q:"Height of an AVL tree after inserting 1, 2, 3, 4, 5, 6, 7 (edges):",options:["2","3","4","6"],answer:0,explain:"It ends as a perfect tree rooted at 4."},{type:"output",q:"What does this print?",code:`int hl = 2, hr = 0;          // heights of the left and right subtrees
int bf = hl - hr;
System.out.println(bf + (Math.abs(bf) > 1 ? " rotate" : " balanced"));`,options:["2 rotate","2 balanced","-2 rotate","0 balanced"],answer:0,explain:"BF = 2 \u2212 0 = 2, which is outside \u22121..+1, so the node needs a rotation (an LL or LR case)."},{type:"mcq",q:"Which Java collection is backed by a self-balancing BST?",options:["HashMap","ArrayList","TreeMap","PriorityQueue"],answer:2,explain:"TreeMap uses a red-black tree."},{type:"mcq",q:"Inserting 68 into the AVL tree 45/20/70/10/30/60/90/25/35/65 unbalances 60 (BF \u22122) and 70 (BF +2). Where do you rotate?",options:["At 45","At 70","At 60","At 65"],answer:2,explain:"Always fix the lowest unbalanced node first (RR at 60)."}]},Lx={id:"SO8",ready:!0,title:"Short test",summary:"Exam-style practice for the in-class short test: mixed questions on recursion, stacks, queues, priority queues, trees, AVL rotations and sorting, with mark-by-mark solutions.",why:"The short test is a timed rehearsal for the T2 written test. The questions are short, but each one checks whether you can produce a trace, a piece of code or a Big-O with a reason under pressure. Practising in that format is the best predictor of your test mark.",visualizers:[],notes:[{t:"h",text:"What to expect"},{t:"list",items:["Short questions worth 2 to 10 marks each, mixing theory, traces and code.","Traces must show **intermediate states**: the array after each pass, the stack after each token, front and rear after each operation.","Code can be in Java or another object-oriented language. Clear structure matters more than perfect syntax, but include the empty and full checks.",'Big-O answers need a **reason**: "O(n log n) because the outer loop runs n times and the inner loop multiplies j by 3" earns the marks; "O(n log n)" alone may get one.']},{t:"h",text:"A timing plan"},{t:"table",head:["Marks","Time to spend","Typical question"],rows:[["2 to 3","2 to 4 minutes","Definition, Big-O of one excerpt, one traversal"],["5","6 to 8 minutes","One method (push, peek, isEmpty), a circular queue state, a heap insert"],["10 to 12","12 to 15 minutes","Full sorting trace, AVL insert sequence, full class"]]},{t:"callout",kind:"tip",title:"The three-line habit",text:"For every question, write (1) the rule or definition, (2) the working, (3) the answer with its complexity. Markers have a column for each."},{t:"h",text:"Formula checklist"},{t:"table",head:["Topic","Must know"],rows:[["Recursion","Base case + recursive case; recursive factorial O(n) time, O(n) space; iterative O(1) space"],["Big-O","Sequential loops add, nested loops multiply; j *= k gives log n; drop constants"],["Stack","push data[++top], pop data[top--], empty top == \u22121, full top == capacity \u2212 1"],["Circular queue","next = (i + 1) % capacity; empty count == 0; full count == capacity"],["Heap","children 2i + 1, 2i + 2; parent (i \u2212 1)/2; last non-leaf \u230An/2\u230B \u2212 1"],["BST / AVL","Inorder sorted; BF = h(left) \u2212 h(right); LL\u2192right, RR\u2192left, LR, RL double"],["Sorting","Quick: middle pivot, i stops at \u2265 pivot, j stops at \u2264 pivot; heap: build max-heap then swap root with last"]]}],concepts:[],mnemonics:[{title:"Rule, work, answer",text:"Every answer: state the RULE, show the WORK, box the ANSWER (with Big-O where relevant)."},{title:"Marks per minute",text:"Roughly one mark per minute, plus a few minutes to check. A 10-mark trace deserves 10 to 12 minutes, not 25."}],pitfalls:["Writing only the final sorted array in a trace question.","Giving a Big-O without saying what n is or why.","Forgetting the empty check in pop, dequeue or peek.","Spending half the test on one long question and leaving short ones blank.","Using the wrong height convention between parts of the same AVL question."],examples:[{title:"Circular queue state (5 marks)",problem:"A circular queue of capacity 6 starts with front = 0, rear = \u22121, count = 0. Enqueue 1, 2, 3, 4, 5, 6, dequeue three times, then enqueue 7 and 8. Give front, rear, count and the array.",steps:["Six enqueues fill indices 0 to 5: rear = 5, count = 6.","Three dequeues return 1, 2, 3: front = 3, count = 3.","enqueue 7: rear = (5 + 1) % 6 = 0. enqueue 8: rear = 1. count = 5."],answer:"front = 3, rear = 1, count = 5, array [7, 8, _, 4, 5, 6]. Queue order: 4, 5, 6, 7, 8."},{title:"Build a max-heap (6 marks)",problem:"Build a max-heap from {15, 3, 18, 7, 20, 9} using bottom-up heapify, then show the first extraction of heap sort.",steps:["n = 6, start at index \u230A6/2\u230B \u2212 1 = 2: 18 vs child 9, no swap.","Index 1: 3 vs children 7 and 20: swap with 20 \u2192 [15, 20, 18, 7, 3, 9].","Index 0: 15 vs 20 and 18: swap with 20 \u2192 [20, 15, 18, 7, 3, 9]. 15 vs 7 and 3: stays.","Extraction 1: swap 20 with the last item 9 \u2192 [9, 15, 18, 7, 3 | 20]. Sift 9 down: swap with 18 \u2192 [18, 15, 9, 7, 3 | 20]."],answer:"Max-heap [20, 15, 18, 7, 3, 9]; after one extraction [18, 15, 9, 7, 3 | 20]."},{title:"Big-O of a triangular loop (3 marks)",problem:"Give the Big-O of `for (i = 0; i < n; i++) for (j = 0; j < i; j++) count++;` and the exact count for n = 10.",steps:["The inner loop runs 0, 1, 2, \u2026, n \u2212 1 times.","Total = n(n \u2212 1)/2.","For n = 10: 45."],answer:"O(n\xB2); 45 increments for n = 10."},{title:"Quick sort, first partition only (4 marks)",problem:"Show the first partition of {5, 1, 4, 2, 3} with the middle element as pivot and the Hoare i/j scan.",steps:["Pivot = a[2] = 4. i = 0, j = 4.","i: a[0] = 5 is not < 4, stop at 0. j: a[4] = 3 is not > 4, stop at 4. Swap \u2192 [3, 1, 4, 2, 5], i = 1, j = 3.","i: 1 < 4, move to 2; a[2] = 4 stop. j: a[3] = 2 stop. Swap \u2192 [3, 1, 2, 4, 5], i = 3, j = 2.","i > j: done. Recurse on [0..2] = [3, 1, 2] and [3..4] = [4, 5]."],answer:"[3, 1, 2, 4, 5] after the first partition."},{title:"AVL insert (5 marks)",problem:"Insert 40, 20, 60, 10, 30, 25 into an AVL tree. Name the rotation and give the level-order of the result.",steps:["After 40, 20, 60, 10, 30 the tree is balanced: 40 (20 (10, 30), 60).","25 goes left of 30. 40 now has BF +2.","Path from 40: L (20) then R (30): LR case.","Left rotate at 20 (30 moves up), then right rotate at 40."],answer:"LR at 40. Level-order 30, 20, 40, 10, 25, 60."}],exercises:[{q:"(3 marks) Give the Big-O of `for (i = 1; i < n; i = i * 2) for (j = 0; j < 100; j++) x++;`",solution:"The outer loop doubles i, so it runs about log\u2082 n times. The inner loop runs a constant 100 times. O(100 log n) = **O(log n)**."},{q:"(5 marks) Write `peek()` and `isFull()` for an array stack where top starts at \u22121.",solution:[{t:"code",java:`public int peek() {
    if (top == -1) throw new IllegalStateException("Stack is empty");
    return data[top];
}
public boolean isFull() { return top == data.length - 1; }`}]},{q:"(4 marks) Evaluate 4 5 + 3 * 6 \u2212 and give the stack after each operator.",solution:"+ \u2192 [9]; then push 3, * \u2192 [27]; push 6, \u2212 \u2192 [21]. Answer **21**."},{q:"(4 marks) Convert (A \u2212 B) * (C + D) to postfix.",solution:"A B \u2212 C D + *"},{q:"(4 marks) Give the inorder, preorder and postorder of the BST built from 8, 3, 10, 1, 6, 14, 4, 7.",solution:"Inorder 1, 3, 4, 6, 7, 8, 10, 14. Preorder 8, 3, 1, 6, 4, 7, 10, 14. Postorder 1, 4, 7, 6, 3, 14, 10, 8."},{q:"(3 marks) Insert 12 into the min-heap [5, 9, 7, 15, 10]. Give the array.",solution:"12 goes to index 5, whose parent is index 2 (7). 12 > 7, so no swap: **[5, 9, 7, 15, 10, 12]**."},{q:"(6 marks) Show selection sort on {64, 25, 12, 22, 11}, giving the array after each pass, and state its comparison count.",solution:"[11, 25, 12, 22, 64] \u2192 [11, 12, 25, 22, 64] \u2192 [11, 12, 22, 25, 64] \u2192 [11, 12, 22, 25, 64]. Always n(n \u2212 1)/2 = 10 comparisons, whatever the input."},{q:"(4 marks) Explain why a circular queue is preferred over a static array queue that shifts.",solution:"Shifting makes every dequeue O(n). A circular queue moves only the front index with (front + 1) % capacity, so dequeue is O(1), and it reuses freed cells so there is no false full condition."},{q:"(5 marks) Insert 3, 2, 1, 4, 5 into an AVL tree. Name each rotation and give the final preorder.",solution:"1: LL at 3 \u2192 2 (1, 3). 4: no rotation. 5: RR at 3 \u2192 4 (3, 5). Final 2 (1, 4 (3, 5)); preorder **2, 1, 4, 3, 5**."},{q:"(4 marks) Is heap sort stable? Give a two-element example.",solution:"No. With [2a, 2b] as a max-heap (equal keys), extraction swaps the root 2a with the last element 2b, giving [2b, 2a]: the two equal keys have swapped their original order."}],quiz:[{type:"complexity",q:"`for (i = n; i > 0; i = i / 2) x++;`",options:["O(1)","O(log n)","O(n)","O(n log n)"],answer:1,explain:"i halves each time."},{type:"complexity",q:"`for (i = 0; i < n; i++) for (j = 0; j < i; j++) x++;`",options:["O(n)","O(n log n)","O(n\xB2)","O(2\u207F)"],answer:2,explain:"n(n \u2212 1)/2 iterations."},{type:"output",q:"What does this print?",code:`Deque<Integer> s = new ArrayDeque<>();
Queue<Integer> q = new ArrayDeque<>();
for (int i = 1; i <= 3; i++) { s.push(i); q.offer(i); }
System.out.println(s.pop() + " " + q.poll());`,options:["1 1","3 3","3 1","1 3"],answer:2,explain:"Stack is LIFO (3), queue is FIFO (1)."},{type:"mcq",q:"Capacity 6, front = 3, rear = 5. After two enqueues, rear is:",options:["7","1","0","2"],answer:1,explain:"(5 + 1) % 6 = 0, then (0 + 1) % 6 = 1."},{type:"mcq",q:"The value of 4 5 + 3 * 6 \u2212 is:",options:["21","27","15","33"],answer:0,explain:"(4 + 5) \xD7 3 \u2212 6 = 21."},{type:"mcq",q:"Bottom-up heapify of {15, 3, 18, 7, 20, 9} gives:",options:["[20, 18, 15, 3, 7, 9]","[20, 15, 18, 7, 3, 9]","[20, 15, 18, 3, 7, 9]","[18, 15, 20, 7, 3, 9]"],answer:1,explain:"3 swaps with 20, then 15 swaps with 20. (Inserting one at a time gives the first option.)"},{type:"mcq",q:"Inorder of the BST built from 8, 3, 10, 1, 6, 14, 4, 7:",options:["8, 3, 1, 6, 4, 7, 10, 14","1, 3, 4, 6, 7, 8, 10, 14","1, 4, 7, 6, 3, 14, 10, 8","8, 3, 10, 1, 6, 14, 4, 7"],answer:1,explain:"Inorder of a BST is sorted."},{type:"mcq",q:"Inserting 40, 20, 60, 10, 30, 25 into an AVL tree makes which node the root?",options:["40","20","30","25"],answer:2,explain:"LR at 40 lifts 30."},{type:"tf",q:"Selection sort makes n(n \u2212 1)/2 comparisons even on a sorted array.",options:["True","False"],answer:0,explain:"It always scans the whole unsorted part."},{type:"tf",q:"Merge sort runs in O(n log n) in its worst case.",options:["True","False"],answer:0,explain:"It always splits in half and merges in linear time."},{type:"mcq",q:"First partition of {5, 1, 4, 2, 3} with the middle pivot (Hoare scan) gives:",options:["[3, 1, 2, 4, 5]","[1, 2, 3, 4, 5]","[3, 1, 4, 2, 5]","[2, 1, 3, 4, 5]"],answer:0,explain:"Swap 5\u21943, then 4\u21942."},{type:"complexity",q:"Worst case of quick sort:",options:["O(n)","O(n log n)","O(n\xB2)","O(log n)"],answer:2,explain:"Every pivot is an extreme value."},{type:"mcq",q:"Which pair of operations is O(1) in a linked queue with front and rear references?",options:["enqueue and dequeue","Only enqueue","Only dequeue","Neither"],answer:0,explain:"Add after rear, remove at front."},{type:"mcq",q:"Which structure gives O(log n) insert and O(log n) extract-min?",options:["Sorted array","Unsorted linked list","Binary heap","Stack"],answer:2,explain:"Sift up and sift down each walk one path."},{type:"mcq",q:"Space complexity of recursive factorial(n):",options:["O(1)","O(log n)","O(n)","O(n\xB2)"],answer:2,explain:"One frame per pending call."}]},Cx={id:"SO9",ready:!0,title:"Sorting algorithms and analysis",summary:"Selection, insertion, merge, quick (middle pivot, Hoare scan) and heap sort with full traces on the lecturer's arrays, a note on shell sort, counting and radix sort, a comparison table, and why comparison sorts cannot beat n log n.",why:"Questions 3 and 4 of the 2023 test are 40 marks of quick sort and heap sort on {90, 23, 5, 109, 12, 22, 67, 34}, including the asymptotic analysis. Every database ORDER BY, spreadsheet sort and search index relies on these algorithms, and knowing their trade-offs (stability, memory, worst case) is what lets you pick the right one.",visualizers:["sorting","heap"],notes:[{t:"h",text:"1. Words you need"},{t:"table",head:["Term","Meaning"],rows:[["In place","Uses only O(1) (or O(log n) stack) extra memory beyond the array"],["Stable","Equal keys keep their original relative order (important when sorting records by a second field)"],["Comparison sort","Decides the order only by comparing pairs of keys"],["Adaptive","Runs faster on input that is already nearly sorted"]]},{t:"h",text:"2. Selection sort"},{t:"p",text:"Find the smallest item in the unsorted part and swap it to the front of that part. Repeat n \u2212 1 times. It always makes n(n \u2212 1)/2 comparisons but at most n \u2212 1 swaps, which helps when writes are expensive. Not stable: the long-distance swap can jump an item over its equal twin."},{t:"table",head:["Pass","Minimum found","Array after the pass"],rows:[["Start","","[90, 23, 5, 109, 12]"],["1","5","[5, 23, 90, 109, 12]"],["2","12","[5, 12, 90, 109, 23]"],["3","23","[5, 12, 23, 109, 90]"],["4","90","[5, 12, 23, 90, 109]"]]},{t:"p",text:"10 comparisons and 4 swaps for n = 5."},{t:"h",text:"3. Insertion sort"},{t:"p",text:"Take the next item and slide it left into its place among the already-sorted items, shifting larger ones right. Stable, in place and adaptive: O(n) on sorted input, O(n\xB2) on reversed input. It is the fastest simple sort for small or nearly sorted arrays, which is why library sorts switch to it for small sub-arrays. The trace on {90, 23, 5, 109, 12} is in SO1."},{t:"code",title:"Selection and insertion sort",java:`static void selectionSort(int[] a) {
    for (int i = 0; i < a.length - 1; i++) {
        int min = i;
        for (int j = i + 1; j < a.length; j++)
            if (a[j] < a[min]) min = j;
        int t = a[i]; a[i] = a[min]; a[min] = t;    // one swap per pass
    }
}

]},{t:"callout",kind:"warn",title:"A slip in one version of the practice solutions",text:"At the partition of [9, 7, 5, 3, 6, 2, 10] around 3, one version of the 2026 practice solutions lists the parts as [2] and [3, 5, 7, 6, 9, 10]. With the Hoare scan the loop ends with i = 2 and j = 1, so the parts are [0..1] = **[2, 3]** and [2..6] = **[5, 7, 6, 9, 10]**. The final sorted array is the same either way. Some other study guides use the Lomuto partition (pivot moved to the end); that gives different intermediate arrays, so use the middle-pivot Hoare scan that the lecturer's solutions use."},{t:"table",head:["Quick sort case","When","Time"],rows:[["Best","Every pivot splits its range in half: log\u2082 n levels \xD7 O(n) work per level","O(n log n)"],["Average","Random data: splits are reasonably balanced (about 1.39 n log\u2082 n comparisons)","O(n log n)"],["Worst","Every pivot is the smallest or largest: n levels, n + (n \u2212 1) + \u2026 \u2248 n\xB2/2","O(n\xB2)"],["Space","Recursion stack","O(log n) average, O(n) worst"]]},{t:"p",text:"The middle pivot makes already-sorted input a **best** case (it splits evenly), which is exactly where a first-element pivot fails. Specially crafted inputs can still force O(n\xB2), which is why library versions use median-of-three or random pivots. Quick sort is not stable, but in practice it is usually the fastest comparison sort because its inner loops are tight and cache-friendly."},{t:"h",text:"6. Heap sort"},{t:"p",text:"Two phases, both in place in the same array (see SO5 for heaps):"},{t:"ol",items:["**Build a max-heap** with bottom-up heapify: sift down every non-leaf from index \u230An/2\u230B \u2212 1 back to 0. O(n).","**Extract repeatedly:** swap the root (the maximum) with the last item of the heap, shrink the heap by one (that maximum is now in its final place), and sift the new root down. n \u2212 1 times, O(log n) each."]},{t:"code",title:"Heap sort",java:`static void heapSort(int[] a) {
    int n = a.length;
    for (int i = n / 2 - 1; i >= 0; i--) siftDown(a, n, i);    // phase 1: build max-heap, O(n)
    for (int end = n - 1; end > 0; end--) {                     // phase 2: n - 1 extractions
        int t = a[0]; a[0] = a[end]; a[end] = t;                // max goes to its final place
        siftDown(a, end, 0);                                    // repair the smaller heap, O(log n)
    }
}

static void siftDown(int[] a, int n, int i) {
    while (true) {
        int l = 2 * i + 1, r = 2 * i + 2, big = i;
        if (l < n && a[l] > a[big]) big = l;
        if (r < n && a[r] > a[big]) big = r;
        if (big == i) return;
        int t = a[i]; a[i] = a[big]; a[big] = t;
        i = big;
    }
}`,python:`def heap_sort(a):
    n = len(a)
    for i in range(n // 2 - 1, -1, -1):
        sift_down(a, n, i)
    for end in range(n - 1, 0, -1):
        a[0], a[end] = a[end], a[0]
        sift_down(a, end, 0)

def sift_down(a, n, i):
    while True:
        l, r, big = 2 * i + 1, 2 * i + 2, i
        if l < n and a[l] > a[big]: big = l
        if r < n and a[r] > a[big]: big = r
        if big == i:
            return
        a[i], a[big] = a[big], a[i]
        i = big`},{t:"p",text:"**Phase 1 on {90, 23, 5, 109, 12, 22, 67, 34}** (2023 test, Question 4). n = 8, so start at index 3:"},{t:"table",head:["Sift down at","What happens","Array"],rows:[["Index 3 (109)","Only child 34 is smaller: no swap","[90, 23, 5, 109, 12, 22, 67, 34]"],["Index 2 (5)","Children 22 and 67: swap with 67","[90, 23, 67, 109, 12, 22, 5, 34]"],["Index 1 (23)","Children 109 and 12: swap with 109; then 23 vs child 34: swap","[90, 109, 67, 34, 12, 22, 5, 23]"],["Index 0 (90)","Children 109 and 67: swap with 109; then 90 vs 34 and 12: stays","[109, 90, 67, 34, 12, 22, 5, 23]"]]},{t:"diagram",id:"heaparray",caption:"The max-heap after phase 1: [109, 90, 67, 34, 12, 22, 5, 23]."},{t:"p",text:"**Phase 2** (the bar | separates the heap from the sorted tail):"},{t:"table",head:["Step","Swap root with last","Sift down","Array afterwards"],rows:[["1","109 \u2194 23","23 \u2194 90, 23 \u2194 34","[90, 34, 67, 23, 12, 22, 5 | 109]"],["2","90 \u2194 5","5 \u2194 67, 5 \u2194 22","[67, 34, 22, 23, 12, 5 | 90, 109]"],["3","67 \u2194 5","5 \u2194 34, 5 \u2194 23","[34, 23, 22, 5, 12 | 67, 90, 109]"],["4","34 \u2194 12","12 \u2194 23","[23, 12, 22, 5 | 34, 67, 90, 109]"],["5","23 \u2194 5","5 \u2194 22","[22, 12, 5 | 23, 34, 67, 90, 109]"],["6","22 \u2194 5","5 \u2194 12","[12, 5 | 22, 23, 34, 67, 90, 109]"],["7","12 \u2194 5","\u2013","[5 | 12, 22, 23, 34, 67, 90, 109]"]]},{t:"p",text:"**On {90, 23, 5, 109, 12}**: start at index 1: 23 swaps with 109 \u2192 [90, 109, 5, 23, 12]; index 0: 90 swaps with 109 \u2192 max-heap [109, 90, 5, 23, 12]. Then 109 \u2194 12 and sift (12 \u2194 90, 12 \u2194 23) \u2192 [90, 23, 5, 12 | 109]; 90 \u2194 12 and sift (12 \u2194 23) \u2192 [23, 12, 5 | 90, 109]; 23 \u2194 5 and sift (5 \u2194 12) \u2192 [12, 5 | 23, 90, 109]; 12 \u2194 5 \u2192 [5, 12, 23, 90, 109]."},{t:"p",text:"**Analysis:** building the heap is O(n); each of the n \u2212 1 extractions sifts down at most log\u2082 n levels, so the total is **O(n log n) in the best, average and worst case**, with **O(1)** extra space. It is not stable. Heap sort is the choice when you need a guaranteed worst case without extra memory; quick sort is usually faster on average."},{t:"h",text:"7. Shell sort (for reference)"},{t:"p",text:"Shell sort is insertion sort on items a **gap** apart, with the gap shrinking to 1. Large gaps move items long distances early, so the final gap-1 pass has little work. With gaps 4, 2, 1 on {90, 23, 5, 109, 12, 22, 67, 34} the array becomes [12, 22, 5, 34, 90, 23, 67, 109], then [5, 22, 12, 23, 67, 34, 90, 109], then sorted. Its running time depends on the gap sequence (around O(n^1.5) for common ones); it is in place and not stable."},{t:"h",text:"8. Sorting without comparisons: counting and radix sort"},{t:"p",text:"**Counting sort** works for small integer keys in a known range 0..k. Count how often each key occurs, turn the counts into running totals (the final positions), then place each item, scanning the input from right to left to keep it stable. Time and space **O(n + k)**."},{t:"table",head:["Counting sort on [4, 2, 2, 8, 3, 3, 1]","Values"],rows:[["Counts for keys 0..8","[0, 1, 2, 2, 1, 0, 0, 0, 1]"],["Running totals","[0, 1, 3, 5, 6, 6, 6, 6, 7]"],["Output","[1, 2, 2, 3, 3, 4, 8]"]]},{t:"p",text:"**Radix sort** (least significant digit first) sorts by the units digit, then the tens, then the hundreds, using a **stable** sort (counting sort) for each digit. With d digits it costs **O(d(n + b))** for base b."},{t:"table",head:["Radix pass on [170, 45, 75, 90, 802, 24, 2, 66]","Result"],rows:[["Units digit","[170, 90, 802, 2, 24, 45, 75, 66]"],["Tens digit","[802, 2, 24, 45, 66, 170, 75, 90]"],["Hundreds digit","[2, 24, 45, 66, 75, 90, 170, 802]"]]},{t:"h",text:"9. The comparison table"},{t:"table",head:["Algorithm","Best","Average","Worst","Extra space","Stable","In place"],rows:[["Bubble","O(n)*","O(n\xB2)","O(n\xB2)","O(1)","Yes","Yes"],["Selection","O(n\xB2)","O(n\xB2)","O(n\xB2)","O(1)","No","Yes"],["Insertion","O(n)","O(n\xB2)","O(n\xB2)","O(1)","Yes","Yes"],["Shell","\u2248 O(n log n)","depends on gaps","\u2248 O(n^1.5)","O(1)","No","Yes"],["Merge","O(n log n)","O(n log n)","O(n log n)","O(n)","Yes","No"],["Quick (middle pivot)","O(n log n)","O(n log n)","O(n\xB2)","O(log n) stack","No","Yes"],["Heap","O(n log n)","O(n log n)","O(n log n)","O(1)","No","Yes"],["Counting","O(n + k)","O(n + k)","O(n + k)","O(n + k)","Yes","No"],["Radix (LSD)","O(d(n + b))","O(d(n + b))","O(d(n + b))","O(n + b)","Yes","No"]]},{t:"p",text:"* Bubble sort is O(n) on sorted input only with the early-exit swapped flag."},{t:"h",text:"10. Why comparison sorts cannot beat n log n"},{t:"p",text:"Any comparison sort can be drawn as a **decision tree**: each internal node is one comparison, each leaf is one possible final ordering. There are **n!** orderings, so the tree needs at least n! leaves. A binary tree with n! leaves has height at least **log\u2082(n!)**, and log\u2082(n!) \u2248 n log\u2082 n \u2212 1.44n, which is \u03A9(n log n). So in the worst case **every** comparison sort needs on the order of n log n comparisons. For n = 10 that is at least \u2308log\u2082 3 628 800\u2309 = 22 comparisons."},{t:"p",text:"Merge sort and heap sort meet this bound, so they are **asymptotically optimal** comparison sorts. Counting and radix sort escape the bound only because they do not compare keys; they read the digits directly, which needs integer keys of limited range."},{t:"callout",kind:"tip",title:"What Java actually uses",text:"`Arrays.sort(int[])` uses dual-pivot quick sort (fast, not stable, fine for primitives). `Arrays.sort(Object[])` and `Collections.sort` use TimSort, a merge and insertion sort hybrid that is stable and adaptive, because objects often need stability."}],concepts:[{term:"Stable sort",def:"A sort that keeps equal keys in their original relative order."},{term:"In-place sort",def:"A sort that needs only O(1) extra memory (quick sort's O(log n) stack is usually accepted)."},{term:"Comparison sort",def:"A sort that orders items only by comparing pairs of keys."},{term:"Selection sort",def:"Repeatedly selects the minimum of the unsorted part and swaps it into place. Always O(n\xB2)."},{term:"Insertion sort",def:"Inserts each item into the sorted prefix by shifting larger items right. O(n) best, O(n\xB2) worst."},{term:"Merge sort",def:"Splits in half, sorts each half recursively and merges them. O(n log n) always, O(n) extra space."},{term:"Quick sort",def:"Partitions around a pivot and sorts both parts recursively. O(n log n) average, O(n\xB2) worst."},{term:"Pivot",def:"The value a partition is built around. The lecturer uses the middle element."},{term:"Hoare partition",def:"Two indices scan inward from both ends and swap out-of-place pairs until they cross."},{term:"Heap sort",def:"Builds a max-heap, then repeatedly swaps the root to the end and sifts down. O(n log n) always, O(1) space."},{term:"Shell sort",def:"Insertion sort over shrinking gaps; in place, not stable, about O(n^1.5) with common gaps."},{term:"Counting sort",def:"Counts occurrences of each small integer key and uses running totals to place items. O(n + k)."},{term:"Radix sort",def:"Sorts digit by digit (least significant first) with a stable sort per digit. O(d(n + b))."},{term:"Decision tree",def:"A model of a comparison sort: internal nodes are comparisons, leaves are final orderings."},{term:"Lower bound \u03A9(n log n)",def:"Any comparison sort needs at least log\u2082(n!) \u2248 n log\u2082 n comparisons in the worst case."}],mnemonics:[{title:"Selection selects, insertion inserts",text:"Selection SELECTS the smallest and swaps it in. Insertion INSERTS the next card into the sorted hand."},{title:"Merge needs a table, heap needs none",text:"Merge sort needs an extra table (O(n) space) to merge onto. Heap sort works in the same array (O(1))."},{title:"i likes small, j likes big",text:"In the Hoare scan, i keeps moving while items are SMALLER than the pivot; j keeps moving while items are BIGGER. Each stops at a misfit."},{title:"Build, then swap and sink",text:"Heap sort: BUILD the max-heap, then SWAP the root to the end and SINK the new root. Repeat."},{title:"Stable crew: BIM-CR",text:"Bubble, Insertion, Merge, Counting, Radix are stable. Selection, Quick, Heap, Shell are not."},{title:"n log n is the floor",text:"No sort that only compares can beat n log n in the worst case. Only counting tricks get under the floor."}],pitfalls:["Using the first or last element as the pivot when the question says middle.","Using the Lomuto partition (pivot swapped to the end) in a trace when the lecturer's method is the Hoare scan. The intermediate arrays will not match the memo.","Stopping i at items \u2264 pivot instead of items \u2265 pivot (or j the other way round). Both pointers must stop at the pivot value itself.","In heap sort, starting the build at index 0 or n \u2212 1 instead of \u230An/2\u230B \u2212 1, or building a min-heap (which sorts descending).","Forgetting to shrink the heap after each swap, so the sorted tail gets sifted back into the heap.","Saying merge sort is in place. The standard version needs an O(n) buffer.","Saying quick sort is O(n log n) in all cases. Its worst case is O(n\xB2).","Claiming counting sort is always better because it is O(n + k). If k is huge (keys up to 10\u2079) it is hopeless.","Calling a sort stable when it swaps over long distances (selection, quick, heap)."],examples:[{title:"Quick sort on the 2023 test array (12 marks)",problem:"Explain the working of quick sort using {90, 23, 5, 109, 12, 22, 67, 34} with the middle element as pivot.",steps:["Pivot a[(0 + 7)/2] = a[3] = 109. i stops at 3 (109 is not < 109), j stops at 7 (34). Swap \u2192 [90, 23, 5, 34, 12, 22, 67, 109]. i stops at 7, j at 6: crossed. Recurse on [0..6].","[0..6], pivot a[3] = 34. i stops at 0 (90), j at 5 (22): swap \u2192 [22, 23, 5, 34, 12, 90, 67]. i stops at 3 (34), j at 4 (12): swap \u2192 [22, 23, 5, 12, 34, 90, 67]. Recurse on [0..3] and [4..6].","[0..3], pivot 23: swap 23 \u2194 12 \u2192 [22, 12, 5, 23]. Recurse on [0..2].","[0..2], pivot 12: swap 22 \u2194 5 \u2192 [5, 12, 22].","[4..6] = [34, 90, 67], pivot 90: swap 90 \u2194 67 \u2192 [34, 67, 90]. [4..5] is already in order."],answer:"[5, 12, 22, 23, 34, 67, 90, 109]. Every partition puts items \u2264 pivot on the left and \u2265 pivot on the right, then recurses."},{title:"Asymptotic analysis of quick sort (8 marks)",problem:"Explain the time performance of quick sort using asymptotic notation.",steps:["Partitioning a range of size m scans it once: \u0398(m).","Best case: each pivot halves the range. T(n) = 2T(n/2) + \u0398(n), so there are log\u2082 n levels of \u0398(n) work: \u0398(n log n).","Average case: random data gives balanced-enough splits; the expected comparisons are about 1.39 n log\u2082 n, still \u0398(n log n).","Worst case: the pivot is always the minimum or maximum. T(n) = T(n \u2212 1) + \u0398(n) = n + (n \u2212 1) + \u2026 + 1 = \u0398(n\xB2).","Space: the recursion depth is O(log n) on average and O(n) in the worst case. The middle pivot avoids the worst case on sorted input."],answer:"Best and average O(n log n), worst O(n\xB2), space O(log n) average."},{title:"Heap sort on the 2023 test array (12 marks)",problem:"Explain the working of heap sort using {90, 23, 5, 109, 12, 22, 67, 34}.",steps:["Build a max-heap from index \u230A8/2\u230B \u2212 1 = 3 down to 0: index 2 swaps 5 \u2194 67; index 1 swaps 23 \u2194 109 then 23 \u2194 34; index 0 swaps 90 \u2194 109.","Max-heap: [109, 90, 67, 34, 12, 22, 5, 23].","Swap 109 to the end, sift 23 down past 90 and 34 \u2192 [90, 34, 67, 23, 12, 22, 5 | 109].","Swap 90 to the end, sift 5 past 67 and 22 \u2192 [67, 34, 22, 23, 12, 5 | 90, 109].","Continue: 67, 34, 23, 22, 12 each go to the end in turn."],answer:"[5, 12, 22, 23, 34, 67, 90, 109]. Build O(n), n \u2212 1 extractions of O(log n): O(n log n) in every case, O(1) extra space."},{title:"Counting sort",problem:"Sort [4, 2, 2, 8, 3, 3, 1] with counting sort and show the count and running-total arrays.",steps:["Range 0..8. Counts: key 1 once, 2 twice, 3 twice, 4 once, 8 once \u2192 [0, 1, 2, 2, 1, 0, 0, 0, 1].","Running totals \u2192 [0, 1, 3, 5, 6, 6, 6, 6, 7]. The total for key x is one past the last position of x.","Scan the input right to left, decrement the total for each key and place it there."],answer:"[1, 2, 2, 3, 3, 4, 8] in O(n + k) = O(7 + 9)."},{title:"Choose the sort",problem:"Pick a sort for each: (a) 20 items, nearly sorted; (b) 10 million records that must stay in order of arrival for equal keys; (c) an embedded device with almost no spare memory that must never take quadratic time; (d) 5 million exam marks from 0 to 100.",steps:["(a) Insertion sort: adaptive, close to O(n) on nearly sorted data, tiny overhead.","(b) Merge sort (or TimSort): stable and O(n log n) guaranteed.","(c) Heap sort: O(n log n) worst case with O(1) extra space.","(d) Counting sort: k = 101, so O(n + k) is effectively linear."],answer:"Insertion, merge, heap, counting."}],exercises:[{q:"Trace quick sort with the middle pivot on {90, 23, 5, 109, 12}.",solution:"Pivot a[2] = 5: i stops at 0 (90), j at 2 (5), swap \u2192 [5, 23, 90, 109, 12]; crossed with j = 0, i = 1. Right part [1..4] pivot a[2] = 90: swap 90 \u2194 12 \u2192 [5, 23, 12, 109, 90]; parts [1..2] and [3..4]. [23, 12] pivot 23: swap \u2192 [12, 23]. [109, 90] pivot 109: swap \u2192 [90, 109]. Result [5, 12, 23, 90, 109]."},{q:"Trace heap sort on {90, 23, 5, 109, 12}, giving the max-heap and the array after each extraction.",solution:"Max-heap [109, 90, 5, 23, 12]. After extraction 1: [90, 23, 5, 12 | 109]. 2: [23, 12, 5 | 90, 109]. 3: [12, 5 | 23, 90, 109]. 4: [5 | 12, 23, 90, 109]."},{q:"Show merge sort on [38, 27, 43, 3, 9, 82, 10] using mid = (lo + hi) / 2.",solution:"Split [38, 27, 43, 3] | [9, 82, 10]. Merges: [27, 38], [3, 43] \u2192 [3, 27, 38, 43]; [9, 82], then with [10] \u2192 [9, 10, 82]; final [3, 9, 10, 27, 38, 43, 82]."},{q:"Radix sort [329, 457, 657, 839, 436, 720, 355] showing each pass.",solution:"Units: [720, 355, 436, 457, 657, 329, 839]. Tens: [720, 329, 436, 839, 355, 457, 657]. Hundreds: [329, 355, 436, 457, 657, 720, 839]."},{q:"Why does quick sort with a middle pivot handle already-sorted input well, while a first-element pivot does not?",solution:"On sorted input the middle element is the median, so each partition splits evenly and the depth is log\u2082 n: O(n log n). The first element of a sorted range is its minimum, so each partition peels off one item: n levels and O(n\xB2)."},{q:"Prove that heap sort is O(n log n) even in its best case.",solution:"Each of the n \u2212 1 extractions swaps a small leaf value into the root, and that value usually sinks most of the way down, about log\u2082 n levels. Even on sorted input the heap must be built and dismantled the same way, so the total is \u0398(n log n). (Only the build phase is O(n).)"},{q:"How many comparisons must any comparison sort make in the worst case for n = 8? Compare with n log\u2082 n.",solution:"log\u2082(8!) = log\u2082 40 320 \u2248 15.3, so at least 16 comparisons. n log\u2082 n = 24, so the bound is the same order of growth with a smaller constant."},{q:"Write counting sort for marks in the range 0 to 100.",solution:[{t:"code",java:`static int[] countingSort(int[] marks) {
    int[] count = new int[101];
    for (int m : marks) count[m]++;
    for (int k = 1; k <= 100; k++) count[k] += count[k - 1];   // running totals
    int[] out = new int[marks.length];
    for (int i = marks.length - 1; i >= 0; i--)                // right to left: stable
        out[--count[marks[i]]] = marks[i];
    return out;                                                // O(n + 101)
}`,python:`def counting_sort(marks):
    count = [0] * 101
    for m in marks:
        count[m] += 1
    for k in range(1, 101):
        count[k] += count[k - 1]
    out = [0] * len(marks)
    for m in reversed(marks):
        count[m] -= 1
        out[count[m]] = m
    return out`}]}],quiz:[{type:"mcq",q:"First pivot when quick sorting {90, 23, 5, 109, 12, 22, 67, 34} with the middle element:",options:["90","109","12","34"],answer:1,explain:"mid = (0 + 7) / 2 = 3, and a[3] = 109."},{type:"mcq",q:"Array after the first partition of {90, 23, 5, 109, 12, 22, 67, 34}:",options:["[34, 23, 5, 90, 12, 22, 67, 109]","[90, 23, 5, 34, 12, 22, 67, 109]","[5, 12, 22, 23, 34, 67, 90, 109]","[22, 23, 5, 12, 34, 90, 67, 109]"],answer:1,explain:"Only 109 and 34 swap; then the pointers cross."},{type:"mcq",q:"The max-heap built bottom-up from {90, 23, 5, 109, 12, 22, 67, 34} is:",options:["[109, 90, 67, 34, 12, 5, 22, 23]","[109, 90, 67, 34, 12, 22, 5, 23]","[109, 90, 22, 34, 12, 5, 67, 23]","[109, 67, 90, 34, 23, 22, 5, 12]"],answer:1,explain:"Sift down at 3, 2, 1, 0. (The first option comes from inserting one at a time; the third is not a heap.)"},{type:"mcq",q:"After the first extraction of heap sort on that heap, the array is:",options:["[90, 34, 67, 23, 12, 22, 5, 109]","[90, 67, 34, 23, 12, 22, 5, 109]","[23, 90, 67, 34, 12, 22, 5, 109]","[67, 34, 22, 23, 12, 5, 90, 109]"],answer:0,explain:"Swap 109 \u2194 23, then 23 sinks past 90 and 34."},{type:"complexity",q:"Worst case of heap sort:",options:["O(n)","O(n log n)","O(n\xB2)","O(log n)"],answer:1,explain:"O(n) build plus n \u2212 1 sift-downs of O(log n)."},{type:"complexity",q:"Extra space of merge sort on an array:",options:["O(1)","O(log n)","O(n)","O(n log n)"],answer:2,explain:"The merge step needs a temporary array."},{type:"complexity",q:"Counting sort of n integers in the range 0..k:",options:["O(n log n)","O(n + k)","O(nk)","O(n\xB2)"],answer:1,explain:"One pass to count, one over the counts, one to place."},{type:"mcq",q:"Which of these sorts is stable?",options:["Selection sort","Quick sort","Heap sort","Merge sort"],answer:3,explain:"Merge with <= keeps equal keys in order."},{type:"mcq",q:"Which sort makes the same number of comparisons whatever the input order?",options:["Insertion sort","Bubble sort with a flag","Selection sort","Quick sort"],answer:2,explain:"Always n(n \u2212 1)/2."},{type:"tf",q:"No comparison-based sort can have a worst case better than O(n log n).",options:["True","False"],answer:0,explain:"The decision tree has n! leaves, so its height is at least log\u2082(n!)."},{type:"tf",q:"Radix sort is a comparison sort.",options:["True","False"],answer:1,explain:"It reads digits instead of comparing keys."},{type:"mcq",q:"After the units-digit pass of LSD radix sort on [170, 45, 75, 90, 802, 24, 2, 66]:",options:["[170, 90, 802, 2, 24, 45, 75, 66]","[2, 24, 45, 66, 75, 90, 170, 802]","[802, 2, 24, 45, 66, 170, 75, 90]","[170, 90, 2, 802, 24, 45, 75, 66]"],answer:0,explain:"Grouped by last digit 0, 2, 4, 5, 6, keeping the input order within each group."},{type:"output",q:"What does this print?",code:`int[] a = {9, 7, 5, 11, 12, 2, 14, 3, 10, 6};

hurane). Five sections, 100 marks: Section A is 10 multiple-choice questions at 2 marks each (20 marks), marked automatically. Sections B to E are the four written questions of the real paper at 20 marks each (80 marks). Answer on paper, then reveal each memo and award yourself marks honestly.",sections:[{title:"Section A: Multiple choice",kind:"mcq",marksEach:2,questions:[{q:"Which data structure is used by the JVM to manage method calls, including recursive ones?",options:["Queue","Stack","Heap","Hash table"],answer:1},{q:"The value of the postfix expression 6 2 / 3 4 * + is:",options:["10","15","18","7"],answer:1},{q:"A circular queue has capacity 8, front = 6 and count = 3. The rear index is:",options:["8","0","1","9"],answer:1},{q:"In a 0-based heap array, the parent of index 7 is:",options:["2","3","4","6"],answer:1},{q:"Inorder traversal of the BST built from 50, 30, 70, 20, 40 is:",options:["50, 30, 20, 40, 70","20, 30, 40, 50, 70","20, 40, 30, 70, 50","50, 30, 70, 20, 40"],answer:1},{q:"Inserting 10, 30, 20 into an empty AVL tree requires:",options:["A single right rotation","A single left rotation","A right rotation at 30, then a left rotation at 10","No rotation"],answer:2},{q:"Java's PriorityQueue, created with no comparator, returns from poll():",options:["The largest element","The smallest element","The oldest element","A random element"],answer:1},{q:"Which sorting algorithm has O(n log n) worst-case time and O(1) extra space?",options:["Quick sort","Merge sort","Heap sort","Insertion sort"],answer:2},{q:"Which sort is stable?",options:["Selection sort","Heap sort","Quick sort","Insertion sort"],answer:3},{q:"The minimum number of comparisons any comparison sort needs in the worst case grows as:",options:["n","n log n","n\xB2","log n"],answer:1}]},{title:"Section B: Question 1, recursion and Big-O [20]",kind:"written",questions:[{q:"1.1 Explain how the factorial can be implemented using a recursive algorithm.",marks:2,model:"A method that calls itself: base case n \u2264 1 returns 1 (1); otherwise returns n \xD7 factorial(n \u2212 1), a smaller instance of the same problem (1). Code such as `return n <= 1 ? 1 : n * f(n - 1);` earns both marks."},{q:"1.2 Explain how the factorial can be implemented using an iterative algorithm.",marks:4,model:"Initialise an accumulator result = 1 (1). Loop i from 2 (or 1) up to n (1), multiplying result by i on each pass (1). Return result after the loop; no method calls itself (1)."},{q:"1.3 Explain how the performance of the recursive algorithm for factorial differs from the iterative algorithm. Consider both time and space complexity.",marks:5,model:"Both perform n multiplications, so both are O(n) time (1). Recursive: each call pushes a stack frame holding n and the return address, and all n frames are alive at the deepest point (1), so space is O(n) (1). Iterative: only result and i, so O(1) space (1). Conclusion: iteration is preferred in practice; recursion risks StackOverflowError and has call overhead (1)."},{q:"1.4 Determine the Big-O of: `int sum = 0; for (int i = 0; i < n; i++) { sum = sum + a[i]; } for (int j = 0; j < n; j++) { sum = sum + a[j]; }`",marks:3,model:"Each loop runs n times: O(n) each (1). The loops are sequential, so add: n + n = 2n (1). Drop the constant: O(n) (1)."},{q:"1.5 Determine the Big-O of: `int prod = 1; for (int i = 1; i < n; i++) { for (int j = 1; j < n; j = j * 3) { prod = prod * j; } }`",marks:3,model:"Outer loop runs n \u2212 1 times: O(n) (1). Inner loop triples j (1, 3, 9, \u2026), so it runs about log\u2083 n times: O(log n) (1). Nested, so multiply: O(n log n) (1)."},{q:"1.6 Determine the Big-O of: `int sum = 0; for (i = 0; i <= n - 1; i += 3) { for (j = n - 1; j > 0; j--) { sum = sum + (i * j); } }`",marks:3,model:"Outer loop steps by 3: about n/3 iterations, still O(n) (1). Inner loop runs n \u2212 1 times: O(n) (1). Nested: (n/3) \xD7 n = n\xB2/3 = O(n\xB2) (1)."}]},{title:"Section C: Question 2, array-based queue [20]",kind:"written",questions:[{q:"Given a queue based on an array implementation that stores an integer in each cell, implement the following operations in an object-oriented language. 2.1 Push (enqueue).",marks:5,model:"Class with an int[] array and indices or a count (1). Check for full and report or throw (1). Circular version: rear = (rear + 1) % capacity (1), data[rear] = value (1), count++ (1). A shifting version (data[count++] = value) with a full check also earns full marks if consistent with 2.2."},{q:"2.2 Pop (dequeue).",marks:5,model:"Check for empty and report or throw (1). Read the front value (1). Circular: front = (front + 1) % capacity (1), count\u2212\u2212 (1), return the value (1). For the shifting version: shift data[1..count\u22121] left by one and decrement count; mention it is O(n) versus O(1) for circular."},{q:"2.3 isEmpty.",marks:5,model:"Return a boolean (1) that is true exactly when the queue holds no items (1): count == 0 (or front == \u22121, or front == rear in the one-empty-slot design) (2). O(1) and does not modify the queue (1)."},{q:"2.4 Peek.",marks:5,model:"Check for empty first (1). Return data[front] (or data[0] in the shifting version) (2) without changing front, rear or count (1). O(1) (1)."}]},{title:"Section D: Question 3, quick sort [20]",kind:"written",questions:[{q:"3.1 Explain the working principles and time performance of the quick sort algorithm. Use the array {90, 23, 5, 109, 12, 22, 67, 34} as an example.",marks:12,model:"Principle (3): divide and conquer; choose a pivot (middle element), partition so items \u2264 pivot are left and \u2265 pivot are right, recurse on both parts. Partition levels (5): pivot a[3] = 109, swap 109 \u2194 34 \u2192 [90, 23, 5, 34, 12, 22, 67, 109]; [0..6] pivot 34: swap 90 \u2194 22, 34 \u2194 12 \u2192 [22, 23, 5, 12, 34, 90, 67]; [0..3] pivot 23: swap 23 \u2194 12 \u2192 [22, 12, 5, 23]; [0..2] pivot 12: swap 22 \u2194 5 \u2192 [5, 12, 22]; [4..6] pivot 90: swap 90 \u2194 67 \u2192 [34, 67, 90]. Final array [5, 12, 22, 23, 34, 67, 90, 109] (2). Time (2): O(n log n) average, O(n\xB2) worst. Accept a correct Lomuto trace if consistent."},{q:"3.2 Explain the time performance of quick sort using asymptotic notation.",marks:8,model:"Partitioning m items is \u0398(m) (1). Best: pivot halves each range, T(n) = 2T(n/2) + \u0398(n) (1), log\u2082 n levels \xD7 n work = \u0398(n log n) (2). Average: \u0398(n log n), about 1.39 n log\u2082 n comparisons (1). Worst: pivot is always the minimum or maximum, T(n) = T(n \u2212 1) + \u0398(n) = \u0398(n\xB2) (2). Space O(log n) average, O(n) worst; the middle pivot avoids the worst case on sorted data (1)."}]},{title:"Section E: Question 4, heap sort [20]",kind:"written",questions:[{q:"4.1 Explain the working principles and time performance of the heap sort algorithm. Use the array {90, 23, 5, 109, 12, 22, 67, 34} as an example.",marks:12,model:"Principle (3): view the array as a complete binary tree (children 2i + 1, 2i + 2); build a max-heap; repeatedly swap the root with the last heap item, shrink the heap and sift down. Build (4): sift down from index 3 to 0: 5 \u2194 67; 23 \u2194 109 then 23 \u2194 34; 90 \u2194 109 \u2192 [109, 90, 67, 34, 12, 22, 5, 23]. Extraction (3): 109 \u2194 23, sift \u2192 [90, 34, 67, 23, 12, 22, 5 | 109]; 90 \u2194 5, sift \u2192 [67, 34, 22, 23, 12, 5 | 90, 109]; continue to [5, 12, 22, 23, 34, 67, 90, 109]. Time (2): O(n log n) in every case."},{q:"4.2 Explain the time performance of heap sort using asymptotic notation.",marks:8,model:"Heap height is \u230Alog\u2082 n\u230B (1). Build phase with bottom-up heapify is O(n) (2) (O(n log n) with repeated insertion is acceptable for 1). Each of the n \u2212 1 extractions does one swap and a sift-down of O(log n) (2), so \u0398(n log n) (1). The bound holds in best, average and worst case (1). Extra space O(1), in place, not stable (1)."}]}]}};var Ix={id:"SO1",ready:!0,title:"Introduction to graphs and their representation",summary:"What a graph is, the vocabulary examiners use, and the three ways to store one in memory: adjacency matrix, adjacency list and edge list.",why:"Road networks, social networks, the internet, course prerequisites and package dependencies are all graphs. Lists and trees are special cases of graphs, so this is the most general structure in the module. Choosing the right representation decides whether an algorithm runs in O(V\xB2) or O(V + E), which is the difference between seconds and hours on a large map.",visualizers:["graphrep"],notes:[{t:"h",text:"1. What is a graph?"},{t:"p",text:"A graph **G = (V, E)** is a set of **vertices** (nodes) V and a set of **edges** E that connect pairs of vertices. Unlike a tree, a graph can contain **cycles**, can have several paths between two vertices, and has no root."},{t:"graph",g:"lecture",caption:"The lecture graph used throughout Term 3. V = {A, B, C, D, E}, E = {A\u2013B 4, A\u2013C 2, A\u2013D 7, C\u2013D 1, D\u2013B 3, D\u2013E 5}."},{t:"table",head:["Term","Meaning","Example"],rows:[["Directed graph (digraph)","Edges have a direction: A \u2192 B does not imply B \u2192 A",'Twitter "follows", one-way streets'],["Undirected graph","Edges go both ways","Facebook friendships, two-way roads"],["Weighted graph","Each edge carries a cost","Distance in km, travel time, price"],["Degree","Number of edges touching a vertex (in-degree and out-degree in a digraph)","deg(D) = 4 in the lecture graph"],["Path","A sequence of vertices joined by edges","A \u2192 C \u2192 D \u2192 E"],["Cycle","A path that starts and ends at the same vertex","A \u2192 C \u2192 D \u2192 A"],["Connected","There is a path between every pair of vertices","The lecture graph is connected"],["DAG","Directed acyclic graph: directed, with no cycles","Course prerequisites, build order"],["Simple graph","No self-loops and no repeated edges","Most exam graphs"],["Dense / sparse","E close to V\xB2 / E much smaller than V\xB2","Road maps are sparse"]]},{t:"p",text:"Two counting facts come up in tests. The **handshake lemma**: the degrees of all vertices add up to **2E**, because each edge touches two vertices. A simple undirected graph has at most **V(V \u2212 1)/2** edges (a complete graph); a simple directed graph has at most **V(V \u2212 1)**."},{t:"h",text:"2. Adjacency matrix"},{t:"p",text:"A **V \xD7 V** 2D array where `matrix[i][j]` holds the weight of the edge from i to j (or 1 for an unweighted edge), and 0 or \u221E when there is no edge. For an undirected graph the matrix is **symmetric** about the diagonal."},{t:"table",head:["","A","B","C","D","E"],rows:[["A","0","4","2","7","0"],["B","4","0","0","3","0"],["C","2","0","0","1","0"],["D","7","3","1","0","5"],["E","0","0","0","5","0"]]},{t:"h",text:"3. Adjacency list"},{t:"p",text:"An array (or map) with one **list of neighbours per vertex**, optionally storing the weight with each neighbour. It only stores edges that exist, so it uses **O(V + E)** space."},{t:"formula",text:`A \u2192 (B,4) (C,2) (D,7)

public class Graph {
    private final int V;
    private final int[][] matrix;                       // 0 = no edge
    private final List<List<int[]>> adj;                // adj.get(u) = list of {v, weight}

    public Graph(int V) {
        this.V = V;
        matrix = new int[V][V];
        adj = new ArrayList<>();
        for (int i = 0; i < V; i++) adj.add(new ArrayList<>());
    }

    // Undirected: store the edge in both directions
    public void addEdge(int u, int v, int w) {
        matrix[u][v] = w;
        matrix[v][u] = w;
        adj.get(u).add(new int[]{v, w});
        adj.get(v).add(new int[]{u, w});
    }

    public boolean hasEdge(int u, int v) { return matrix[u][v] != 0; }     // O(1)

    public List<int[]> neighbours(int u) { return adj.get(u); }           // O(deg u)

    public int degree(int u) { return adj.get(u).size(); }
}

// A=0, B=1, C=2, D=3, E=4
Graph g = new Graph(5);
g.addEdge(0, 1, 4); g.addEdge(0, 2, 2); g.addEdge(0, 3, 7);
g.addEdge(2, 3, 1); g.addEdge(3, 1, 3); g.addEdge(3, 4, 5);`,python:`class Graph:

    def add_edge(self, u, v, w=1):
        self.matrix[u][v] = self.matrix[v][u] = w
        self.adj[u].append((v, w))

    def has_edge(self, u, v):

cency list. The matrix would need about 10 GB, almost all of it zeros."}],exercises:[{q:"Write the adjacency list for the lecture graph without weights, with neighbours in alphabetical order.",solution:"A \u2192 B, C, D. B \u2192 A, D. C \u2192 A, D. D \u2192 A, B, C, E. E \u2192 D."},{q:"What is the maximum number of edges in a simple undirected graph with 8 vertices? With 8 vertices in a simple directed graph?",solution:"Undirected: 8 \xD7 7 / 2 = 28. Directed: 8 \xD7 7 = 56."},{q:"Write a Java method `int countEdges(int[][] m)` for an undirected unweighted adjacency matrix.",solution:[{t:"code",java:`static int countEdges(int[][] m) {

,q:"The maximum number of edges in a simple undirected graph with 6 vertices is:",options:["6","12","15","30"],answer:2,explain:"6 \xD7 5 / 2 = 15."},{type:"tf",q:"Every tree is a graph, but not every graph is a tree.",options:["True","False"],answer:0,explain:"A tree is a connected acyclic graph."},{type:"complexity",q:"Listing all neighbours of one vertex in an adjacency matrix costs:",options:["O(1)","O(deg)","O(V)","O(V\xB2)"],answer:2,explain:"You scan the whole row of V cells."}]},Ox={id:"SO2",ready:!0,title:"Graph traversal: BFS and DFS",summary:"Breadth-first search with a queue and depth-first search with a stack or recursion, how to trace them by hand, and what they are used for (SO2 and SO3 in the guide).",why:'Almost every graph algorithm is built on BFS or DFS. GPS "fewest stops" routes, finding friends-of-friends, web crawlers, maze solvers, detecting circular imports in code, and working out the order to build software modules all start with one of these two traversals.',visualizers:["traversal"],notes:[{t:"h",text:"1. The idea"},{t:"p",text:"**Traversal** means visiting every vertex reachable from a start vertex **exactly once**. Both algorithms keep a **visited** set so they never loop forever around a cycle. The only real difference is the container that holds the vertices waiting to be explored:"},{t:"list",items:["**BFS** uses a **queue** (FIFO). It explores in rings: all vertices 1 edge away, then 2 edges away, and so on.","**DFS** uses a **stack** (LIFO), or recursion, which uses the call stack. It follows one path as deep as possible, then backtracks."]},{t:"h",text:"2. Breadth-first search"},{t:"ol",items:["Mark the start vertex visited and enqueue it.","While the queue is not empty: dequeue a vertex u and process it.","For each neighbour v of u that is not visited: mark v visited and enqueue it."]},{t:"p",text:"Trace from **A** on the lecture graph, neighbours in alphabetical order:"},{t:"table",head:["Step","Dequeue","Enqueue (newly visited)","Queue after","Visited"],rows:[["0","\u2013","A","[A]","{A}"],["1","A","B, C, D","[B, C, D]","{A, B, C, D}"],["2","B","\u2013 (A, D already visited)","[C, D]","same"],["3","C","\u2013","[D]","same"],["4","D","E","[E]","{A, B, C, D, E}"],["5","E","\u2013","[]","done"]]},{t:"p",text:"**BFS order: A, B, C, D, E.** Because BFS reaches vertices in order of distance (in edges), the first time it reaches a vertex is along a **shortest path by number of edges**. Record each vertex's parent and you can rebuild that path."},{t:"code",title:"BFS with shortest path (fewest edges)",java:`// Returns the shortest path from src to dst by number of edges, or an empty list
static List<Integer> bfsPath(List<List<Integer>> adj, int src, int dst) {
    int n = adj.size();
    boolean[] visited = new boolean[n];
    int[] parent = new int[n];
    Arrays.fill(parent, -1);
    Queue<Integer> queue = new ArrayDeque<>();

    visited[src] = true;
    queue.add(src);
    while (!queue.isEmpty()) {
        int u = queue.poll();
        if (u == dst) break;
        for (int v : adj.get(u)) {
            if (!visited[v]) {
                visited[v] = true;        // mark when enqueued, not when dequeued
                parent[v] = u;
                queue.add(v);
            }
        }
    }
    LinkedList<Integer> path = new LinkedList<>();
    if (!visited[dst]) return path;
    for (int v = dst; v != -1; v = parent[v]) path.addFirst(v);
    return path;
}`,python:`from collections import deque

def bfs_path(adj, src, dst):
    parent = {src: None}
    q = deque([src])
    while q:
        u = q.popleft()
        if u == dst:
            break
        for v in adj[u]:
            if v not in parent:
                parent[v] = u
                q.append(v)
    if dst not in parent:
        return []
    path, v = [], dst
    while v is not None:
        path.append(v)
        v = parent[v]
    return path[::-1]`},{t:"h",text:"3. Depth-first search"},{t:"ol",items:["Visit the current vertex and mark it visited.","For each neighbour that is not visited, recursively run DFS on it.","When no unvisited neighbours remain, return (backtrack)."]},{t:"p",text:"Trace from **A**, neighbours in alphabetical order:"},{t:"table",head:["Action","Call stack (top on the right)","Order so far"],rows:[["Visit A","A","A"],["A \u2192 first unvisited neighbour B","A, B","A, B"],["B \u2192 A visited, so D","A, B, D","A, B, D"],["D \u2192 A, B visited, so C","A, B, D, C","A, B, D, C"],["C \u2192 all visited, backtrack to D","A, B, D",""],["D \u2192 E","A, B, D, E","A, B, D, C, E"],["E \u2192 backtrack all the way","(empty)","done"]]},{t:"p",text:"**DFS order: A, B, D, C, E.** Different from BFS, even from the same start, because a stack and a queue release vertices in different orders."},{t:"code",title:"DFS, recursive and iterative",java:`static void dfs(List<List<Integer>> adj, int u, boolean[] visited, List<Integer> order) {
    visited[u] = true;
    order.add(u);
    for (int v : adj.get(u))
        if (!visited[v]) dfs(adj, v, visited, order);
}

// Iterative version with an explicit stack (no StackOverflowError on huge graphs)
static List<Integer> dfsIterative(List<List<Integer>> adj, int start) {
    boolean[] visited = new boolean[adj.size()];
    Deque<Integer> stack = new ArrayDeque<>();
    List<Integer> order = new ArrayList<>();
    stack.push(start);
    while (!stack.isEmpty()) {
        int u = stack.pop();
        if (visited[u]) continue;
        visited[u] = true;
        order.add(u);
        List<Integer> nbrs = adj.get(u);
        for (int i = nbrs.size() - 1; i >= 0; i--)        // push in reverse so the
            if (!visited[nbrs.get(i)]) stack.push(nbrs.get(i)); // smallest is popped first
    }
    return order;
}`,python:`def dfs(adj, u, visited=None, order=None):

    int n = adj.size();
    int[] indeg = new int[n];
    for (List<Integer> out : adj) for (int v : out) indeg[v]++;
    Queue<Integer> q = new ArrayDeque<>();
    for (int v = 0; v < n; v++) if (indeg[v] == 0) q.add(v);
    List<Integer> order = new ArrayList<>();
    while (!q.isEmpty()) {
        int u = q.poll();
        order.add(u);
        for (int v : adj.get(u))
            if (--indeg[v] == 0) q.add(v);
    }
    if (order.size() < n) throw new IllegalStateException("Graph has a cycle");
    return order;                                   // O(V + E)
}`,python:`from collections import deque

def topo_sort(adj):
    indeg = [0] * len(adj)
    for out in adj:
